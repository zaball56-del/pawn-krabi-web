<style>
        body { font-family: 'Sarabun', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* =========================================
           Sci-Fi HUD & Cyber Vault Animations
           ========================================= */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .animate-scan {
            animation: scanline 2s linear infinite;
        }
        
        @keyframes cyberGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3), inset 0 0 20px rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.7), inset 0 0 30px rgba(16, 185, 129, 0.35); border-color: rgba(52, 211, 153, 0.9); }
        }
        .cyber-box {
            animation: cyberGlow 3s ease-in-out infinite;
        }

        @keyframes cyberGridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }
        .cyber-grid-bg {
            background-image: linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: cyberGridMove 20s linear infinite;
        }

        @keyframes radarSweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-line {
            animation: radarSweep 4s linear infinite;
            transform-origin: center;
        }

        #vault-door-container {
            perspective: 1200px;
            overflow: hidden;
        }
        .vault-panel {
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .vault-open-left {
            transform: translateX(-100%) rotateY(15deg);
        }
        .vault-open-right {
            transform: translateX(100%) rotateY(-15deg);
        }

        /* สีแดงสำหรับประเภท "ถ" (ไถ่ถอน) ทั้งตาราง หน้าจอ และเวลาพิมพ์ */
        select.type-red, input.row-red, .text-red-custom { 
            color: #dc2626 !important; 
            font-weight: bold !important; 
        }

        /* =========================================
           Print Styles
           ========================================= */
        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            
            body { 
                background: white !important; 
                color: black !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                -webkit-font-smoothing: antialiased !important;
                -moz-osx-font-smoothing: grayscale !important;
                text-rendering: geometricPrecision !important;
            }
            
            #app-container, #login-modal, #quick-scan-modal, #global-search-modal {
                display: none !important;
            }
            
            #print-preview-modal {
                display: block !important;
                position: static !important;
                padding: 0 !important;
                background: white !important;
            }
            #print-preview-modal .bg-white {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            #print-preview-scroll-area {
                overflow: visible !important;
                background: white !important;
                padding: 0 !important;
                border: none !important;
            }
            #print-preview-paper {
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                min-height: 0 !important; 
            }

            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            thead { display: table-header-group !important; }
            tr { page-break-inside: avoid !important; break-inside: avoid !important; page-break-after: auto !important; }

            table { 
                width: 100% !important; 
                max-width: 100% !important;
                border-collapse: collapse !important; 
                table-layout: auto !important; 
                page-break-inside: auto !important;
            }
            th, td { 
                border: 0.5pt solid #000 !important; 
                padding: 2px 1px !important; 
                overflow: hidden; 
                font-size: 7.5pt !important; 
                white-space: nowrap !important;
                color: #000 !important; 
            }
            input, select { 
                border: none !important; 
                background: transparent !important; 
                font-size: 7.5pt !important; 
                padding: 0 !important; 
                width: 100% !important; 
                -webkit-appearance: none; 
                white-space: nowrap !important;
                color: #000 !important; 
                font-weight: 500 !important; 
            }
            input::placeholder { color: transparent !important; }
            
            /* บังคับสีแดงตอนพิมพ์สำหรับแถว ถ */
            select.type-red, input.row-red, .print-text-red { 
                color: #dc2626 !important; 
                font-weight: bold !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            
            .bg-slate-200, .bg-emerald-50, .bg-slate-100, .bg-amber-100, .bg-amber-50, .bg-amber-50\/50, .bg-slate-300 {
                background-color: transparent !important;
            }
        }

        /* Mobile-first usability and save feedback */
        html, body { max-width: 100%; overflow-x: hidden; }
        button, select, input { touch-action: manipulation; }
        button { min-height: 34px; }
        #save-indicator {
            position: fixed; left: 10px; bottom: 10px; z-index: 45;
            display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 11px; border-radius: 999px;
            background: rgba(15, 23, 42, .94); color: #d1fae5;
            border: 1px solid rgba(16,185,129,.45);
            box-shadow: 0 5px 18px rgba(0,0,0,.22);
            font-size: 11px; pointer-events: none;
        }
        #save-indicator[data-state="error"] { color: #fecaca; border-color: #ef4444; }
        #save-indicator[data-state="pending"],
        #save-indicator[data-state="local"] { color: #fde68a; border-color: #f59e0b; }
        #ledger-tbody input, #ledger-tbody select { min-height: 32px; }
        #ledger-thead select { min-height: 34px; }
        @media (max-width: 640px) {
            header .max-w-7xl { align-items: stretch !important; }
            header .max-w-7xl > div:last-child { width: 100%; }
            header button, header label { min-height: 38px; }
            main { padding-left: 4px !important; padding-right: 4px !important; }
            main > section { border-radius: 12px !important; }
            #print-preview-modal { padding: 4px !important; }
            #print-preview-modal .bg-white.rounded-2xl {
                width: 100vw !important; max-width: 100vw !important;
                height: 96dvh !important; max-height: 96dvh !important;
            }
            #print-preview-scroll-area { padding: 8px !important; }
            #print-preview-paper { transform-origin: top left; }
            #quick-scan-modal > div { padding: 18px !important; max-height: 92dvh; overflow-y: auto; }
            #global-search-modal > div { max-height: 94dvh; }
            #global-search-modal table { min-width: 680px; }
            #ledger-tbody input, #ledger-tbody select { font-size: 12px !important; }
            #save-indicator { bottom: 6px; left: 6px; font-size: 10px; padding: 6px 9px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }

        #pdf-compare-modal .modal-panel { max-height: 94dvh; }
        #pdf-compare-results { max-height: 48dvh; overflow: auto; }
        .compare-ok { background:#ecfdf5; color:#065f46; }
        .compare-warn { background:#fffbeb; color:#92400e; }
        .compare-error { background:#fef2f2; color:#991b1b; }
        @media (max-width:640px) { #pdf-compare-modal { padding:5px !important; } #pdf-compare-modal .modal-panel { padding:12px !important; width:100% !important; } #pdf-compare-results table { min-width:680px; } }

        .print-only { display: none; }
        .ticket-duplicate { background-color: #fee2e2 !important; border: 1px solid #ef4444 !important; }
        
        #print-preview-modal .bg-white.rounded-2xl {
            max-height: 98vh; height: 98vh; max-width: 98vw; width: 98vw; margin: 0 auto;
        }
        #print-preview-scroll-area { flex-grow: 1; overflow-y: auto; background-color: #e2e8f0; padding: 2rem; }
        #print-preview-paper {
            background: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 29.7cm; min-height: 21cm; margin: 0 auto; padding: 1.5cm; box-sizing: border-box; font-family: 'Sarabun', sans-serif;
        }

        /* ===== UI v4: เมนู / ตารางตรึงหัว-ซ้าย-ขวา / การ์ดคำนวณ ===== */
        .hdr-menu{position:relative}
        .hdr-menu>summary{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#047857;border:1px solid #059669;color:#fff;font-size:12px;font-weight:600;cursor:pointer;list-style:none;min-height:34px;user-select:none}
        .hdr-menu>summary::-webkit-details-marker{display:none}
        .hdr-menu[open]>summary{background:#065f46}
        .hdr-menu-panel{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);padding:6px;z-index:60;display:flex;flex-direction:column;gap:2px}
        .menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:#0f172a;background:transparent;text-align:left;min-height:40px;cursor:pointer;border:0}
        .menu-item:hover{background:#ecfdf5}
        .menu-item.danger{color:#be123c}.menu-item.danger:hover{background:#fff1f2}
        .menu-sep{height:1px;background:#e2e8f0;margin:4px 0}
        @media (max-width:640px){.hdr-menu-panel{position:fixed;left:8px;right:8px;top:auto;margin-top:6px}}
        .ledger-scroll{max-height:78vh;max-height:78dvh;overflow:auto;position:relative}
        #ledger-thead th{position:sticky;top:0;z-index:6;background:#e2e8f0}
        #ledger-thead tr:nth-child(2) th{top:var(--h1,40px);background:#f1f5f9}
        #ledger-thead th:first-child{left:0;z-index:9}
        #ledger-tbody td:first-child{position:sticky;left:0;z-index:4;background:#f1f5f9}
        #ledger-thead tr:first-child th:last-child{right:0;z-index:8;background:#fef3c7}
        #ledger-thead tr:nth-child(2) th:nth-last-child(1){right:0;z-index:7;background:#fffbeb}
        #ledger-thead tr:nth-child(2) th:nth-last-child(2){right:var(--w3,80px);z-index:7;background:#fffbeb}
        #ledger-thead tr:nth-child(2) th:nth-last-child(3){right:calc(var(--w3,80px) + var(--w2,60px));z-index:7;background:#fffbeb}
        #ledger-tbody tr:not(:first-child):not(#foot-totals-row):not(#foot-carried-row) td:nth-last-child(1){position:sticky;right:0;z-index:3;background:#fffbeb}
        #ledger-tbody tr:not(:first-child):not(#foot-totals-row):not(#foot-carried-row) td:nth-last-child(2){position:sticky;right:var(--w3,80px);z-index:3;background:#fffbeb}
        #ledger-tbody tr:not(:first-child):not(#foot-totals-row):not(#foot-carried-row) td:nth-last-child(3){position:sticky;right:calc(var(--w3,80px) + var(--w2,60px));z-index:3;background:#fffbeb}
        #ledger-tbody tr:first-child td:last-child,#foot-totals-row td:last-child,#foot-carried-row td:last-child{position:sticky;right:0;z-index:3;background:#fffbeb}
        #ledger-tbody input,#ledger-tbody select{font-size:13px}
        .col-off{background:#e2e8f0 !important;opacity:.55;cursor:not-allowed}
        select.type-red{box-shadow:inset 3px 0 0 #dc2626}
        #daily-balance-calculator .calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        #daily-balance-calculator .calc-label{text-align:center;font-weight:700;font-size:13px;color:#334155;margin-bottom:2px}
        #daily-balance-calculator input{font-size:16px !important;font-weight:700;padding:6px 8px !important;margin-top:4px}
        #daily-balance-calculator .calc-total{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #e2e8f0;padding-top:8px;font-size:13px;color:#475569}
        #daily-balance-calculator output{font-size:20px !important;font-weight:800}
        @media (min-width:768px){#daily-balance-calculator{position:sticky;top:var(--hdr-h,56px);z-index:30}}
        @media print{.hdr-menu,.ledger-scroll{display:contents}}
        /* ===== คีย์ด่วน: ติดตั๋วใหม่ ===== */
        .qs-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
        .qs-type-btn{font-size:28px;font-weight:800;min-height:64px;border-radius:14px;border:2px solid #cbd5e1;background:#f8fafc;color:#0f172a;cursor:pointer}
        .qs-type-btn.on{background:#047857;border-color:#065f46;color:#fff}
        .qs-type-btn[data-type="ถ"].on{background:#dc2626;border-color:#991b1b}
        .qs-sec{border:1px solid #e2e8f0;border-radius:14px;padding:10px;background:#f8fafc;margin-bottom:10px}
        .qs-sec.new{background:#ecfdf5;border-color:#a7f3d0}
        .qs-sec h3{font-size:13px;font-weight:800;margin-bottom:6px;color:#334155}
        .qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .qs-grid .span2{grid-column:span 2}
        .qs-grid label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:2px}
        .qs-in{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;font-weight:700;background:#fff;color:#0f172a}
        .qs-in:focus{outline:2px solid #10b981;border-color:#10b981}
        .qs-msg{min-height:20px;font-size:13px;font-weight:700;margin:6px 0}
        .qs-msg.ok{color:#047857}.qs-msg.err{color:#be123c}
        .qs-item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #e2e8f0;padding:6px 0;font-size:12px;line-height:1.5}

        .qs-linked{box-shadow:inset 0 -3px 0 #16a34a}

        /* ===== App shell v1.1: เมนูซ้าย + หน้าแรก (ไม่แตะสูตร) ===== */
        #app-sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:#0E2A52;color:#C9D6EC;z-index:45;display:flex;flex-direction:column;padding:14px 12px;gap:2px;overflow-y:auto}

        #sb-toggle{display:none;position:fixed;left:8px;top:8px;z-index:50;width:44px;height:44px;border-radius:12px;border:0;background:#0E2A52;color:#fff;font-size:18px;cursor:pointer}

        body.app-shell #app-container{padding-left:232px}
        body.app-shell header{background:#0B2244 !important}
        body.app-shell header .text-emerald-300,body.app-shell header .text-lime-200{color:#9FB3D1 !important}
        body.page-home header > div > div:nth-child(2){display:none}

        #home-page .hp-v small{font-size:13px;font-weight:600}
