<script>
/* ลบข้อมูลเก่า: เลือกจำนวนปีที่จะเก็บย้อนหลัง สำรองไฟล์ก่อนลบเสมอ */
(function(){
  var DATE=/^\d{4}-\d{2}-\d{2}$/;
  function pad(n){ return (n<10?'0':'')+n; }
  function cutoffFor(years){
    var d=new Date(); d.setFullYear(d.getFullYear()-years);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function oldKeys(cut){
    return Object.keys(db).filter(function(k){ return DATE.test(k) && k<cut && k!==currentDate; }).sort();
  }
  function toast(m){ try{ showToast(m); }catch(e){} }
  function close(){ var el=document.getElementById('prune-modal'); if(el) el.remove(); }

  function openPrune(){
    close();
    var el=document.createElement('div'); el.id='prune-modal';
    el.style.cssText='position:fixed;inset:0;z-index:2147482000;background:rgba(2,6,23,.72);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Sarabun,sans-serif';
    el.innerHTML='<div style="width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;color:#0B2244;border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px">'
      +'<div style="font-size:19px;font-weight:700">ลบข้อมูลเก่า</div>'
      +'<label for="prune-years" style="font-size:14px">เก็บข้อมูลย้อนหลังกี่ปี</label>'
      +'<input id="prune-years" type="number" min="1" max="50" step="1" value="2" style="border:1px solid #c5cddc;border-radius:10px;padding:9px 12px;font-size:16px;width:100%">'
      +'<div id="prune-info" style="font-size:14px;background:#f1f5f9;border-radius:10px;padding:10px 12px;line-height:1.5"></div>'
      +'<div style="font-size:13px;color:#7a2e0e;background:#fff4e5;border-radius:10px;padding:10px 12px;line-height:1.5">ข้อมูลที่ลบจะหายจากฐานข้อมูลกลางและทุกเครื่อง ค้นตั๋วเก่า รายงานเดือนเก่า และตั๋วที่ยังค้างอยู่ในช่วงนั้นจะไม่เจออีก ระบบจะสำรองไฟล์ทั้งหมดให้ก่อนลบ เก็บไฟล์นั้นไว้ให้ดี</div>'
      +'<label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input id="prune-ok" type="checkbox" style="margin-top:4px"><span>เข้าใจแล้ว ลบแล้วกู้คืนได้จากไฟล์สำรองเท่านั้น</span></label>'
      +'<div id="prune-err" style="color:#b42318;font-size:13px;min-height:16px"></div>'
      +'<div style="display:flex;gap:8px;justify-content:flex-end">'
      +'<button id="prune-cancel" type="button" style="border:1px solid #c5cddc;background:#fff;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer">ยกเลิก</button>'
      +'<button id="prune-go" type="button" disabled style="border:0;background:#b42318;color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;opacity:.5">สำรองแล้วลบ</button></div></div>';
    document.body.appendChild(el);
    var yrs=document.getElementById('prune-years'), info=document.getElementById('prune-info'),
        ok=document.getElementById('prune-ok'), go=document.getElementById('prune-go'), err=document.getElementById('prune-err');
    function years(){ var v=parseInt(yrs.value,10); return (v>=1&&v<=50)?v:null; }
    function refresh(){
      var y=years(); err.textContent='';
      if(y===null){ info.textContent='ใส่จำนวนปี 1–50'; go.disabled=true; go.style.opacity='.5'; return; }
      var cut=cutoffFor(y), ks=oldKeys(cut);
      info.innerHTML='จะลบข้อมูลวันที่ก่อน <b>'+cut+'</b><br>'+(ks.length?('จำนวน <b>'+ks.length+'</b> วัน ('+ks[0]+' ถึง '+ks[ks.length-1]+')'):'ไม่มีข้อมูลที่เก่ากว่านี้');
      var can=ok.checked && ks.length>0; go.disabled=!can; go.style.opacity=can?'1':'.5';
    }
    yrs.addEventListener('input',refresh); ok.addEventListener('change',refresh);
    document.getElementById('prune-cancel').addEventListener('click',close);
    go.addEventListener('click',async function(){
      var y=years(); if(y===null) return;
      var cut=cutoffFor(y), ks=oldKeys(cut); if(!ks.length) return;
      go.disabled=true; err.textContent='กำลังสำรองไฟล์…';
      var before=null; try{ before=localStorage.getItem('pawn_krabi_last_backup'); }catch(e){}
      try{ await exportJSON(); }catch(e){ console.warn(e); }
      var after=null; try{ after=localStorage.getItem('pawn_krabi_last_backup'); }catch(e){}
      if(!after || after===before){ err.textContent='สำรองไฟล์ไม่สำเร็จ จึงยังไม่ลบ ลองกดใหม่'; go.disabled=false; return; }
      ks=oldKeys(cut);                                  // คำนวณใหม่ เผื่อข้อมูลเปลี่ยนระหว่างรอ
      ks.forEach(function(k){ delete db[k]; });
      try{ saveDB(); }catch(e){ console.warn(e); }
      close(); toast('ลบข้อมูลเก่า '+ks.length+' วันแล้ว (สำรองไฟล์ไว้แล้ว)');
    });
    refresh();
  }
  window.openPruneOldData=openPrune;

  function addButton(){
    var ref=document.querySelector('.sb-item[onclick*="openRestorePoints"]');
    if(!ref || document.getElementById('sb-prune-btn')) return;
    ref.insertAdjacentHTML('afterend','<button id="sb-prune-btn" class="sb-item" onclick="sbClose();openPruneOldData()"><span class="sb-ic" style="--c:#F87171"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14"/></svg></span>ลบข้อมูลเก่า</button>');
  }
  addButton();
})();

</script>
