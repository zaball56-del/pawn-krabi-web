<script id="qs-amount-lookup-js">
(function(){
  var T=document.getElementById('qs-ticket'), B=document.getElementById('qs-book'), A=document.getElementById('qs-amount'); if(!T||!B||!A) return;
  var hint=document.createElement('div'); hint.id='qs-amt-hint'; hint.className='qs-amt-hint'; A.parentNode.appendChild(hint);
  function norm(v){ try{return normalizeCompareTicket(v)}catch(e){return String(v||'').trim().toLowerCase()} }
  function dth(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+(parseInt(p[0],10)+543)}
  function hasVal(v){return v!==undefined&&v!==null&&String(v).replace(/,/g,'').trim()!==''&&Number(String(v).replace(/,/g,''))!==0}
  // สำรอง: ถ้าไม่พบในข้อมูลที่เคยคีย์ ให้ดูจากฐานข้อมูลตั๋วตั้งต้น (นำเข้าจากรายงานทะเบียนทรัพย์สิน)
  function baselineLookup(ticket,book){
    try{
      if(!window.__assetFindAll) return {status:'none'};
      var raw=String(ticket||'').trim(); if(!/^\d+$/.test(raw)) return {status:'none'};
      var mEl=document.getElementById('qs-month'), m=mEl?(Number(mEl.value)||0):0;
      var yr=(m&&window.__assetYearFor&&typeof currentDate!=='undefined')?window.__assetYearFor(m,currentDate):0;
      var all=window.__assetFindAll(m,raw,yr), b=norm(book);
      if(!all.length) return {status:'none'};
      if(b){ var f=all.filter(function(x){return norm(x.book)===b}); if(!f.length) return {status:'bookmismatch',books:all.map(function(x){return x.book}).join(', ')}; all=f; }
      if(all.length>1) return {status:'multibook'};
      var x=all[0]; return {status:'ok',amount:String(x.amount),date:null,month:'เดือน '+x.month+'/'+(x.year+543),src:'ฐานข้อมูลตั้งต้น',base:x};
    }catch(e){ return {status:'none'}; }
  }
  // อ่านอย่างเดียว: หาตั๋ว (เลขตั๋ว + เล่มที่ถ้ามี) จากทุกวันที่เก็บไว้ในเครื่อง
  window.qsLookupKnownAmount=function(ticket,book){
    var t=norm(ticket), b=norm(book), c=[];
    if(!t) return {status:'none'};
    var TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    var mEl0=document.getElementById('qs-month'), mn=mEl0?(Number(mEl0.value)||0):0, mName=(mn>=1&&mn<=12)?TM[mn-1]:'';
    var cutKey=''; try{ var cp=String(currentDate).split('-'); if(cp.length===3){ var cd=new Date(Number(cp[0]),Number(cp[1])-1,Number(cp[2]),12); cd.setDate(cd.getDate()-365); cutKey=cd.getFullYear()+'-'+String(cd.getMonth()+1).padStart(2,'0')+'-'+String(cd.getDate()).padStart(2,'0'); } }catch(e){}
    for(var k in db){
      if(k.indexOf('-')<0||k.length!==10) continue;
      if(cutKey&&k<=cutKey) continue;   // ไม่ดึงข้อมูลเกิน 1 ปี กันปนกับปี พ.ศ. ก่อน
      var d=db[k]; if(!d||!d.months||!d.data) continue;
      d.months.forEach(function(m){ var rows=d.data[m]; if(!m||!rows) return;
        if(mName&&String(m).trim()!==mName) return;
        rows.forEach(function(r){ if(!r) return;
          if(norm(r.ticket)===t && (!b||norm(r.book)===b) && hasVal(r.amount)) c.push({date:k,month:m,amount:String(r.amount).replace(/,/g,''),book:norm(r.book),src:'ตั๋ว'});
          if(r.newTicket&&norm(r.newTicket)===t && (!b||norm(r.newBook)===b) && hasVal(r.newAmount)) c.push({date:k,month:m,amount:String(r.newAmount).replace(/,/g,''),book:norm(r.newBook),src:'ตั๋วใหม่'});
        });
      });
    }
    if(!c.length) return baselineLookup(ticket,book);
    if(!b){ var bs={}; c.forEach(function(x){bs[x.book||'-']=1}); if(Object.keys(bs).length>1) return {status:'multibook'}; }
    c.sort(function(x,y){return x.date<y.date?1:(x.date>y.date?-1:0)});
    var best=c[0], diff=c.some(function(x){return Number(x.amount)!==Number(best.amount)});
    return {status:'ok',amount:best.amount,date:best.date,month:best.month,src:best.src,differs:diff};
  };
  function run(){
    try{
      var tk=T.value.trim(); var editable=(A.value.trim()===''||A.classList.contains('qs-auto'));
      if(!tk){ if(A.classList.contains('qs-auto')){A.value='';A.classList.remove('qs-auto')} hint.textContent='';hint.className='qs-amt-hint'; return; }
      var r=qsLookupKnownAmount(tk,B.value.trim());
      if(r.status==='ok'){
        if(r.base){ if(!B.value.trim()){ B.value=r.base.book; }
          var ME=document.getElementById('qs-month'); if(ME&&!ME.value){ ME.value=String(r.base.month); try{qsMonthHint()}catch(e){} } }
        if(editable){ A.value=formatNumber(r.amount); A.classList.add('qs-auto');
          if(r.base){ hint.className='qs-amt-hint'; hint.textContent='ดึงยอดจากฐานข้อมูลตั๋วตั้งต้น ('+r.month+' · เล่ม '+r.base.book+') แก้ไขได้'; }
          else {
          hint.className='qs-amt-hint'+(r.differs?' warn':''); hint.textContent='ดึงยอดจากข้อมูลเดิม ('+dth(r.date)+' · '+r.month+(r.src==='ตั๋วใหม่'?' · เป็นตั๋วใหม่':'')+')'+(r.differs?' — มีหลายยอด ตรวจสอบก่อนบันทึก':'')+' แก้ไขได้'; } }
        else { hint.className='qs-amt-hint'; hint.textContent=r.base?('พบในฐานข้อมูลตั๋วตั้งต้น ยอด '+formatNumber(r.amount)+' (เล่ม '+r.base.book+')'):('พบในข้อมูลเดิม ยอด '+formatNumber(r.amount)+' ('+dth(r.date)+')'); }
      } else {
        if(A.classList.contains('qs-auto')){A.value='';A.classList.remove('qs-auto')}
        hint.className='qs-amt-hint warn'; hint.textContent=r.status==='multibook'?'พบเลขตั๋วนี้หลายเล่ม ใส่เล่มที่เพื่อดึงยอด':(r.status==='bookmismatch'?'เล่มที่ไม่ตรงกับฐานข้อมูลตั๋วตั้งต้น · ตั๋วนี้อยู่เล่ม '+r.books:'ไม่พบตั๋วนี้ในข้อมูลเดิม กรอกยอดเอง');
      }
    }catch(e){console.error('qs-amount-lookup',e)}
  }
  var tm=null; function sched(){clearTimeout(tm);tm=setTimeout(run,120)}
  window.__qsRun=run;
  T.addEventListener('input',sched); B.addEventListener('input',sched);
  var MO=document.getElementById('qs-month'); if(MO) MO.addEventListener('input',sched);
  A.addEventListener('input',function(){A.classList.remove('qs-auto')});
  var oc=window.qsClearFields;
  if(typeof oc==='function') window.qsClearFields=function(){ var r=oc.apply(this,arguments); A.classList.remove('qs-auto'); hint.textContent=''; hint.className='qs-amt-hint'; return r; };
})();
</script>
