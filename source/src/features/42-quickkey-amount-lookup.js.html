<script id="qs-amount-lookup-js">
(function(){
  var T=document.getElementById('qs-ticket'), B=document.getElementById('qs-book'), A=document.getElementById('qs-amount'); if(!T||!B||!A) return;
  var hint=document.createElement('div'); hint.id='qs-amt-hint'; hint.className='qs-amt-hint'; A.parentNode.appendChild(hint);
  // เดือนที่ใช้กรอง: ปกติอ่านจากช่องเดือนของคีย์ด่วน; หน้าเขียนตั๋วตั้ง window.__qsMonthOverride ชั่วคราวเพื่อใช้ฟังก์ชันเดียวกัน (อ่านอย่างเดียว)
  function qmon(){ if(typeof window.__qsMonthOverride==='number') return window.__qsMonthOverride; var e=document.getElementById('qs-month'); return e?(Number(e.value)||0):0; }
  function norm(v){ try{return normalizeCompareTicket(v)}catch(e){return String(v||'').trim().toLowerCase()} }
  function dth(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+(parseInt(p[0],10)+543)}
  function hasVal(v){return v!==undefined&&v!==null&&String(v).replace(/,/g,'').trim()!==''&&Number(String(v).replace(/,/g,''))!==0}
  // ตัวค้นยอดย้ายไปอยู่ที่ตัวค้นกลาง ticketFind (modules/ticketfind.html) เพื่อให้ทุกหน้าใช้กฎเดียวกัน
  window.qsLookupKnownAmount=function(ticket,book){
    var ov=(typeof window.__qsMonthOverride==='number');
    return typeof window.ticketFind==='function'?window.ticketFind(ticket,book,qmon(),{tkwCtx:ov,soft:!!window.__qsSoft||(!ov&&!window.__qsMonthTyped)}):{status:'none'};
  };
  function run(){
    try{
      var tk=T.value.trim(); var editable=(A.value.trim()===''||A.classList.contains('qs-auto'));
      if(!tk){ if(A.classList.contains('qs-auto')){A.value='';A.classList.remove('qs-auto')} hint.textContent='';hint.className='qs-amt-hint'; return; }
      var r=qsLookupKnownAmount(tk,B.value.trim());
      if(r.status==='ok'){
        if(r.base&&!B.value.trim()){ B.value=r.base.book; }
        var ME=document.getElementById('qs-month'); if(ME&&(!ME.value||r.monthFallback)){ var mo=r.base?+r.base.month:((['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'].indexOf(String(r.month||'').trim()))); if(mo>=1&&mo<=12){ ME.value=String(mo); try{qsMonthHint()}catch(e){} } }
        if(editable){ A.value=formatNumber(r.amount); A.classList.add('qs-auto');
          if(r.base){ hint.className='qs-amt-hint'; hint.textContent='ดึงยอดจากทะเบียนทรัพย์รับจำนำ ('+r.month+' · เล่ม '+r.base.book+') แก้ไขได้'; }
          else {
          hint.className='qs-amt-hint'+((r.differs||r.manual)?' warn':'');
          hint.textContent=r.manual?('ดึงยอดจาก'+(r.src==='ตารางเขียนตั๋ว'?'ตารางเขียนตั๋ว':'ข้อมูลที่คีย์เอง')+' ('+dth(r.date)+' · '+r.month+') · ยังไม่ยืนยันกับ สธ.3'+(r.differs?' · มีหลายยอด':'')+' — ตรวจก่อนบันทึก'):('ดึงยอดจากข้อมูลเดิม ('+dth(r.date)+' · '+r.month+(r.src==='ตั๋วใหม่'?' · เป็นตั๋วใหม่':'')+')'+(r.differs?' — มีหลายยอด ตรวจสอบก่อนบันทึก':'')+' แก้ไขได้'); } }
        else { hint.className='qs-amt-hint'; hint.textContent=r.base?('พบในทะเบียนทรัพย์รับจำนำ ยอด '+formatNumber(r.amount)+' (เล่ม '+r.base.book+')'):('พบในข้อมูลเดิม ยอด '+formatNumber(r.amount)+' ('+dth(r.date)+')'+(r.manual?' · คีย์เอง ยังไม่ยืนยันกับ สธ.3':'')); }
      } else {
        if(A.classList.contains('qs-auto')){A.value='';A.classList.remove('qs-auto')}
        hint.className='qs-amt-hint warn'; hint.textContent=r.status==='multibook'?'พบเลขตั๋วนี้หลายเล่ม ใส่เล่มที่เพื่อดึงยอด':(r.status==='bookmismatch'?'เล่มที่ไม่ตรงกับฐานข้อมูลกลาง · ตั๋วนี้อยู่เล่ม '+r.books:'ไม่พบตั๋วนี้ในข้อมูลเดิม กรอกยอดเอง');
      }
    }catch(e){console.error('qs-amount-lookup',e)}
  }
  var tm=null; function sched(){clearTimeout(tm);tm=setTimeout(run,120)}
  window.__qsRun=run;
  T.addEventListener('input',sched); B.addEventListener('input',sched);
  var MO=document.getElementById('qs-month'); if(MO) MO.addEventListener('input',function(){ window.__qsMonthTyped=true; sched(); });
  A.addEventListener('input',function(){A.classList.remove('qs-auto')});
  var oc=window.qsClearFields;
  if(typeof oc==='function') window.qsClearFields=function(){ window.__qsMonthTyped=false; var r=oc.apply(this,arguments); A.classList.remove('qs-auto'); hint.textContent=''; hint.className='qs-amt-hint'; return r; };
})();
</script>
