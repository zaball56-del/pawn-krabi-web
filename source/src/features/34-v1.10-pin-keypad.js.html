<script>
/* v1.10 แป้นตัวเลขบนหน้าจอสำหรับใส่ PIN (เสริม ไม่แทนที่ช่องพิมพ์เดิม) */
(function(){
  function build(){
    var inp=document.getElementById('login-pin'); if(!inp||document.getElementById('login-keypad')) return;
    var kp=document.createElement('div'); kp.id='login-keypad'; kp.setAttribute('role','group'); kp.setAttribute('aria-label','แป้นตัวเลข PIN');
    var h='';
    ['1','2','3','4','5','6','7','8','9'].forEach(function(n){ h+='<button type="button" data-k="'+n+'" aria-label="เลข '+n+'" tabindex="-1">'+n+'</button>'; });
    h+='<button type="button" class="sp" tabindex="-1" aria-hidden="true"></button><button type="button" data-k="0" aria-label="เลข 0" tabindex="-1">0</button><button type="button" class="bk" data-k="bk" aria-label="ลบ" tabindex="-1">⌫</button>';
    kp.innerHTML=h;
    var wrap=inp.parentNode; wrap.parentNode.insertBefore(kp, wrap.nextSibling);
    kp.addEventListener('click',function(e){
      var b=e.target.closest('button[data-k]'); if(!b) return;
      var k=b.getAttribute('data-k'), v=String(inp.value||'');
      if(k==='bk') v=v.slice(0,-1); else if(v.length<4) v+=k;
      inp.value=v; try{ inp.dispatchEvent(new Event('input',{bubbles:true})); }catch(_){}
      try{ inp.focus(); }catch(_){}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build); else build();
})();
</script>
