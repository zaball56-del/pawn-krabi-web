<script id="gs-timeline-js">
(function(){
  var tb=document.getElementById('global-search-results'); if(!tb) return;
  var box=tb.closest('table').parentNode; var host=document.createElement('div'); host.id='gs-timeline'; box.appendChild(host);
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var TY={'ส':1,'พ':2,'ผ':3,'ถ':4};
  var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'], ML=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  function nz(v){ return String(v==null?'':v).trim().replace(/^0+(?=\d)/,''); }
  /* มือถือ (แบบที่ผู้ใช้ส่งมา 23 พ.ย. 69): หัวสีน้ำเงิน · ช่องค้นหา 3 ช่องในแถวเดียว · ผลการค้นหา · ลำดับการเปลี่ยนเล่ม
     · ยอดเงินจาก→ไป · ตาราง ลำดับ/วันที่/รายการ/จำนวนเงิน · รายละเอียดเพิ่มเติม · ปุ่มค้นหาใหม่/พิมพ์/Excel/PDF */
  function mParse(divs){
    var o={t:'',b:''}, n=null;
    divs.forEach(function(d){ var tx=d.textContent, b=d.querySelectorAll('b');
      if(/^\s*ตั๋วเดิม/.test(tx)&&b.length>=2){ o={t:b[1].textContent.trim(),b:b[0].textContent.trim()}; }
      else if(/^\s*ตั๋วใหม่/.test(tx)&&b.length>=2){ n={t:b[1].textContent.trim(),b:b[0].textContent.trim(),a:tx.indexOf('·')>-1?tx.split('·')[1].replace(/บาท/,'').trim():''}; } });
    return {o:o,n:n};
  }
  function bk(x){ return x&&x.b&&x.b!=='-'?x.b:''; }
  function same(x,y){ return !!x&&!!y&&nz(x.t)===nz(y.t)&&(!bk(x)||!bk(y)||nz(bk(x))===nz(bk(y))); }
  function num(v){ return Number(String(v==null?'':v).replace(/[^\d.\-]/g,''))||0; }
  function fm(n){ return Number(n||0).toLocaleString('en-US'); }
  /* ส่วนต่างยอด = ยอดตั๋วใหม่ − ยอดตั๋วเดิม : บวก = เพิ่มเงิน · ลบ = ผ่อนต้น (ผู้ใช้ขอ 23 พ.ย. 69) */
  function diffOf(e){ if(!e||!e.n||!e.n.a||!String(e.amt||'').trim()) return null; var d=num(e.n.a)-num(e.amt); return Math.round(d*100)/100; }
  function diffTxt(d){ return d>0?'เพิ่ม +'+fm(d):(d<0?'ผ่อน −'+fm(-d):'ยอดเท่าเดิม'); }
  function diffHtml(d){ return d>0?'เพิ่ม <b>+'+fm(d)+'</b>':(d<0?'ผ่อน <b>−'+fm(-d)+'</b>':'ยอดเท่าเดิม'); }
  function mCard(c,type,divs,via,amt,q,bq){
    var P=mParse(divs), mo=c[3].textContent.trim(), mi=ML.indexOf(mo);
    var tm=c[2].textContent.trim().replace(/:\d\d(?=\s*น?\.?$)/,'').replace(/\s*น\.?$/,'');
    return {o:P.o,n:P.n,d:c[1].textContent.trim(),tm:tm,ty:type,amt:amt,mo:mi>=0?MS[mi]:mo};
  }
  function tkh(x,me,cls){ return '<span class="gx-tk'+(cls?' '+cls:'')+(same(x,me)?' me':'')+'"><b>'+esc(x.t||'-')+'</b> / '+esc(bk(x)||'–')+'</span>'; }
  function mChain(list,me){
    var start=null;
    list.forEach(function(e){ if(!start){ if(same(e.o,me)) start=e.o; else if(e.n&&same(e.n,me)) start=e.n; } });
    if(!start) start=me;
    var nodes=[start], links=[], used=[], cur=start, k, e, g=0;
    while(g++<20){ e=null; for(k=0;k<list.length;k++){ if(used.indexOf(k)<0&&list[k].n&&same(list[k].n,cur)){ e=list[k]; used.push(k); break; } } if(!e) break; nodes.unshift(e.o); links.unshift(e); cur=e.o; }
    cur=start; g=0;
    while(g++<20){ e=null; for(k=0;k<list.length;k++){ if(used.indexOf(k)<0&&list[k].n&&same(list[k].o,cur)){ e=list[k]; used.push(k); break; } } if(!e) break; nodes.push(e.n); links.push(e); cur=e.n; }
    return {nodes:nodes,links:links};
  }
  /* แยก "ตั๋วคนละใบ" ที่เลขซ้ำกัน (เลขตั๋วเริ่มใหม่ทุกเดือน): ไล่จากเก่าไปใหม่ ต่อสายเฉพาะใบที่ยังไม่ไถ่ถอน และเล่มไม่ขัดกัน
     · ไถ่ถอน (ถ) = ใบนั้นจบ · เลขเดียวกันที่โผล่มาหลังจากนั้น = ใบใหม่ (แก้บั๊ค 26 พ.ย. 69: เดิมรวมทุกใบเป็นสายเดียว ยอดเริ่มต้น/จำนวนครั้งผิด) */
  function mGroups(list){
    var G=[], chron=list.slice().reverse();
    chron.forEach(function(e){
      var hit=null, k, g;
      for(k=G.length-1;k>=0;k--){ g=G[k]; if(!g.open||!same(g.cur,e.o)) continue;
        if(bk(g.cur)&&bk(e.o)){ hit=g; break; }          /* เล่มตรงกันทั้งคู่ = ใบเดียวกันแน่นอน */
        if(!hit) hit=g; }
      if(!hit){ hit={nodes:[e.o],ev:[],open:true,cur:e.o}; G.push(hit); }
      else if(!bk(hit.cur)&&bk(e.o)){ hit.cur=e.o; hit.nodes[hit.nodes.length-1]=e.o; }
      hit.ev.push(e);
      if(e.n){ hit.nodes.push(e.n); hit.cur=e.n; }
      if(e.ty==='ถ') hit.open=false;
    });
    G.forEach(function(g){ g.ev.reverse(); });        /* ใหม่สุดก่อน เหมือน list เดิม */
    return G;
  }
  var IC={
    tk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M12 9.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 11.6l2-.3z" fill="currentColor" stroke="none"/></svg>',
    bk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',
    sr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6v18h6"/><path d="M14 3l5 5v3"/><path d="M14 3v5h5M8 12h6M8 16h3"/><circle cx="17" cy="17" r="3"/><path d="M19.2 19.2L22 22"/></svg>',
    coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="15" cy="6" rx="6" ry="2.5"/><path d="M9 6v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V6M9 10v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4"/><ellipse cx="8" cy="14" rx="6" ry="2.5"/><path d="M2 14v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    clk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    inf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    rst:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4v6h6"/><path d="M4.5 10A8 8 0 1 1 6 17"/></svg>',
    prn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>',
    xls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
    pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M8 15h8M8 18h5"/></svg>'
  };
  var LAST=null;
  var IC2={
    sw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>',
    ly:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
    id:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4M14 10h4M14 14h4"/></svg>',
    ch:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg>',
    cb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>'
  };
  var TN={'ส':'ส่งดอก','พ':'เพิ่ม','ผ':'ผ่อน','ถ':'ไถ่ถอน'};
  function mRender(listAll,q,bq,datesAll){
    var me={t:q,b:bq}, G=mGroups(listAll), main=null, k, j;
    for(k=0;k<listAll.length&&!main;k++){ var e0=listAll[k]; if(!(same(e0.o,me)||(e0.n&&same(e0.n,me)))) continue; for(j=0;j<G.length;j++) if(G[j].ev.indexOf(e0)>=0){ main=G[j]; break; } }
    if(!main) main=G[G.length-1]||{nodes:[me],ev:listAll};
    var list=main.ev, others=G.filter(function(g){ return g!==main; }), dates=list.map(function(e){ return e.d; });
    var C={nodes:main.nodes}, first=list[list.length-1], last=list[0];
    var cur=C.nodes[C.nodes.length-1];
    var startAmt=first?num(first.amt):0, lastAmt=last?(last.n&&last.n.a?num(last.n.a):num(last.amt)):0;
    LAST={q:q,bq:bq,list:list,cur:cur,startAmt:startAmt,lastAmt:lastAmt,first:first,last:last,dates:dates,others:others.length};
    var range=dates.length?esc(dates[dates.length-1])+(dates.length>1?' – '+esc(dates[0]):''):'-';
    var h='<div class="gx-card gx-res"><span class="gx-ic">'+IC.doc+'</span><b>ผลการค้นหา</b><span class="gx-rs">พบข้อมูล <b>'+list.length+'</b> ครั้ง <i>|</i> ช่วงวันที่ '+range+'</span></div>';
    /* ซ้าย: ลำดับการเปลี่ยนตั๋ว + ข้อมูลสรุป */
    var L='<div class="gx-pane gx-chain"><div class="gx-ph">'+IC2.sw+'ลำดับการเปลี่ยนตั๋ว / เล่ม</div><div class="gx-ch-s">'+C.nodes.map(function(x){ return tkh(x,me,'c'); }).join('<span class="gx-ar">→</span>')+'</div></div>';
    var li=function(ic,k,v){ return '<li><span class="gx-li-i">'+ic+'</span><span class="gx-li-k">'+k+'</span>'+v+'</li>'; };
    L+='<div class="gx-pane gx-facts"><ul>'+li(IC2.ly,'จำนวนครั้งที่พบ','<b class="bl">'+list.length+' ครั้ง</b>')+li(IC.cal,'ช่วงวันที่','<span class="gx-li-v">'+range+'</span>')+
       li(IC2.id,'เลขที่ตั๋วปัจจุบัน','<b class="p">'+esc(cur.t||'-')+'</b>')+li(IC.bk,'เล่มปัจจุบัน','<b class="p">'+esc(bk(cur)||'–')+'</b>')+li(IC.coin,'ยอดล่าสุด','<b class="g">'+fm(lastAmt)+' ฿</b>')+'</ul></div>';
    /* ขวา: ยอดเงินเปลี่ยนจาก → เป็น */
    var R='<div class="gx-pane gx-money"><div class="gx-ph">'+IC.coin+'ยอดเงินเปลี่ยนจากเท่าไร → เป็นเท่าไร</div><div class="gx-mb">'+
      '<div class="gx-mv s"><small>ยอดเริ่มต้น</small><b>'+fm(startAmt)+' ฿</b><em>'+esc(first?first.d:'')+'</em></div><span class="gx-mar">→</span>'+
      '<div class="gx-mv e"><small>ยอดล่าสุด</small><b>'+fm(lastAmt)+' ฿</b><em>'+esc(last?last.d:'')+'</em></div></div>';
    var dd=Math.round((lastAmt-startAmt)*100)/100, pc=startAmt?Math.round(dd/startAmt*10000)/100:0;
    R+='<div class="gx-mt '+(dd>0?'up':(dd<0?'dn':'eq'))+'">'+IC2.ch+(dd>0?'เพิ่มขึ้น <b>'+fm(dd)+' ฿</b> <small>(+'+pc.toFixed(2)+'%)</small>':(dd<0?'ลดลง <b>'+fm(-dd)+' ฿</b> <small>('+pc.toFixed(2)+'%)</small>':'ยอดเท่าเดิม'))+'</div></div>';
    h+='<div class="gx-2c"><div class="gx-col">'+L+'</div><div class="gx-col">'+R+'</div></div>';
    /* ประวัติรายการทั้งหมด */
    h+='<div class="gx-pane gx-hist"><div class="gx-hh">'+IC2.cb+'<b>ประวัติรายการทั้งหมด</b></div><div class="gx-tb"><div class="gx-tr gx-th"><span>ลำดับ</span><span>วันที่</span><span>เวลา</span><span>ประเภท</span><span>เลขที่ตั๋ว</span><span>เล่มที่</span><span>จำนวนเงิน (฿)</span></div>';
    /* ลำดับ 1 = ครั้งแรก (เก่าสุด) ไล่ไปจนล่าสุด (ผู้ใช้ขอ 23 พ.ย. 69) */
    list.slice().reverse().forEach(function(e,i){
      var d=diffOf(e);
      var tk='<span class="gx-tt'+(same(e.o,me)?' me':'')+'">'+esc(e.o.t||'-')+'</span>'+(e.n?'<span class="gx-tn'+(same(e.n,me)?' me':'')+'">→ '+esc(e.n.t)+'</span>':'');
      var bb='<span class="gx-tt">'+esc(bk(e.o)||'–')+'</span>'+(e.n?'<span class="gx-tn">→ '+esc(bk(e.n)||'–')+'</span>':'');
      h+='<div class="gx-tr"><span class="gx-no">'+(i+1)+'</span><span class="gx-c-d">'+IC.cal+'<b>'+esc(e.d)+'</b></span><span class="gx-c-t">'+IC.clk+esc(e.tm||'-')+(e.tm?' น.':'')+'</span>'+
        '<span class="gx-c-y"><span class="gx-ty'+(TY[e.ty]?' t'+TY[e.ty]:'')+'">'+esc(TN[e.ty]||e.ty||'-')+'</span></span><span class="gx-c-k">'+tk+'</span><span class="gx-c-b">'+bb+'</span>'+
        '<span class="gx-m">'+esc(e.amt||'')+(d===null?'':'<small class="gx-df '+(d>0?'up':(d<0?'dn':'eq'))+'">'+diffHtml(d)+'</small>')+(e.n&&e.n.a?'<small class="gx-na">ตั๋วใหม่ '+esc(e.n.a)+'</small>':'')+'</span></div>';
    });

    if(others.length){

      others.slice().reverse().forEach(function(g){ var a=g.ev[g.ev.length-1], z=g.ev[0], za=z.n&&z.n.a?z.n.a:z.amt, red=!g.open;

          '<div class="gx-om">'+esc(a.d)+(g.ev.length>1?' – '+esc(z.d):'')+' · '+g.ev.length+' ครั้ง · ยอดล่าสุด <b>'+esc(za||'-')+'</b>'+(red?' · <span class="gx-ty t4">ไถ่ถอนแล้ว</span>':'')+'</div>'+
          '<div class="gx-ol">'+g.ev.slice().reverse().map(function(e){ return '<span>'+esc(e.d)+' · '+esc(TN[e.ty]||e.ty||'-')+' · '+esc(e.o.t||'-')+(bk(e.o)?' / '+esc(bk(e.o)):'')+(e.n?' → '+esc(e.n.t)+(bk(e.n)?' / '+esc(bk(e.n)):''):'')+' · '+esc(e.amt||'-')+'</span>'; }).join('')+'</div></div>'; });
      h+='</div>';
    }

    return '<div class="gx">'+h+'</div>';
  }
  /* ปุ่มด้านล่าง: ค้นหาใหม่ = ล้างช่องแล้วโฟกัส · Excel = ไฟล์ .csv (เปิดใน Excel ได้) · พิมพ์/PDF = พิมพ์เฉพาะผลค้นหานี้ในกรอบแยก (ไม่แตะหน้าพิมพ์บัญชี) */
  function sheetRows(){ var L=LAST; if(!L) return []; var r=[['ลำดับ','วันที่','เวลา','เดือน','ประเภท','ตั๋วเดิม','เล่มเดิม','ตั๋วใหม่','เล่มใหม่','ยอดตั๋วเดิม','ยอดตั๋วใหม่','เพิ่ม/ผ่อน']];
    L.list.slice().reverse().forEach(function(e,i){ r.push([i+1,e.d,e.tm,e.mo,e.ty,e.o.t,bk(e.o),e.n?e.n.t:'',e.n?bk(e.n):'',num(e.amt)||'',e.n&&e.n.a?num(e.n.a):'',(function(){ var d=diffOf(e); return d===null?'':diffTxt(d); })()]); }); return r; }
  window.__gxAct=function(a){
    var L=LAST, I=document.getElementById('global-search-input'), B=document.getElementById('global-search-book');
    if(a==='new'){ if(I) I.value=''; if(B) B.value=''; host.innerHTML=''; try{ tb.innerHTML=''; }catch(e){} if(I) I.focus(); return; }
    if(!L) return;
    var name='ประวัติตั๋ว_'+String(L.q).replace(/[^\w\-]/g,'')+(L.bq?'_เล่ม'+String(L.bq).replace(/[^\w\-]/g,''):'');
    if(a==='xls'){
      var csv='\ufeff'+sheetRows().map(function(r){ return r.map(function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\r\n');
      var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})), x=document.createElement('a'); x.href=url; x.download=name+'.csv'; document.body.appendChild(x); x.click(); setTimeout(function(){ URL.revokeObjectURL(url); x.remove(); },1500); return;
    }
    var rows=sheetRows(), th=rows.shift();
    var html='<!doctype html><'+'html><'+'head><meta charset="utf-8"><title>'+esc(name)+'</title><'+'style>body{font-family:Sarabun,sans-serif;margin:16mm 12mm;color:#000}h2{margin:0 0 4px;font-size:18px}p{margin:0 0 10px;font-size:13px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #555;padding:4px 6px;text-align:center}th{background:#eee}td.r{text-align:right}</'+'style></'+'head><'+'body>'+
      '<h2>ประวัติตั๋ว '+esc(L.q)+(L.bq?' / เล่ม '+esc(L.bq):'')+'</h2><p>พบข้อมูล '+L.list.length+' ครั้ง · ตั๋วปัจจุบัน '+esc(L.cur.t||'-')+' / เล่ม '+esc(bk(L.cur)||'–')+' · ยอดเริ่มต้น '+fm(L.startAmt)+' · ยอดล่าสุด '+fm(L.lastAmt)+' บาท'+(L.others?'<br>(มีตั๋วเลขเดียวกันใบอื่นอีก '+L.others+' ใบ — ไม่รวมในรายงานนี้)':'')+'</p>'+
      '<table><thead><tr>'+th.map(function(v){ return '<th>'+esc(v)+'</th>'; }).join('')+'</tr></thead><tbody>'+rows.map(function(r){ return '<tr>'+r.map(function(v,i){ return '<td'+(i>=9?' class="r"':'')+'>'+esc(i>=9&&i<=10&&v!==''?fm(v):v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></'+'body></'+'html>';
    var f=document.getElementById('gx-print'); if(f) f.remove();
    f=document.createElement('iframe'); f.id='gx-print'; f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden'; document.body.appendChild(f);
    var d=f.contentWindow.document; d.open(); d.write(html); d.close();
    setTimeout(function(){ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ console.error(e); } },300);
  };
  /* มือถือ: ป้ายบอกช่อง + ไอคอนบนหัว */
  (function(){ var row=document.getElementById('global-search-row'); if(!row||document.getElementById('gm-lbl')) return;
    [['',''],['เล่มที่',IC.bk],['เลขที่ตั๋ว',IC.tk]].forEach(function(t,i){ var l=document.createElement('span'); l.className='gm-lbl'; if(i===2) l.id='gm-lbl'; l.innerHTML=t[1]+esc(t[0]); row.insertBefore(l,row.firstChild); });
    var bt=row.querySelector('button[onclick="executeGlobalSearch()"]'); if(bt&&!bt.querySelector('svg')){ var sp=document.createElement('span'); sp.className='gx-si'; sp.innerHTML=IC.sr; bt.insertBefore(sp,bt.firstChild); }
    var h3=document.querySelector('#global-search-modal h3'); if(h3&&!h3.querySelector('.gx-hi')){ var hi=document.createElement('span'); hi.className='gx-hi'; hi.innerHTML=IC.tk; h3.insertBefore(hi,h3.firstChild); } })();
  function build(){
    host.innerHTML=''; var rows=Array.prototype.slice.call(tb.children); if(!rows.length) return;
    if(rows.length===1&&rows[0].children.length===1){var t=rows[0].textContent.trim();host.innerHTML='<div class="gs-msg'+(/ไม่พบ/.test(t)?' bad':'')+'">'+esc(t)+'</div>';return;}
    var q=(document.getElementById('global-search-input')||{}).value||'',bq=((document.getElementById('global-search-book')||{}).value||'').trim(), evs=[], mev=[], dates=rows.map(function(r){return r.children[1].textContent.trim()});
    rows.forEach(function(tr){
      var c=tr.children; if(c.length<7) return;
      var type=c[4].textContent.trim(), cell=c[5], divs=Array.prototype.slice.call(cell.children), via=false, old='', nw='';
      divs.forEach(function(d){var tx=d.textContent;
        if(/พบจากเลขตั๋วใหม่/.test(tx)&&!d.querySelector('b')){via=true;return;}
        var b=d.querySelectorAll('b');
        if(/^\s*ตั๋วเดิม/.test(tx)&&b.length>=2) old='<b class="n">'+esc(b[1].textContent)+'</b> / เล่ม '+esc(b[0].textContent);
        else if(/^\s*ตั๋วใหม่/.test(tx)&&b.length>=2){var am=tx.indexOf('·')>-1?' · '+esc(tx.split('·')[1].trim()):''; nw='<span class="gs-arrow">→</span><span class="gs-nt">'+esc(b[1].textContent)+' / เล่ม '+esc(b[0].textContent)+am+'</span>';}
      });
      var amt=c[6].textContent.trim();
      try{ mev.push(mCard(c,type,divs,via,amt,q,bq)); }catch(e){}
      evs.push('<div class="gs-ev'+(type==='ถ'?' red':'')+'"><div class="gs-r1"><span class="gs-d">'+esc(c[1].textContent.trim())+'</span><span class="gs-s">'+esc(c[2].textContent.trim())+'</span><span class="gs-ch'+(TY[type]?' t'+TY[type]:'')+'">'+esc(type||'-')+'</span><span class="gs-s">คอลัมน์ '+esc(c[3].textContent.trim())+'</span>'+(amt?'<span class="gs-amt">฿ '+esc(amt)+'</span>':'')+'</div><div class="gs-tk">'+old+nw+(via?'<span class="gs-via">พบจากเลขตั๋วใหม่</span>':'')+'</div></div>');
    });
    var hero='<div class="gs-hero"><div><small>ค้นหา</small><b>'+esc(q)+(bq?' / เล่ม '+esc(bq):'')+'</b></div><div><small>พบทั้งหมด</small><b>'+evs.length+' ครั้ง</b></div><div><small>ล่าสุด</small><b>'+esc(dates[0])+'</b></div><div><small>ครั้งแรกที่พบ</small><b>'+esc(dates[dates.length-1])+'</b></div></div>';
    var mx=''; try{ mx=mRender(mev,q,bq,dates); }catch(e){ console.error('gx',e); }
    host.innerHTML=hero+'<div class="gs-tl">'+evs.join('')+'</div>'+mx;
  }
  new MutationObserver(function(){try{build()}catch(e){console.error('gs-timeline',e)}}).observe(tb,{childList:true});
  try{build()}catch(e){}
})();
</script>
