        function hasDayData(dateStr) {
            if (!db[dateStr]) return false;
            let dayData = db[dateStr];
            let summaryMonth = "สรุปประจำวัน";
            let sumRows = dayData.data[summaryMonth] || [];
            
            let oCount = cleanNumberString(sumRows[0]?.count);
            let oAmt = cleanNumberString(sumRows[0]?.amount);
            if (oCount !== 0 || oAmt !== 0) return true;

            let pCount = cleanNumberString(sumRows[1]?.count);
            let pAmt = cleanNumberString(sumRows[1]?.amount);
            if (pCount !== 0 || pAmt !== 0) return true;

            let rCount = cleanNumberString(sumRows[3]?.count);
            let rAmt = cleanNumberString(sumRows[3]?.amount);
            if (rCount !== 0 || rAmt !== 0) return true;

            if (dayData.months) {
                for (let mName of dayData.months) {
                    if (mName && dayData.data[mName]) {
                        for (let row of dayData.data[mName]) {
                            if (row) {
                                let amt = cleanNumberString(row.amount);
                                let tkt = row.ticket ? String(row.ticket).trim() : '';
                                let typ = row.type ? String(row.type).trim() : '';
                                if (amt > 0 || tkt !== '' || typ !== '') return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        function hasDayDataIn(source, key) {
            const saved = db; db = source;
            try { return hasDayData(key); } catch (_) { return true; } finally { db = saved; }
        }

        function getLatestAvailablePreviousDate(dateStr) {
            let parts = dateStr.split('-');
            if (parts.length < 3) return null;
            let y = Number(parts[0]);
            let m = Number(parts[1]) - 1;
            let d = Number(parts[2]);
            let dObj = new Date(y, m, d, 12, 0, 0);
            
            for (let i = 1; i <= 365; i++) {
                dObj.setDate(dObj.getDate() - 1);
                let prevY = dObj.getFullYear();
                let prevM = String(dObj.getMonth() + 1).padStart(2, '0');
                let prevDay = String(dObj.getDate()).padStart(2, '0');
                let testDateStr = `${prevY}-${prevM}-${prevDay}`;
                
                if (hasDayData(testDateStr)) {
                    return testDateStr;
                }
            }
            return null;
        }

        // หาวันก่อนหน้าล่าสุดที่มีคอลัมน์เดือนนี้ (ข้ามวันที่มีแต่ยอดสรุป ไม่มีคอลัมน์เดือน เช่น วันหยุด)
        function getPrevDateForMonth(dateStr, monthName) {
            let d = getLatestAvailablePreviousDate(dateStr), guard = 0;
            while (d && guard++ < 400) {
                const day = db[d];
                if (day && Array.isArray(day.months) && day.months.includes(monthName)) return d;
                d = getLatestAvailablePreviousDate(d);
            }
            return null;
        }

        function getPreviousDaySummary() {
            let prevDate = getLatestAvailablePreviousDate(currentDate);
            if (!prevDate || !db[prevDate]) return { count: 0, amount: 0 };
            
            let prevDay = db[prevDate];
            let summaryMonth = "สรุปประจำวัน";
            let rows = prevDay.data[summaryMonth] || [];
            
            let remainingRow = rows[3] || { count: 0, amount: 0 };
            let c = cleanNumberString(remainingRow.count);
            let a = cleanNumberString(remainingRow.amount);
            
            return { count: c, amount: a };
        }

        // คำนวณยอดยกไปสุทธิของเดือนตามสูตรที่กำหนด:
        // ยอดยกไปสุทธิ = ยอดยกมาใต้เดือน - ยอดรวมรายการของเดือน
        // ใช้ยอดรวมรายการชุดเดียวกับที่แสดงท้ายคอลัมน์ (ประเภท ถ, ส, พ, ผ)
        // ตั๋วใหม่ของเดือนปัจจุบันจาก สธ.2 (รวมจำนำใหม่ + ต่อตั๋ว) บวกเข้ายอดยกไปสุทธิของเดือนนั้น
        function getSor2AddForMonth(day, monthName) {
            const z = { count: 0, amount: 0 };
            try {
                const s = day && day.sor2;
                if (!s || !monthName || s.mn !== monthName) return z;
                return { count: Number(s.n) || 0, amount: roundMoney(Number(s.amt) || 0) };
            } catch (e) { return z; }
        }

        function getMonthCarriedBalance(dateStr, targetMonthName) {
            const day = db[dateStr];
            if (!day || !Array.isArray(day.months)) return 0;
            const colIdx = day.months.indexOf(targetMonthName);
            if (colIdx === -1) return 0;

            const opening = (day.bf && day.bf[colIdx] !== undefined)
                ? cleanNumberString(day.bf[colIdx]) : 0;
            const monthlyTotal = getMonthlyRedemptionTotals(day, targetMonthName).amount;
            return roundMoney(opening + getSor2AddForMonth(day, targetMonthName).amount - monthlyTotal);
        }

        function getMonthCarriedCount(dateStr, targetMonthName) {
            const day = db[dateStr];
            if (!day || !Array.isArray(day.months)) return 0;
            const colIdx = day.months.indexOf(targetMonthName);
            if (colIdx === -1) return 0;
            const openingCount = (day.bfCount && day.bfCount[colIdx] !== undefined)
                ? cleanNumberString(day.bfCount[colIdx]) : 0;
            const monthlyCount = getMonthlyRedemptionTotals(day, targetMonthName).count;
            return openingCount + getSor2AddForMonth(day, targetMonthName).count - monthlyCount;
        }

        function getPreviousDayCarriedForMonth(targetMonthName) {
            const prevDate = getLatestAvailablePreviousDate(currentDate);
            if (!prevDate) return 0;
            return getMonthCarriedBalance(prevDate, targetMonthName);
        }

        // ยอดสรุปประจำวันเป็นข้อมูลที่ผู้ใช้กรอกเองทั้งหมด
        // ปิดการคำนวณอัตโนมัติในส่วน ย/ม, รับจำนำ, ไถ่ถอน และคงเหลือ
        // ฟังก์ชันเหล่านี้คงชื่อไว้เพื่อไม่ให้ส่วนอื่นของระบบที่เรียกใช้เกิดข้อผิดพลาด
        function isRedemptionSummaryType(type) {
            return ['ถ', 'ส', 'พ', 'ผ'].includes(String(type || '').trim());
        }

        function calculateDailySummaryValues(dateStr) {
            // ไม่เขียนหรือคำนวณค่าใด ๆ ในยอดสรุปประจำวัน
            return false;
        }

        function recalculateDailySummaryForDate(dateStr) {
            // ยอดสรุปประจำวันเป็นค่าที่ผู้ใช้กรอกเอง จึงไม่คำนวณใหม่อัตโนมัติ
            return false;
        }

        function recalculateDailySummariesThrough(dateStr) {
            // ปิดการคำนวณยอดสรุปย้อนหลังอัตโนมัติ
            return false;
        }

        // อัปเดต ย/ม ของสรุปประจำวันจากผลรวมยอดยกมารายเดือน ทั้งจำนวนรายและจำนวนเงิน
        // ทำงานแม้ไม่มีวันก่อนหน้า เพื่อไม่ให้ช่องจำนวนรายว่างหรือไม่รวมยอดเดือน
        function syncDailyOpeningFromMonthlyBF(dateStr, updateVisible = false) {
            const day = db[dateStr];
            if (!day || !Array.isArray(day.months)) return false;
            if (!day.data) day.data = {};
            const summaryKey = 'สรุปประจำวัน';
            if (!Array.isArray(day.data[summaryKey])) day.data[summaryKey] = [];
            while (day.data[summaryKey].length < 4) {
                const r = day.data[summaryKey].length;
                day.data[summaryKey].push({ type: summaryLabels[r] || '', ticket: '', amount: '', count: '' });
            }
            const opening = day.data[summaryKey][0];
            let totalCount = 0;
            let totalAmount = 0;
            // ให้ ย/ม รายวันรับยอดคงเหลือจากวันก่อนหน้าโดยตรง เพื่อไม่ให้จำนวนราย
            // คลาดเคลื่อนจากการรวมยอดยกมารายเดือนที่อาจคำนวณคนละฐานข้อมูล
            const prevDate = getLatestAvailablePreviousDate(dateStr);
            const prevDay = prevDate ? db[prevDate] : null;
            const prevSummary = prevDay && prevDay.data ? prevDay.data[summaryKey] : null;
            const prevBalance = Array.isArray(prevSummary) ? prevSummary[3] : null;
            if (prevBalance && (prevBalance.count !== '' || prevBalance.amount !== '')) {
                totalCount = cleanNumberString(prevBalance.count ?? 0);
                totalAmount = cleanNumberString(prevBalance.amount ?? 0);
            } else {
                // ถ้าไม่มีสรุปคงเหลือของวันก่อนหน้า ให้ใช้ผลรวมยอดยกมารายเดือนเป็น fallback
                day.months.forEach((monthName, idx) => {
                    if (!monthName) return;
                    totalCount += cleanNumberString(day.bfCount?.[idx] ?? 0);
                    totalAmount += cleanNumberString(day.bf?.[idx] ?? 0);
                });
            }
            const changed = cleanNumberString(opening.count) !== totalCount || cleanNumberString(opening.amount) !== totalAmount || opening.type !== 'ย/ม';
            opening.count = totalCount;
            opening.amount = totalAmount;
            opening.type = 'ย/ม';

            if (updateVisible && dateStr === currentDate) {
                const summaryColIdx = day.months.length;
                const countInput = document.querySelector(`.sum-count-input-${summaryColIdx}-0`);
                const amountInput = document.querySelector(`.sum-amount-input-${summaryColIdx}-0`);
                if (countInput) countInput.value = totalCount ? formatNumber(totalCount) : '';
                if (amountInput) amountInput.value = totalAmount ? formatNumber(totalAmount) : '';
                updateDailyBalanceCalculator();
            }
            return changed;
        }

        // ดึงยอดยกมาของแต่ละเดือนจากวันก่อนหน้าล่าสุดที่มีข้อมูล แล้วรวมเข้า ย/ม รายวัน
        // เมื่อเปิด/รีเฟรชวันปัจจุบัน ให้ forceUpdate เพื่อไม่ใช้ยอดยกมาค้างจากการบันทึกครั้งก่อน
        // จับคู่เดือนด้วยชื่อเดือน ไม่ใช่ตำแหน่งคอลัมน์
        function syncBroughtForwardForDate(dateStr, forceUpdate = false) {
            const day = db[dateStr];
            if (!day || !Array.isArray(day.months)) return false;
            const prevDate = getLatestAvailablePreviousDate(dateStr);
            const prevDay = prevDate ? db[prevDate] : null;
            let changed = false;

            if (!Array.isArray(day.bf)) day.bf = [];
            if (!Array.isArray(day.bfCount)) day.bfCount = [];
            while (day.bf.length < day.months.length) { day.bf.push(0); changed = true; }
            while (day.bfCount.length < day.months.length) { day.bfCount.push(0); changed = true; }

            if (prevDay) {
                day.months.forEach((monthName, idx) => {
                    if (!monthName) return;
                    const srcDate = getPrevDateForMonth(dateStr, monthName);
                    if (!srcDate) return;
                    const carried = getMonthCarriedBalance(srcDate, monthName);
                    const carriedCount = getMonthCarriedCount(srcDate, monthName);
                    // ป้องกันข้อมูลยอดยกมาที่ผู้ใช้บันทึกไว้หายเมื่อรีเฟรช:
                    // ตอนเปิดหน้าให้เติมเฉพาะช่องว่าง/ศูนย์ แต่เมื่อแก้ข้อมูลย้อนหลัง
                    // ให้ forceUpdate=true เพื่อส่งยอดใหม่ไปยังวันถัดไป
                    const currentAmount = cleanNumberString(day.bf[idx]);
                    const currentCount = cleanNumberString(day.bfCount[idx]);
                    const hasAmount = day.bf[idx] !== '' && day.bf[idx] !== null && day.bf[idx] !== undefined && currentAmount !== 0;
                    const hasCount = day.bfCount[idx] !== '' && day.bfCount[idx] !== null && day.bfCount[idx] !== undefined && currentCount !== 0;
                    if ((forceUpdate || !hasAmount) && currentAmount !== carried) { day.bf[idx] = carried; changed = true; }
                    if ((forceUpdate || !hasCount) && currentCount !== carriedCount) { day.bfCount[idx] = carriedCount; changed = true; }
                });
            }

            // สำคัญ: รวม ย/ม จากทุกเดือนเสมอ ไม่ผูกไว้เฉพาะกรณีที่มีวันก่อนหน้า
            if (syncDailyOpeningFromMonthlyBF(dateStr, dateStr === currentDate)) changed = true;
            if (recalculateDailySummaryForDate(dateStr)) changed = true;
            return changed;
        }

        // เมื่อยอดของวันย้อนหลังเปลี่ยน ให้คำนวณวันถัดไปตามลำดับวันที่
        // รวมทั้ง ย/ม รายวันและยอดยกมารายเดือน โดยไม่ต้องล้างข้อมูล
        function recalculateFutureBroughtForwardBalances(fromDate) {
            const futureDates = Object.keys(db)
                .filter(dateStr => dateStr > fromDate && db[dateStr] && Array.isArray(db[dateStr].months))
                .sort();
            let changed = false;
            futureDates.forEach(dateStr => {
                if (syncBroughtForwardForDate(dateStr, true)) changed = true;
            });
            if (changed) saveDB();
        }

        function getCurrentDayData() {
            const INITIAL_ROWS = 60;
            let createdNewDay = false;
            
            if (!db[currentDate]) {
                createdNewDay = true;
                // วันใหม่: สืบทอดชื่อเดือนและยอดคงเหลือจากวันทำการล่าสุดโดยอัตโนมัติ
                const previousDate = getLatestAvailablePreviousDate(currentDate);
                const previousDay = previousDate ? db[previousDate] : null;
                // ใช้ 6 คอลัมน์เป็นฐานเสมอ แต่ยังเก็บคอลัมน์เพิ่มเติมที่ผู้ใช้เพิ่มไว้ในวันก่อนหน้า
                let defaultMonths = previousDay && Array.isArray(previousDay.months)
                    ? previousDay.months.slice() : ["", "", "", "", "", ""];
                while (defaultMonths.length < 6) defaultMonths.push("");
                let defaultBf = defaultMonths.map(monthName =>
                    monthName && previousDay && previousDay.months.includes(monthName)
                        ? getMonthCarriedBalance(previousDate, monthName) : 0
                );
                let defaultBfCount = defaultMonths.map(monthName =>
                    monthName && previousDay && previousDay.months.includes(monthName)
                        ? getMonthCarriedCount(previousDate, monthName) : 0
                );

                db[currentDate] = {
                    months: defaultMonths,
                    bf: defaultBf,
                    bfCount: defaultBfCount,
                    customTotals: [],
                    customCarried: [],
                    totalRows: INITIAL_ROWS,
                    data: {}
                };
                
                db[currentDate].months.forEach(m => {
                    if (m !== undefined && m !== "") {
                        db[currentDate].data[m] = new Array(INITIAL_ROWS).fill(null).map((_, i) => ({ type: '', ticket: '', amount: '', count: '', origIdx: i, timestamp: '' }));
                    }
                });
                db[currentDate].data["สรุปประจำวัน"] = new Array(INITIAL_ROWS).fill(null).map((_, i) => {
                    let defLbl = i < summaryLabels.length ? summaryLabels[i] : '';
                    return { type: defLbl, ticket: '', amount: '', count: '', origIdx: i, timestamp: '' };
                });
            }
            
            if (!Array.isArray(db[currentDate].months)) {
                db[currentDate].months = ["", "", "", "", "", ""];
            }
            // วันที่เก่าที่มีน้อยกว่า 6 คอลัมน์ ให้เติมช่องว่างต่อท้ายโดยไม่ย้าย/เขียนทับข้อมูลเดิม
            while (db[currentDate].months.length < 6) db[currentDate].months.push("");

            if (!Array.isArray(db[currentDate].bf)) {
                db[currentDate].bf = new Array(db[currentDate].months.length).fill(0);
            }
            while (db[currentDate].bf.length < db[currentDate].months.length) db[currentDate].bf.push(0);

            if (!Array.isArray(db[currentDate].bfCount)) {
                db[currentDate].bfCount = new Array(db[currentDate].months.length).fill(0);
            }
            while (db[currentDate].bfCount.length < db[currentDate].months.length) db[currentDate].bfCount.push(0);

            if (!Array.isArray(db[currentDate].customTotals)) {
                db[currentDate].customTotals = new Array(db[currentDate].months.length).fill('');
            }
            while (db[currentDate].customTotals.length < db[currentDate].months.length) db[currentDate].customTotals.push('');

            if (!Array.isArray(db[currentDate].customCarried)) {
                db[currentDate].customCarried = new Array(db[currentDate].months.length).fill('');
            }
            while (db[currentDate].customCarried.length < db[currentDate].months.length) db[currentDate].customCarried.push('');
            if (!db[currentDate].totalRows) {
                db[currentDate].totalRows = INITIAL_ROWS;
            } else if (db[currentDate].totalRows < 5) {
                db[currentDate].totalRows = 5; // ขั้นต่ำให้แถวสรุปประจำวันแสดงครบ
            }
            
            let summaryMonth = "สรุปประจำวัน";
            if (!db[currentDate].data[summaryMonth]) {
                db[currentDate].data[summaryMonth] = new Array(db[currentDate].totalRows).fill(null).map((_, i) => {
                    let defLbl = i < summaryLabels.length ? summaryLabels[i] : '';
                    return { type: defLbl, ticket: '', amount: '', count: '', origIdx: i, timestamp: '' };
                });
            } else {
                while(db[currentDate].data[summaryMonth].length < db[currentDate].totalRows) {
                    let newIdx = db[currentDate].data[summaryMonth].length;
                    let defLbl = newIdx < summaryLabels.length ? summaryLabels[newIdx] : '';
                    db[currentDate].data[summaryMonth].push({ type: defLbl, ticket: '', amount: '', count: '', origIdx: newIdx, timestamp: '' });
                }
                for(let i = 0; i < summaryLabels.length; i++) {
                    if(db[currentDate].data[summaryMonth][i]) {
                        db[currentDate].data[summaryMonth][i].type = summaryLabels[i];
                    }
                }
            }

            db[currentDate].months.forEach(m => {
                if (m !== undefined && m !== "") {
                    if (!db[currentDate].data[m]) {
                        db[currentDate].data[m] = new Array(db[currentDate].totalRows).fill(null).map((_, i) => ({ type: '', ticket: '', amount: '', count: '', origIdx: i, timestamp: '' }));
                    }
                    while(db[currentDate].data[m].length < db[currentDate].totalRows) {
                        let newIdx = db[currentDate].data[m].length;
                        db[currentDate].data[m].push({ type: '', ticket: '', amount: '', count: '', origIdx: newIdx, timestamp: '' });
                    }
                    db[currentDate].data[m].forEach((item, i) => {
                        if (item && item.origIdx === undefined) {
                            item.origIdx = i;
                        }
                    });
                }
            });

            // ยอดสรุปประจำวันเก็บตามข้อมูลของวันที่เปิดอยู่ ไม่อ่าน/ปนค่าจากวันที่แสดงก่อนหน้า

            // บันทึกเมื่อสร้างวันใหม่หรือเมื่อเติมคอลัมน์/อาร์เรย์พื้นฐาน เพื่อให้หกคอลัมน์และยอดเดิมคงอยู่
            if (createdNewDay) saveDB();
            return db[currentDate];
        }

        // บีบขนาดข้อมูลตอนบันทึก: ตัดแถวว่างท้ายรายการของแต่ละเดือน (ไม่แตะสรุปประจำวัน)
        // ทำเฉพาะเมื่อลำดับแถวยังเป็นลำดับเดิม (origIdx === index) เพื่อไม่ให้ลำดับเพี้ยน
        // ตอนโหลด getCurrentDayData จะเติมแถวว่างกลับให้ครบตาม totalRows เหมือนเดิม
        function isBlankStoredRow(r) {
            if (!r) return true;
            return String(r.type ?? '').trim() === '' && String(r.ticket ?? '').trim() === '' &&
                   String(r.amount ?? '').trim() === '' && String(r.count ?? '').trim() === '' &&
                   !r.importSource;
        }
        function stripTrailingBlankRows(key, value) {
            if (key === 'สรุปประจำวัน' || !Array.isArray(value) || !value.length) return value;
            const first = value[0];
            if (!first || typeof first !== 'object' || !('origIdx' in first)) return value;
            for (let i = 0; i < value.length; i++) {
                if (!value[i] || value[i].origIdx !== i) return value;
            }
            let end = value.length;
            while (end > 0 && isBlankStoredRow(value[end - 1])) end--;
            return end === value.length ? value : value.slice(0, end);
        }
        function serializeDBCompact() { return JSON.stringify(db, stripTrailingBlankRows); }

        function saveDB() {
            let serialized;
            try {
                serialized = serializeDBCompact();
            } catch (error) {
                console.error('แปลงข้อมูลเพื่อบันทึกไม่สำเร็จ:', error);
                setSaveIndicator('error', 'บันทึกไม่สำเร็จ · ข้อมูลมีข้อผิดพลาด');
                return false;
            }

            const savedAt = Date.now();
            let localSaved = false;
            try {
                localStorage.setItem('pawn_krabi_master_db', serialized);
                localStorage.setItem('pawn_krabi_saved_at', String(savedAt));
                localSaved = true;
            } catch (error) {
                console.error('Local Storage บันทึกไม่สำเร็จ:', error);
            }

            scheduleIndexedDBSave(serialized);
            if (localSaved) {
                setSaveIndicator('saved', 'บันทึกอัตโนมัติในเครื่องแล้ว');
                return true;
            }
            // พื้นที่ Local Storage เต็ม/ใช้ไม่ได้ → ใช้ IndexedDB (พื้นที่ใหญ่กว่ามาก) เป็นที่เก็บหลักแทน
            if (typeof indexedDB !== 'undefined') {
                if (indexedDBSaveTimer) clearTimeout(indexedDBSaveTimer);
                writeIndexedDBSnapshot(serialized).then(() => {
                    setSaveIndicator('saved', 'บันทึกในที่เก็บสำรองของเบราว์เซอร์แล้ว (พื้นที่หลักเต็ม)');
                }).catch(error => {
                    console.warn('IndexedDB บันทึกไม่สำเร็จ:', error);
                    setSaveIndicator('pending', 'บันทึกหลักไม่สำเร็จ · กรุณาสำรอง JSON');
                });
                return true;
            }
            setSaveIndicator('pending', 'บันทึกหลักไม่สำเร็จ · กรุณาสำรอง JSON');
            return false;
        }

        // แสดงข้อความแจ้งเตือนมุมจอ (เดิมถูกเรียกใช้ 19 จุดแต่ไม่มีนิยาม ทำให้เกิด ReferenceError หลังบันทึกสำเร็จ)
        let toastTimer = null;
        function showToast(message) {
            try {
                const toast = document.getElementById('toast');
                const label = document.getElementById('toast-msg');
                if (!toast) return;
                if (label) label.textContent = message;
                toast.classList.remove('translate-y-20', 'opacity-0');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
            } catch (_) { /* การแจ้งเตือนต้องไม่ทำให้ขั้นตอนหลักล้มเหลว */ }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        let pendingBroughtForwardImport = null;

        function previewBroughtForwardImport() {
            const dayData = getCurrentDayData();
            const previousDate = getLatestAvailablePreviousDate(currentDate);
            const previousDay = previousDate ? db[previousDate] : null;
            const modal = document.getElementById('brought-forward-modal');
            const content = document.getElementById('brought-forward-preview-content');
            const sourceLabel = document.getElementById('brought-forward-source-date');

            if (!previousDay || !Array.isArray(previousDay.months)) {
                pendingBroughtForwardImport = null;
                sourceLabel.textContent = 'ไม่พบวันก่อนหน้าที่มีข้อมูลภายใน 365 วัน';
                content.innerHTML = '<div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-amber-900 text-sm">ไม่พบข้อมูลวันก่อนหน้า จึงยังไม่มีรายการยอดยกมาให้นำเข้า</div>';
                document.getElementById('apply-brought-forward-button').disabled = true;
                document.getElementById('apply-brought-forward-button').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                const rows = [];
                dayData.months.forEach((monthName, idx) => {
                    if (!monthName) return;
                    const srcDate = getPrevDateForMonth(currentDate, monthName);
                    const previousHasMonth = !!srcDate;
                    const carried = previousHasMonth ? getMonthCarriedBalance(srcDate, monthName) : null;
                    const carriedCount = previousHasMonth ? getMonthCarriedCount(srcDate, monthName) : null;
                    rows.push({ monthName, idx, previousHasMonth, carried, carriedCount, srcDate, current: cleanNumberString(dayData.bf?.[idx] ?? 0) });
                });
                pendingBroughtForwardImport = { date: currentDate, previousDate, rows };
                sourceLabel.textContent = `วันที่ปัจจุบัน ${currentDate} · จะดึงจากวันที่มีข้อมูลล่าสุด ${previousDate}`;
                content.innerHTML = rows.length ? `
                    <p class="text-sm text-slate-600 mb-3">ตรวจสอบยอดด้านล่างก่อนกด “นำยอดที่แสดงไปใช้” ยอดจะยังไม่เปลี่ยนจนกว่าจะยืนยัน</p>
                    <div class="overflow-x-auto rounded-xl border border-slate-200">
                      <table class="w-full text-sm border-collapse">
                        <thead><tr class="bg-slate-100 text-slate-700"><th class="p-2 text-left border-b">เดือน</th><th class="p-2 text-right border-b">ยอดยกมาปัจจุบัน</th><th class="p-2 text-right border-b">ยอดยกไปสุทธิจากวันก่อนหน้า</th><th class="p-2 text-center border-b">สถานะ</th></tr></thead>
                        <tbody>${rows.map(r => `<tr class="${r.previousHasMonth ? '' : 'bg-amber-50'}"><td class="p-2 border-b font-semibold">${escapeHtml(r.monthName)}</td><td class="p-2 border-b text-right tabular-nums">${formatNumber(r.current)}</td><td class="p-2 border-b text-right tabular-nums">${r.previousHasMonth ? formatNumber(r.carried) : '—'}</td><td class="p-2 border-b text-center ${r.previousHasMonth ? 'text-emerald-700' : 'text-amber-700'}">${r.previousHasMonth ? 'พร้อมนำเข้า (จากวันที่ ' + r.srcDate + ')' : 'ไม่พบเดือนนี้ในวันก่อนหน้า'}</td></tr>`).join('')}</tbody>
                      </table>
                    </div>
                    ${rows.some(r => !r.previousHasMonth) ? '<p class="text-xs text-amber-800 mt-3">หมายเหตุ: เดือนที่ไม่พบในวันก่อนหน้าจะไม่ถูกเปลี่ยนแปลง</p>' : ''}
                ` : '<div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-amber-900 text-sm">ยังไม่ได้เลือกชื่อเดือนในตารางนี้ กรุณาเลือกเดือนก่อน แล้วลองอีกครั้ง</div>';
                const canApply = rows.some(r => r.previousHasMonth);
                document.getElementById('apply-brought-forward-button').disabled = !canApply;
                document.getElementById('apply-brought-forward-button').classList.toggle('opacity-50', !canApply);
                document.getElementById('apply-brought-forward-button').classList.toggle('cursor-not-allowed', !canApply);
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeBroughtForwardPreview() {
            const modal = document.getElementById('brought-forward-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingBroughtForwardImport = null;
        }

        function applyBroughtForwardImport() {
            const pending = pendingBroughtForwardImport;
            if (!pending || pending.date !== currentDate || !db[pending.date]) {
                closeBroughtForwardPreview();
                alert('วันที่เปิดอยู่เปลี่ยนไปแล้ว กรุณากดดึงยอดยกมาอีกครั้ง');
                return;
            }
            const dayData = db[pending.date];
            if (!Array.isArray(dayData.bf)) dayData.bf = new Array(dayData.months.length).fill(0);
            let imported = 0;
            pending.rows.forEach(row => {
                if (row.previousHasMonth && dayData.months[row.idx] === row.monthName) {
                    dayData.bf[row.idx] = row.carried;
                    if (!Array.isArray(dayData.bfCount)) dayData.bfCount = new Array(dayData.months.length).fill(0);
                    dayData.bfCount[row.idx] = row.carriedCount;
                    imported++;
                }
            });
            saveDB();
            closeBroughtForwardPreview();
            renderTable();
            showToast(`นำยอดยกมาจากวันที่ ${pending.previousDate} มาใช้ ${imported} เดือนแล้ว`);
        }

        function addMonthCol() {
            const dayData = getCurrentDayData();

            if (dayData.months.includes("")) {
                alert("มีคอลัมน์ที่ยังเป็น 'เลือกเดือน' อยู่ กรุณาเลือกชื่อเดือนให้ครบก่อนเพิ่มคอลัมน์ใหม่ครับ");
                return;
            }

            // เพิ่มคอลัมน์ว่างเท่านั้น ไม่เดาชื่อเดือนหรือดึงยอดยกมาติดมาด้วยโดยอัตโนมัติ
            dayData.months.push("");
            if (!Array.isArray(dayData.bf)) dayData.bf = [];
            if (!Array.isArray(dayData.bfCount)) dayData.bfCount = [];
            if (!Array.isArray(dayData.customTotals)) dayData.customTotals = [];
            if (!Array.isArray(dayData.customCarried)) dayData.customCarried = [];
            dayData.bf.push(0);
            dayData.bfCount.push(0);
            dayData.customTotals.push("");
            dayData.customCarried.push("");

            saveDB();
            renderTable();
            showToast("เพิ่มคอลัมน์ว่างแล้ว กรุณาเลือกเดือนก่อนกรอกข้อมูล");
        }

        function removeMonthCol() {
            let dayData = getCurrentDayData();
            if (dayData.months.length <= 1) {
                alert('ต้องเหลือคอลัมน์เดือนไว้อย่างน้อย 1 คอลัมน์ครับ');
                return;
            }
            if (confirm('คุณต้องการลดคอลัมน์เดือนขวาสุดออกใช่หรือไม่?')) {
                dayData.months.pop();
                dayData.bf.pop();
                if (Array.isArray(dayData.bfCount)) dayData.bfCount.pop();
                dayData.customTotals.pop();
                dayData.customCarried.pop();
                saveDB();
                renderTable();
                showToast('ลดคอลัมน์เดือนสำเร็จ');
            }
        }

        function trimEmptyRows() {
            let dayData = getCurrentDayData();
            let maxUsedIdx = 3;

            for (let r = 0; r < dayData.totalRows; r++) {
                let hasDataInRow = false;
                
                dayData.months.forEach(m => {
                    if (m && dayData.data[m] && dayData.data[m][r]) {
                        let d = dayData.data[m][r];
                        if ((d.type && d.type !== '') || (d.ticket && d.ticket !== '') || (d.amount && d.amount !== '')) {
                            hasDataInRow = true;
                        }
                    }
                });
                
                let dSum = dayData.data["สรุปประจำวัน"] ? dayData.data["สรุปประจำวัน"][r] : null;
                if (dSum) {
                    if ((dSum.count && dSum.count !== '') || (dSum.amount && dSum.amount !== '')) {
                        hasDataInRow = true;
                    }
                    if (r >= 4 && dSum.type && dSum.type !== '') {
                        hasDataInRow = true;
                    }
                }
                
                if (hasDataInRow) {
                    maxUsedIdx = r;
                }
            }

            let newTotalRows = Math.max(maxUsedIdx + 2, 5);

            if (newTotalRows < dayData.totalRows) {
                if (confirm(`ระบบพบแถวว่างท้ายตาราง จะทำการตัดออกเหลือ ${newTotalRows} แถว (เพื่อให้พอดีกับการพิมพ์และไม่เปลืองกระดาษ) ยืนยันหรือไม่?`)) {
                    dayData.months.forEach(m => {
                        if (m && dayData.data[m]) {
                            dayData.data[m] = dayData.data[m].slice(0, newTotalRows);
                        }
                    });
                    let summaryMonth = "สรุปประจำวัน";
                    if (dayData.data[summaryMonth]) {
                        dayData.data[summaryMonth] = dayData.data[summaryMonth].slice(0, newTotalRows);
                    }
                    dayData.totalRows = newTotalRows;
                    saveDB();
                    renderTable();
                    showToast(`ตัดแถวว่างออกเหลือ ${newTotalRows} แถวเรียบร้อย`);
                }
            } else {
                alert("ตารางมีความกระชับพอดีกับข้อมูลแล้ว ไม่มีแถวว่างส่วนเกินให้ตัดครับ");
            }
        }

        function changeDate() {
            let rawDate = document.getElementById('doc-date').value;
            if (!rawDate) { // ผู้ใช้กดล้างช่องวันที่: คืนค่าเดิม ไม่สร้างวันที่ว่างในฐานข้อมูล
                document.getElementById('doc-date').value = currentDate;
                return;
            }
            if (rawDate) {
                let parts = rawDate.split('-');
                let y = parseInt(parts[0], 10);
                if (y > 2500) { 
                    y -= 543;
                    rawDate = `${y}-${parts[1]}-${parts[2]}`;
                    document.getElementById('doc-date').value = rawDate;
                }
            }
            currentDate = rawDate;
            localStorage.setItem('pawn_krabi_selected_date', currentDate); try { localStorage.setItem('pawn_krabi_selected_on', getTodayLocalDateStr()); } catch (_) {}
            updateHeaderInfo(currentDate);
            document.getElementById('sort-order').value = 'normal';
            currentSortOrder = 'normal';
            getCurrentDayData();
            if (syncBroughtForwardForDate(currentDate, false)) saveDB();
            renderTable();
            showToast('โหลดข้อมูลวันที่ ' + currentDate + ' พร้อมตรวจสอบยอดยกมาอัตโนมัติแล้ว');
        }

        function changeSortOrder() {
            currentSortOrder = document.getElementById('sort-order').value;
            let dayData = getCurrentDayData();
            
            if (currentSortOrder === 'ticket-asc') {
                for (let cIdx = 0; cIdx < dayData.months.length; cIdx++) {
                    let m = dayData.months[cIdx];
                    if (m && m !== "" && dayData.data[m]) {
                        dayData.data[m].sort((a, b) => {
                            let tA = (a.ticket !== '' && a.ticket !== null && a.ticket !== undefined) ? String(a.ticket).trim() : '';
                            let tB = (b.ticket !== '' && b.ticket !== null && b.ticket !== undefined) ? String(b.ticket).trim() : '';
                            if (tA === '' && tB === '') return 0;
                            if (tA === '') return 1;
                            if (tB === '') return -1;
                            let numA = Number(tA);
                            let numB = Number(tB);
                            if (!isNaN(numA) && !isNaN(numB)) {
                                return numA - numB;
                            }
                            return tA.localeCompare(tB, 'th');
                        });
                    }
                }
                saveDB();
                showToast('เรียงเลขตั๋ว: น้อยไปมากสำเร็จ');
            } else if (currentSortOrder === 'normal') {
                for (let cIdx = 0; cIdx < dayData.months.length; cIdx++) {
                    let m = dayData.months[cIdx];
                    if (m && m !== "" && dayData.data[m]) {
                        dayData.data[m].sort((a, b) => a.origIdx - b.origIdx);
                    }
                }
                saveDB();
                showToast('คืนค่าการเรียงลำดับปกติสำเร็จ');
            }
            renderTable();
        }

        function updateMonthName(colIdx, val) {
            let dayData = getCurrentDayData();
            if (val !== "") {
                for (let i = 0; i < dayData.months.length; i++) {
                    if (i !== colIdx && dayData.months[i] === val) {
                        alert("เดือน '" + val + "' ถูกเลือกไปแล้วในคอลัมน์อื่น กรุณาเลือกเดือนอื่นครับ");
                        renderTable(); 
                        return;
                    }
                }
            }
            let oldMonth = dayData.months[colIdx];
            dayData.months[colIdx] = val;

            // เมื่อเลือกเดือนอย่างชัดเจน ให้ดึงยอดยกมาของเดือนเดียวกันจากวันก่อนหน้า
            // ทั้งจำนวนรายและจำนวนเงิน โดยไม่คัดลอกแถวรายการของเดือนเก่ามาปะปน
            if (!Array.isArray(dayData.bf)) dayData.bf = new Array(dayData.months.length).fill(0);
            if (!Array.isArray(dayData.bfCount)) dayData.bfCount = new Array(dayData.months.length).fill(0);
            if (val) {
                const previousDate = getLatestAvailablePreviousDate(currentDate);
                const previousDay = previousDate ? db[previousDate] : null;
                const hasPreviousMonth = previousDay && Array.isArray(previousDay.months) && previousDay.months.includes(val);
                dayData.bf[colIdx] = hasPreviousMonth ? getMonthCarriedBalance(previousDate, val) : 0;
                dayData.bfCount[colIdx] = hasPreviousMonth ? getMonthCarriedCount(previousDate, val) : 0;
                if (!dayData.data[val]) {
                    dayData.data[val] = new Array(dayData.totalRows).fill(null).map((_, i) => ({ type: '', ticket: '', amount: '', count: '', origIdx: i, timestamp: '' }));
                }
            } else {
                dayData.bf[colIdx] = 0;
                dayData.bfCount[colIdx] = 0;
            }

            saveDB();
            recalculateFutureBroughtForwardBalances(currentDate);
            renderTable();
        }

        function updateBF(colIdx, val) {
            let dayData = getCurrentDayData();
            if (!dayData.bf) dayData.bf = new Array(dayData.months.length).fill(0);
            if (val === '') {
                dayData.bf[colIdx] = 0;
            } else {
                let cleanVal = cleanNumberString(val);
                dayData.bf[colIdx] = cleanVal;
            }
            saveDB();
            syncDailyOpeningFromMonthlyBF(currentDate, true);
            recalculateFutureBroughtForwardBalances(currentDate);
            updateFooterTotalsOnly();
        }

        function updateBFCount(colIdx, val) {
            let dayData = getCurrentDayData();
            if (!dayData.bfCount) dayData.bfCount = new Array(dayData.months.length).fill(0);
            dayData.bfCount[colIdx] = val === '' ? 0 : cleanNumberString(val);
            saveDB();
            syncDailyOpeningFromMonthlyBF(currentDate, true);
            recalculateFutureBroughtForwardBalances(currentDate);
            updateFooterTotalsOnly();
        }

        function updateCustomTotal(colIdx, val) {
            let dayData = getCurrentDayData();
            if (!dayData.customTotals) dayData.customTotals = new Array(dayData.months.length).fill('');
            if(val === ''){
                 dayData.customTotals[colIdx] = '';
            } else {
                 let cleanVal = cleanNumberString(val);
                 dayData.customTotals[colIdx] = cleanVal;
            }
            saveDB();
            recalculateFutureBroughtForwardBalances(currentDate);
            updateFooterTotalsOnly();
        }

        function updateCustomCarried(colIdx, val) {
            // ยกไปสุทธิคำนวณจากยอดยกมาใต้เดือน - ยอดรวมรายการของเดือน ไม่รับค่าที่พิมพ์ทับ
            let dayData = getCurrentDayData();
            if (!dayData.customCarried) dayData.customCarried = new Array(dayData.months.length).fill('');
            dayData.customCarried[colIdx] = '';
            saveDB();
            updateFooterTotalsOnly();
            showToast('ยอดยกไปสุทธิคำนวณอัตโนมัติจากยอดยกมา - ยอดรวมรายการของเดือน');
        }

        function updateCellData(colIdx, rowIdx, field, value, element) {
            let dayData = getCurrentDayData();
            let isSummaryCol = (colIdx === dayData.months.length);
            let m = isSummaryCol ? "สรุปประจำวัน" : dayData.months[colIdx];

            if ((m === undefined || m === "") && !isSummaryCol) {
                alert("⚠️ กรุณาเลือกหัวเดือนในคอลัมน์นี้ก่อนทำการบันทึกข้อมูลครับ");
                if (element) {
                    element.value = '';
                    if (field === 'type') element.classList.remove('type-red');
                    else element.classList.remove('row-red');
                }
                return;
            }

            if (!dayData.data[m]) dayData.data[m] = [];
            while (dayData.data[m].length <= rowIdx) {
                let newIdx = dayData.data[m].length;
                dayData.data[m].push({ type: '', ticket: '', amount: '', count: '', origIdx: newIdx, timestamp: '' });
            }
            
            let cleanVal = value;
            if (field === 'amount' || field === 'count') {
                cleanVal = (value === '') ? '' : cleanNumberString(value);
            } else if (field === 'ticket') {
                let strVal = String(value).trim();
                cleanVal = strVal;
                if (element) element.value = cleanVal;
                
                if (cleanVal !== '') {
                    dayData.data[m][rowIdx].timestamp = new Date().toLocaleTimeString('th-TH');
                } else {
                    dayData.data[m][rowIdx].timestamp = '';
                }
            }

            dayData.data[m][rowIdx][field] = cleanVal;

            if (!isSummaryCol && (field === 'amount' || field === 'type')) {
                // เมื่อข้อมูลต้นทางเปลี่ยน ให้กลับมาคำนวณยอดคงเหลืออัตโนมัติ
                dayData.balanceManual = false;
                if (dayData.customTotals) dayData.customTotals[colIdx] = '';
                if (dayData.customCarried) dayData.customCarried[colIdx] = '';
            }
            if (isSummaryCol && rowIdx === 3 && (field === 'count' || field === 'amount')) {
                // แถวคงเหลืออนุญาตให้แก้ไขเองได้ และเก็บสถานะนี้ไว้หลังเปลี่ยนหน้า/รีเฟรช
                dayData.balanceManual = true;
            }
            if (isSummaryCol && rowIdx < 3 && (field === 'count' || field === 'amount')) {
                dayData.balanceManual = false;
            }

            saveDB();
            updateSummaryColumn();

            if (!isSummaryCol && (field === 'amount' || field === 'type')) {
                recalculateFutureBroughtForwardBalances(currentDate);
            }

            if (isSummaryCol) return;

            let rowTr = element.closest('tr');
            if (rowTr) {
                let typeSelect = rowTr.querySelectorAll('.month-type-select')[colIdx];
                let ticketInput = rowTr.querySelector(`.ticket-input-${colIdx}-${rowIdx}`);
                let amountInput = rowTr.querySelector(`.amount-input-${colIdx}-${rowIdx}`);

                let isRed = (typeSelect && typeSelect.value === 'ถ');

                if (typeSelect) {
                    if (isRed) typeSelect.classList.add('type-red');
                    else typeSelect.classList.remove('type-red');
                }
                if (ticketInput) {
                    if (isRed) ticketInput.classList.add('row-red');
                    else ticketInput.classList.remove('row-red');
                }
                if (amountInput) {
                    if (isRed) amountInput.classList.add('row-red');
                    else amountInput.classList.remove('row-red');
                }
            }

            if (field === 'ticket') {
                checkDuplicateTicketsForMonth(colIdx);
            }
        }

        function updateDailyBalanceCalculator() {
            // อ่านค่าจากช่องสรุปประจำวันบนหน้าจอโดยตรง: แถว 0=ย/ม, 1=รับจำนำ, 2=ไถ่ถอน
            // สูตรทั้งจำนวนรายและจำนวนเงิน: ย/ม + จำนำ - ไถ่ถอน
            const dayData = db[currentDate];
            if (!dayData || !dayData.data) return;
            const summaryKey = 'สรุปประจำวัน';
            if (!Array.isArray(dayData.data[summaryKey])) dayData.data[summaryKey] = [];
            const summaryRows = dayData.data[summaryKey];
            while (summaryRows.length < 4) {
                const r = summaryRows.length;
                summaryRows.push({ type: summaryLabels[r] || '', ticket: '', amount: '', count: '' });
            }

            // ใช้ข้อมูลที่บันทึกของ currentDate เป็นแหล่งเดียวเสมอ
            // ห้ามอ่าน input จาก DOM เพราะขณะเปลี่ยนวัน DOM อาจยังเป็นข้อมูลของวันก่อนหน้า
            const readValue = (rowIndex, field) => cleanNumberString(summaryRows[rowIndex] ? summaryRows[rowIndex][field] : 0);

            const openingCount = readValue(0, 'count');
            const pledgeCount = readValue(1, 'count');
            const redemptionCount = readValue(2, 'count');
            const openingAmount = readValue(0, 'amount');
            const pledgeAmount = readValue(1, 'amount');
            const redemptionAmount = readValue(2, 'amount');
            const calculatedBalanceCount = openingCount + pledgeCount - redemptionCount;
            const calculatedBalanceAmount = roundMoney(openingAmount + pledgeAmount - redemptionAmount);
            const manualBalance = dayData.balanceManual === true;
            const balanceCount = manualBalance ? cleanNumberString(summaryRows[3] && summaryRows[3].count) : calculatedBalanceCount;
            const balanceAmount = manualBalance ? cleanNumberString(summaryRows[3] && summaryRows[3].amount) : calculatedBalanceAmount;

            const showValue = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.value = Number(value).toLocaleString('th-TH');
            };
            showValue('calc-opening-count', openingCount);
            showValue('calc-pledge-count', pledgeCount);
            showValue('calc-redemption-count', redemptionCount);
            showValue('calc-opening', openingAmount);
            showValue('calc-pledge', pledgeAmount);
            showValue('calc-redemption', redemptionAmount);

            summaryRows[0].type = 'ย/ม';
            summaryRows[1].type = 'รับจำนำ';
            summaryRows[2].type = 'ไถ่ถอน';
            summaryRows[3].type = 'คงเหลือ';
            summaryRows[3].count = balanceCount;
            summaryRows[3].amount = balanceAmount;

            const balanceCountInput = document.querySelector('.summary-count-3');
            const balanceAmountInput = document.querySelector('.summary-amount-3');
            if (balanceCountInput) balanceCountInput.value = balanceCount === 0 ? '' : Number(balanceCount).toLocaleString('th-TH');
            if (balanceAmountInput) balanceAmountInput.value = balanceAmount === 0 ? '' : Number(balanceAmount).toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
            const output = document.getElementById('calc-balance');
            if (output) output.textContent = `${Number(balanceCount).toLocaleString('th-TH')} ราย / ${Number(balanceAmount).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท`;
            saveDB();
        }

        function updateSummaryColumn() {
            // ยอดไถ่ถอนในสรุปประจำวันรวมอัตโนมัติเฉพาะรายการประเภท ถ, ส, พ, ผ
            // จากนั้นตารางคำนวณภายนอกอ่านค่า ย/ม + รับจำนำ - ไถ่ถอน เพื่ออัปเดตคงเหลือ
            const dayData = getCurrentDayData();
            const summaryMonth = "สรุปประจำวัน";
            if (!dayData.data[summaryMonth]) dayData.data[summaryMonth] = [];
            while (dayData.data[summaryMonth].length < 4) {
                const r = dayData.data[summaryMonth].length;
                dayData.data[summaryMonth].push({ type: summaryLabels[r] || '', ticket: '', amount: '', count: '' });
            }
            const sumRows = dayData.data[summaryMonth];
            const totals = getDailyRedemptionTotals(dayData);

            sumRows[0].type = 'ย/ม';
            sumRows[1].type = 'รับจำนำ';
            sumRows[2].type = 'ไถ่ถอน';
            sumRows[3].type = 'คงเหลือ';
            sumRows[2].count = totals.count || '';
            sumRows[2].amount = totals.amount || '';

            // อัปเดตเฉพาะยอดไถ่ถอน ไม่แตะต้องยอดคงเหลือที่กรอกเอง
            const fields = [
                ['.summary-count-2', totals.count],
                ['.summary-amount-2', totals.amount]
            ];
            fields.forEach(([selector, value]) => {
                const input = document.querySelector(selector);
                if (input) input.value = value ? formatNumber(value) : '';
            });
            saveDB();
            updateFooterTotalsOnly();
            updateDailyBalanceCalculator();
        }

        const summaryLabels = ["ย/ม", "รับจำนำ", "ไถ่ถอน", "คงเหลือ"];

        function checkDuplicateTicketsForMonth(colIdx) {
            let dayData = getCurrentDayData();
            let m = dayData.months[colIdx];
            if (m === undefined || m === "") return;
            let rows = dayData.data[m] || [];
            
            let counts = {};
            rows.forEach(r => {
                let t = r.ticket ? r.ticket.trim() : '';
                if (t !== '') {
                    counts[t] = (counts[t] || 0) + 1;
                }
            });

            let inputs = document.querySelectorAll(`.ticket-input-${colIdx}`);
            inputs.forEach((input, rIdx) => {
                let t = rows[rIdx] && rows[rIdx].ticket ? rows[rIdx].ticket.trim() : '';
                if (t !== '' && counts[t] > 1) {
                    input.classList.add('ticket-duplicate');
                } else {
                    input.classList.remove('ticket-duplicate');
                }
            });
        }

        // รวมยอดไถ่ถอนรายเดือนจากประเภท ถ, ส, พ, ผ ทั้งจำนวนรายการและจำนวนเงิน
        function getMonthlyRedemptionTotals(dayData, monthName) {
            let count = 0;
            let amount = 0;
            const rows = (dayData && dayData.data && Array.isArray(dayData.data[monthName]))
                ? dayData.data[monthName] : [];
            rows.forEach(item => {
                if (!item) return;
                const type = String(item.type || '').trim();
                const ticket = String(item.ticket || '').trim();
                const rowAmount = cleanNumberString(item.amount);
                if (['ถ', 'ส', 'พ', 'ผ'].includes(type) && (ticket !== '' || rowAmount !== 0 || type !== '')) {
                    count += 1;
                    amount = roundMoney(amount + rowAmount);
                }
            });
            return { count, amount: roundMoney(amount) };
        }

        function getDailyRedemptionTotals(dayData) {
            let count = 0;
            let amount = 0;
            (dayData.months || []).forEach(monthName => {
                if (!monthName) return;
                const totals = getMonthlyRedemptionTotals(dayData, monthName);
                count += totals.count;
                amount = roundMoney(amount + totals.amount);
            });
            return { count, amount: roundMoney(amount) };
        }

        function updateFooterTotalsOnly() {
            let dayData = getCurrentDayData();
            if (!dayData.bfCount) dayData.bfCount = new Array(dayData.months.length).fill(0);
            let html1 = `<td class="border border-slate-300 p-1 text-center bg-slate-200">รวมรับ</td>`;
            let html2 = `<td class="border border-slate-300 p-1 text-center bg-emerald-100">ยกไป</td>`;

            dayData.months.forEach((m, idx) => {
                const totals = m ? getMonthlyRedemptionTotals(dayData, m) : { count: 0, amount: 0 };
                const totalCount = totals.count;
                const totalAmount = totals.amount;
                const openingCount = cleanNumberString(dayData.bfCount[idx] ?? 0);
                const openingAmount = cleanNumberString(dayData.bf?.[idx] ?? 0);
                const s2add = getSor2AddForMonth(dayData, m);
                const carriedCount = openingCount + s2add.count - totalCount;
                const carriedAmount = roundMoney(openingAmount + s2add.amount - totalAmount);
                const countText = totalCount !== 0 ? formatNumber(totalCount) : '';
                const amountText = totalAmount !== 0 ? formatNumber(totalAmount) : '';
                const carriedCountText = carriedCount !== 0 ? formatNumber(carriedCount) : '';
                const carriedAmountText = carriedAmount !== 0 ? formatNumber(carriedAmount) : '';

                html1 += `
                    <td class="border border-slate-300 p-0.5 text-right bg-slate-50 font-normal text-[10px]">รวมรายการ</td>
                    <td class="border border-slate-300 p-0.5 text-right bg-white"><button type="button" onclick="openMonthAudit(${idx})" title="กดเพื่อตรวจสอบรายการที่นำมารวม" class="w-full text-right bg-transparent border-0 text-[10px] font-bold text-emerald-800 underline decoration-dotted">${countText || '0'}</button></td>
                    <td class="border border-slate-300 p-0.5 text-right bg-white"><button type="button" onclick="openMonthAudit(${idx})" title="กดเพื่อค้นหารายการที่รวมเป็นยอดนี้" class="w-full text-right bg-transparent border-0 text-[10px] font-bold text-emerald-800 underline decoration-dotted">${amountText || '0'}</button></td>
                `;
                html2 += `
                    <td class="border border-slate-300 p-0.5 text-right bg-emerald-100 text-emerald-900 font-normal text-[10px]">ยกไปสุทธิ</td>
                    <td class="border border-slate-300 p-0.5 text-right bg-emerald-50"><input type="text" readonly value="${carriedCountText}" class="w-full text-right bg-transparent border-0 text-[10px] font-bold text-emerald-700"></td>
                    <td class="border border-slate-300 p-0.5 text-right bg-emerald-50"><input type="text" readonly value="${carriedAmountText}" class="w-full text-right bg-transparent border-0 text-[10px] font-bold text-emerald-700"></td>
                `;
            });

            html1 += `<td colspan="3" class="border border-slate-300 p-1 text-center bg-amber-50 text-amber-900">-</td>`;
            html2 += `<td colspan="3" class="border border-slate-300 p-1 text-center bg-amber-50 text-amber-900">-</td>`;
            let rowTotal = document.getElementById('foot-totals-row');
            let rowCarried = document.getElementById('foot-carried-row');
            if (rowTotal) rowTotal.innerHTML = html1;
            if (rowCarried) rowCarried.innerHTML = html2;
        }


        // ตรวจสอบแหล่งที่มาของยอดรวมรายเดือน รวมถึงข้อมูลที่อยู่นอกจำนวนแถวที่แสดง
        function openMonthAudit(monthIndex) {
            const dayData = getCurrentDayData();
            const monthName = dayData.months[monthIndex];
            if (!monthName) return alert('กรุณาเลือกเดือนก่อนตรวจสอบ');
            const rows = Array.isArray(dayData.data?.[monthName]) ? dayData.data[monthName] : [];
            const active = rows.map((item, rowIndex) => ({ item: item || {}, rowIndex }))
                .filter(({item}) => String(item.type || '').trim() !== '' || String(item.ticket || '').trim() !== '' || cleanNumberString(item.amount) !== 0);
            const total = getMonthlyRedemptionTotals(dayData, monthName);
            const hidden = active.filter(x => x.rowIndex >= Number(dayData.totalRows || 0));
            let body = active.length ? active.map(({item, rowIndex}) => {
                const beyond = rowIndex >= Number(dayData.totalRows || 0);
                const typ = String(item.type || '').trim() || '(ไม่ระบุ)';
                const ticket = String(item.ticket || '').trim() || '(ไม่มีเลขตั๋ว)';
                const amount = formatNumber(cleanNumberString(item.amount));
                return `<tr class="${beyond ? 'bg-rose-50' : 'bg-white'} border-b">
                    <td class="p-2 text-center">${rowIndex + 1}${beyond ? ' <span class="text-rose-700 text-xs font-bold">(ซ่อน)</span>' : ''}</td>
                    <td class="p-2 text-center font-bold">${auditEscape(typ)}</td>
                    <td class="p-2 text-center">${auditEscape(ticket)}</td>
                    <td class="p-2 text-right font-bold">${amount}</td>
                    <td class="p-2 text-center whitespace-nowrap">
                      <button onclick="auditRevealRow(${monthIndex},${rowIndex})" class="px-2 py-1 mb-1 rounded bg-sky-100 text-sky-800 text-xs">แสดงแถว</button>
                      <button onclick="auditEditRow(${monthIndex},${rowIndex})" class="px-2 py-1 mb-1 rounded bg-amber-100 text-amber-900 text-xs">แก้ไข</button>
                      <button onclick="auditClearRow(${monthIndex},${rowIndex})" class="px-2 py-1 rounded bg-rose-100 text-rose-800 text-xs">ล้างรายการ</button>
                    </td></tr>`;
            }).join('') : '<tr><td colspan="5" class="p-4 text-center text-slate-500">ไม่พบข้อมูลในเดือนนี้</td></tr>';
            let modal = document.getElementById('month-audit-modal');
            if (!modal) {
                modal = document.createElement('div'); modal.id = 'month-audit-modal';
                modal.className = 'fixed inset-0 z-[9999] bg-slate-950/70 flex items-center justify-center p-2';
                document.body.appendChild(modal);
            }
            modal.innerHTML = `<div class="bg-white text-slate-800 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden">
              <div class="p-4 bg-indigo-50 border-b flex items-center justify-between gap-2"><div><h3 class="font-bold text-lg text-indigo-950">ตรวจสอบที่มาของยอดรวม: ${auditEscape(monthName)}</h3><p class="text-sm text-slate-600">วันที่ ${auditEscape(currentDate)} · กดแก้ไขหรือล้างรายการได้จากตรงนี้</p></div><button onclick="closeMonthAudit()" class="text-2xl px-2 text-slate-500">×</button></div>

        function auditEscape(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        function closeMonthAudit() { const modal = document.getElementById('month-audit-modal'); if (modal) modal.remove(); }
        function auditRevealRow(monthIndex, rowIndex) {
            const dayData = getCurrentDayData();
            if (rowIndex >= Number(dayData.totalRows || 0)) {
                dayData.totalRows = rowIndex + 1;
                dayData.months.forEach(m => {
                    if (!m) return;
                    if (!Array.isArray(dayData.data[m])) dayData.data[m] = [];
                    while (dayData.data[m].length < dayData.totalRows) dayData.data[m].push({type:'',ticket:'',amount:'',count:'',origIdx:dayData.data[m].length,timestamp:''});
                });
                saveDB(); renderTable();
            }
            closeMonthAudit();
            setTimeout(() => {
                const row = document.querySelector(`#ledger-tbody tr:nth-child(${rowIndex + 2})`);
                if (row) { row.scrollIntoView({behavior:'smooth', block:'center'}); row.classList.add('bg-amber-100'); setTimeout(() => row.classList.remove('bg-amber-100'), 2500); }
            }, 100);
        }
        function auditEditRow(monthIndex, rowIndex) {
            const dayData = getCurrentDayData(); const monthName = dayData.months[monthIndex];
            const item = dayData.data?.[monthName]?.[rowIndex]; if (!item) return alert('ไม่พบรายการนี้');
            const type = prompt('แก้ประเภท (ส / พ / ผ / ถ) หรือเว้นว่าง', item.type || ''); if (type === null) return;
            const normalizedType = String(type).trim(); if (normalizedType && !['ส','พ','ผ','ถ'].includes(normalizedType)) return alert('ประเภทไม่ถูกต้อง');
            const ticket = prompt('แก้เลขตั๋ว', item.ticket || ''); if (ticket === null) return;
            const amount = prompt('แก้จำนวนเงิน', item.amount === '' ? '' : String(item.amount)); if (amount === null) return;
            if (amount.trim() !== '' && (!Number.isFinite(cleanNumberString(amount)) || cleanNumberString(amount) < 0)) return alert('จำนวนเงินไม่ถูกต้อง');
            item.type = normalizedType; item.ticket = ticket.trim(); item.amount = amount.trim() === '' ? '' : cleanNumberString(amount);
            saveDB(); renderTable(); openMonthAudit(monthIndex); showToast('บันทึกการแก้ไขรายการแล้ว');
        }
        function auditClearRow(monthIndex, rowIndex) {

            if (!confirm(`ยืนยันล้างข้อมูลแถวที่ ${rowIndex + 1} ของเดือน${monthName}? ระบบจะไม่ลบแถวอื่น`)) return;

            saveDB(); renderTable(); openMonthAudit(monthIndex); showToast('ล้างรายการแล้ว');
        }

        function addRow() {
            let dayData = getCurrentDayData();
            dayData.totalRows++;
            
            dayData.months.forEach(m => {
                if (m !== undefined && m !== "") {
                    if (!dayData.data[m]) dayData.data[m] = [];
                    let newOrigIdx = dayData.data[m].length;
                    dayData.data[m].push({ type: '', ticket: '', amount: '', count: '', origIdx: newOrigIdx, timestamp: '' });
                }
            });

            let summaryMonth = "สรุปประจำวัน";
            if (!dayData.data[summaryMonth]) dayData.data[summaryMonth] = [];
            while (dayData.data[summaryMonth].length < dayData.totalRows) {
                let newIdx = dayData.data[summaryMonth].length;
                let defaultLabel = newIdx < summaryLabels.length ? summaryLabels[newIdx] : '';
                dayData.data[summaryMonth].push({ type: defaultLabel, ticket: '', amount: '', count: '', origIdx: newIdx, timestamp: '' });
            }
            
            if(dayData.data[summaryMonth][0]) {
                dayData.data[summaryMonth][0].type = 'ย/ม';
            }

            saveDB();
            renderTable();
            showToast('เพิ่มแถวสำเร็จ');
        }

        function deleteRow(rIdx) {
            let dayData = getCurrentDayData();
            if (dayData.totalRows <= 1) {
                alert('ต้องเหลือแถวไว้อย่างน้อย 1 แถวครับ');
                return;
            }
            if (confirm('คุณต้องการลบแถวที่ ' + (rIdx + 1) + ' ใช่หรือไม่?')) {
                dayData.months.forEach(m => {
                    if (m && m !== "" && dayData.data[m]) {
                        dayData.data[m].splice(rIdx, 1);
                        dayData.data[m].forEach((item, idx) => {
                            if (item) item.origIdx = idx;
                        });
                    }
                });
                
                let summaryMonth = "สรุปประจำวัน";
                if (dayData.data[summaryMonth]) {
                    dayData.data[summaryMonth].pop(); 
                }
                
                dayData.totalRows--;
                saveDB();
                renderTable();
                showToast('ลบแถวสำเร็จ');
            }
        }

        async function exportJSON() {
            const dataStr = JSON.stringify(db, null, 2);
            const fileName = `pawn_krabi_backup_${currentDate}.json`;
            let backupSuccess = false;

            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();
                    backupSuccess = true;
                } catch (err) {
                    if (err.name !== 'AbortError') console.log('File picker error:', err);
                }
            } else {
                const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", url);
                downloadAnchor.setAttribute("download", fileName);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                // หน่วงเวลาคืน URL เพื่อให้ Chrome บนมือถือเริ่มดาวน์โหลดไฟล์ได้ก่อน
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                backupSuccess = true;
            }

            if (backupSuccess) {
                localStorage.setItem('pawn_krabi_last_backup', new Date().toISOString());
                checkBackupReminder();
                showToast('สำรองระบบ .json สำเร็จ');
            }
        }

        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const imported = JSON.parse(text);
                if (!imported || typeof imported !== 'object' || Array.isArray(imported)) {
                    throw new Error('รูปแบบฐานข้อมูลไม่ถูกต้อง');
                }
                if (Object.prototype.hasOwnProperty.call(imported, '') && !hasDayDataIn(imported, '')) delete imported[''];
                for (const [dateKey, day] of Object.entries(imported)) {
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey) || !day || typeof day !== 'object' ||
                        !Array.isArray(day.months) || !day.data || typeof day.data !== 'object') {
                        throw new Error('พบข้อมูลวันที่หรือโครงสร้างฐานข้อมูลไม่ถูกต้อง');
                    }
                }
                if (!confirm(`ยืนยันนำเข้าข้อมูลจากไฟล์ ${file.name} หรือไม่?\n\nข้อมูลเดิมในเครื่องนี้จะถูกแทนที่ แต่ระบบจะเก็บจุดกู้คืนไว้ให้ก่อน`)) return;

                // ห้ามเปลี่ยนฐานข้อมูลปัจจุบันจนกว่าจะบันทึกจุดกู้คืนสำเร็จ
                await savePreImportRecoverySnapshot(db);

                let normalizedDb = {};
                for (const [key, value] of Object.entries(imported)) {
                    const parts = key.split('-');
                    if (parts.length === 3 && Number.parseInt(parts[0], 10) > 2500) {
                        const year = Number.parseInt(parts[0], 10) - 543;
                        normalizedDb[`${year}-${parts[1]}-${parts[2]}`] = value;
                    } else {
                        normalizedDb[key] = value;
                    }
                }

                const previousDb = db;
                db = normalizedDb;
                if (!saveDB()) {
                    db = previousDb;
                    throw new Error('บันทึกข้อมูลใหม่ไม่สำเร็จ จึงยกเลิกการนำเข้า');
                }
                renderTable();
                showToast('นำเข้าข้อมูลสำเร็จ · เก็บจุดกู้คืนข้อมูลเดิมแล้ว');
            } catch (err) {
                console.error('Import JSON failed:', err);
                alert('นำเข้าข้อมูลไม่สำเร็จ: ' + (err.message || 'ไฟล์ JSON ไม่ถูกต้อง'));
            } finally {
                event.target.value = '';
            }
        }

        function exportToExcel() {
            let dayData = getCurrentDayData();
            let csvContent = "\uFEFF";
            
            let header1 = ["ที่"];
            dayData.months.forEach(m => {
                header1.push(m || 'ไม่ระบุ', "", "");
            });
            header1.push("ยอดสรุปประจำวัน", "", "");
            csvContent += header1.join(",") + "\n";

            let header2 = [""];
            dayData.months.forEach((m, idx) => {
                let bfVal = (dayData.bf && dayData.bf[idx] !== undefined && dayData.bf[idx] !== 0) ? dayData.bf[idx] : '';
                header2.push("ยกมา:", bfVal, "");
            });
            header2.push("", "", "");
            csvContent += header2.join(",") + "\n";

            let header3 = [""];
            dayData.months.forEach(() => {
                header3.push("ประเภท", "เลขตั๋ว", "จำนวนเงิน");
            });
            header3.push("ประเภท", "จำนวนราย", "เงิน");
            csvContent += header3.join(",") + "\n";

            for (let r = 0; r < dayData.totalRows; r++) {
                let rowData = [r + 1];
                
                dayData.months.forEach((m) => {
                    let rowsToUse = (m && dayData.data[m]) ? dayData.data[m] : [];
                    let d = rowsToUse[r] || { type: '', ticket: '', amount: '' };
                    let amtStr = (d.amount !== '' && cleanNumberString(d.amount) !== 0) ? d.amount : '';
                    rowData.push(d.type, d.ticket, amtStr);
                });

                let summaryRows = dayData.data["สรุปประจำวัน"] || [];
                let sD = summaryRows[r] || { type: '', count: '', amount: '' };
                let defLabel = r < summaryLabels.length ? summaryLabels[r] : '';
                let sType = sD.type || defLabel;
                let sCount = (sD.count !== '' && cleanNumberString(sD.count) !== 0) ? sD.count : '';
                let sAmount = (sD.amount !== '' && cleanNumberString(sD.amount) !== 0) ? sD.amount : '';
                rowData.push(sType, sCount, sAmount);

                csvContent += rowData.map(val => `"${val}"`).join(",") + "\n";
            }
            
            // ใช้ยอดรวมรายการชุดเดียวกับหน้าจอ เพื่อไม่ให้ไฟล์ส่งออกมียอดต่างกัน
            let monthSums = dayData.months.map(m => m ? getMonthlyRedemptionTotals(dayData, m) : { count: 0, amount: 0 });

            let foot1 = ["รวมรับ"];
            let foot2 = ["ยกไป"];
            
            dayData.months.forEach((m, idx) => {
                let userTotal = monthSums[idx];
                let openingCount = cleanNumberString(dayData.bfCount?.[idx] ?? 0);
                let openingAmount = cleanNumberString(dayData.bf?.[idx] ?? 0);
                const s2addP = getSor2AddForMonth(dayData, m);
                let userCarriedCount = openingCount + s2addP.count - userTotal.count;
                let userCarriedAmount = roundMoney(openingAmount + s2addP.amount - userTotal.amount);
                foot1.push("รวมรายการ:", userTotal.count || '', userTotal.amount || '');
                foot2.push("ยกไปสุทธิ:", userCarriedCount || '', userCarriedAmount || '');
            });

            foot1.push("-", "-", "-");
            foot2.push("-", "-", "-");

            csvContent += foot1.map(val => `"${val}"`).join(",") + "\n";
            csvContent += foot2.map(val => `"${val}"`).join(",") + "\n";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", url);
            downloadAnchor.setAttribute("download", `บัญชีแยกประเภท_${currentDate}.csv`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            URL.revokeObjectURL(url);
            showToast('ส่งออกเป็นไฟล์ Excel สำเร็จ');
        }

            rows.forEach(tr => {
                const parts = [];
                tr.querySelectorAll('input').forEach(i => parts.push(i.value));
                tr.querySelectorAll('select').forEach(s => parts.push((s.options[s.selectedIndex] || {}).text || ''));
                let text = parts.join(' ').toLowerCase();
                if (query === '' || text.includes(query)) {
                    tr.style.display = '';

            });

        function executeGlobalSearch() {
            let query = document.getElementById('global-search-input').value.trim().toLowerCase();
            let tbody = document.getElementById('global-search-results');
            
            if (query === '') {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-500 py-6">กรุณากรอกเลขตั๋วที่ต้องการค้นหา</td></tr>';
                return;
            }
            
            let results = [];
            
            for (let dKey in db) {
                if (!dKey.includes('-') || dKey.length !== 10) continue;
                
                let dData = db[dKey];
                if (dData && dData.months && dData.data) {
                    dData.months.forEach(m => {
                        if (m && m !== "" && dData.data[m]) {
                            dData.data[m].forEach(row => {
                                if (row && row.ticket !== undefined && row.ticket !== null) {
                                    let tStr = String(row.ticket).trim().toLowerCase();
                                    const nStr = String(row.newTicket || '').trim().toLowerCase();
                                    if ((tStr !== '' && tStr.includes(query)) || (nStr !== '' && nStr.includes(query))) {
                                        results.push({ 
                                            date: dKey, 
                                            month: m, 
                                            type: row.type || '', 
                                            ticket: row.ticket, 
                                            amount: row.amount || '',
                                            timestamp: row.timestamp || '-', book: row.book || '', newTicket: row.newTicket || '', newBook: row.newBook || '', newAmount: (row.newAmount === undefined ? '' : row.newAmount), viaNew: !(tStr !== '' && tStr.includes(query))
                                        });
                                    }
                                }
                            });
                        }
                    });
                }
            }
            
            results.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-rose-500 font-bold py-6">ไม่พบประวัติเลขตั๋วนี้ในระบบ</td></tr>';
                return;
            }

            let html = '';
            results.forEach((r, idx) => {
                let parts = r.date.split('-');
                let thDate = `${parts[2]}/${parts[1]}/${Number(parts[0]) + 543}`;
                let isRed = r.type === 'ถ';
                let style = isRed ? 'color: #dc2626; font-weight: bold;' : '';
                let amtStr = (r.amount !== '' && cleanNumberString(r.amount) !== 0) ? formatNumber(r.amount) : '';
                let timeStr = r.timestamp !== '-' ? r.timestamp + ' น.' : '-';

                html += `<tr class="hover:bg-slate-50 border-b border-slate-200">
                    <td class="p-2 text-center text-slate-500">${idx + 1}</td>
                    <td class="p-2 text-center font-bold text-emerald-800">${thDate}</td>
                    <td class="p-2 text-center text-xs text-slate-500">${timeStr}</td>
                    <td class="p-2 text-center text-slate-800">${r.month}</td>
                    <td class="p-2 text-center text-slate-800" style="${style}">${r.type}</td>
                    <td class="p-2 text-center text-slate-800" style="${style}">${searchTicketCell(r)}</td>
                    <td class="p-2 text-right text-slate-800" style="${style}">${amtStr}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

            document.getElementById('pdf-compare-file').value = '';
