<script>
        function playSciFiSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'access_granted') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'access_denied') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                // Ignore if audio blocked
            }
        }

        let currentSortOrder = "normal";
        const CORRECT_PIN = "1234"; // เปลี่ยน PIN ได้ในโค้ด หากต้องการ
        function checkLogin() {
            const pin = document.getElementById('login-pin').value;
            const errorMsg = document.getElementById('login-error');
            if (pin !== CORRECT_PIN) {
                errorMsg.textContent = 'รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่';
                errorMsg.classList.remove('hidden');
                playSciFiSound('access_denied');
                document.getElementById('login-pin').select();
                return;
            }
            errorMsg.classList.add('hidden');
            playSciFiSound('access_granted');
            const leftDoor = document.getElementById('vault-left');
            const rightDoor = document.getElementById('vault-right');
            const loginCard = document.querySelector('#login-modal .cyber-box');
            if (loginCard) loginCard.style.opacity = '0';
            if (leftDoor) leftDoor.classList.add('vault-open-left');
            if (rightDoor) rightDoor.classList.add('vault-open-right');
            setTimeout(() => {
                document.getElementById('login-modal').style.display = 'none';
                const app = document.getElementById('app-container');
                app.classList.remove('hidden'); app.style.display = 'flex';
                applyAppTheme();
                initApp();
                setSaveIndicator('saved', 'โหมดเครื่องนี้ · บันทึกอัตโนมัติ');
            }, 450);
        }
        function handleLoginKeyPress(event) { if (event.key === 'Enter') checkLogin(); }
        function logout() { location.reload(); }

        // ฐานข้อมูลสำรองใน IndexedDB ช่วยลดความเสี่ยงเมื่อ localStorage เต็มหรือเบราว์เซอร์ปิดหน้าเร็ว
        // หากเบราว์เซอร์ที่เปิดไฟล์ HTML ไม่รองรับ IndexedDB ระบบจะใช้ localStorage ตามเดิม
        const DB_STORAGE_NAME = 'pawn_krabi_reliable_storage';
        const DB_STORAGE_STORE = 'snapshots';
        let indexedDBHandle = null;
        let indexedDBSaveTimer = null;
        let lastLocalSaveAt = 0;

        function openReliableDatabase() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) return reject(new Error('IndexedDB ไม่รองรับ'));
                let request;
                try {
                    request = indexedDB.open(DB_STORAGE_NAME, 1);
                } catch (error) {
                    reject(error);
                    return;
                }
                request.onupgradeneeded = () => {
                    const idb = request.result;
                    if (!idb.objectStoreNames.contains(DB_STORAGE_STORE)) {
                        idb.createObjectStore(DB_STORAGE_STORE, { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => {
                    indexedDBHandle = request.result;
                    indexedDBHandle.onversionchange = () => {
                        indexedDBHandle.close();
                        indexedDBHandle = null;
                    };
                    resolve(indexedDBHandle);
                };
                request.onerror = () => reject(request.error || new Error('เปิด IndexedDB ไม่สำเร็จ'));
                request.onblocked = () => reject(new Error('IndexedDB ถูกบล็อก'));
            });
        }

        async function readIndexedDBSnapshot() {
            const idb = indexedDBHandle || await openReliableDatabase();
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(DB_STORAGE_STORE, 'readonly');
                const request = tx.objectStore(DB_STORAGE_STORE).get('main');
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error || new Error('อ่าน IndexedDB ไม่สำเร็จ'));
            });
        }

        // เก็บจุดกู้คืนก่อนนำเข้าไฟล์ใหม่ โดยไม่เขียนทับ snapshot หลัก
        async function savePreImportRecoverySnapshot(data) {
            const idb = indexedDBHandle || await openReliableDatabase();
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(DB_STORAGE_STORE, 'readwrite');
                tx.objectStore(DB_STORAGE_STORE).put({
                    id: 'pre_import',
                    savedAt: Date.now(),
                    data: JSON.parse(JSON.stringify(data))
                });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error || new Error('บันทึกจุดกู้คืนไม่สำเร็จ'));
                tx.onabort = () => reject(tx.error || new Error('ยกเลิกการบันทึกจุดกู้คืน'));
            });
        }

        async function restorePreImportBackup() {
            try {
                const idb = indexedDBHandle || await openReliableDatabase();
                const recovery = await new Promise((resolve, reject) => {
                    const tx = idb.transaction(DB_STORAGE_STORE, 'readonly');
                    const request = tx.objectStore(DB_STORAGE_STORE).get('pre_import');
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error || new Error('อ่านจุดกู้คืนไม่สำเร็จ'));
                });
                if (!recovery || !recovery.data || typeof recovery.data !== 'object') {
                    alert('ยังไม่มีจุดกู้คืนจากการนำเข้าครั้งล่าสุด');
                    return;
                }
                const savedTime = new Date(Number(recovery.savedAt || 0)).toLocaleString('th-TH');
                if (!confirm(`ต้องการกู้คืนข้อมูลที่บันทึกไว้ก่อนนำเข้าครั้งล่าสุดหรือไม่?\nจุดกู้คืน: ${savedTime}\n\nข้อมูลปัจจุบันจะถูกแทนที่`)) return;
                const previousDb = db;
                db = recovery.data;
                if (!saveDB()) {
                    db = previousDb;
                    throw new Error('บันทึกข้อมูลที่กู้คืนไม่สำเร็จ');
                }
                renderTable();
                showToast('กู้คืนข้อมูลก่อนนำเข้าสำเร็จ');
            } catch (error) {
                console.error('Restore pre-import backup failed:', error);
                alert('กู้คืนไม่สำเร็จ: ' + (error.message || 'เกิดข้อผิดพลาด'));
            }
        }

        function writeIndexedDBSnapshot(snapshot) {
            return new Promise(async (resolve, reject) => {
                try {
                    const idb = indexedDBHandle || await openReliableDatabase();
                    const tx = idb.transaction(DB_STORAGE_STORE, 'readwrite');
                    tx.objectStore(DB_STORAGE_STORE).put({
                        id: 'main',
                        savedAt: Date.now(),
                        data: snapshot
                    });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error || new Error('บันทึก IndexedDB ไม่สำเร็จ'));
                    tx.onabort = () => reject(tx.error || new Error('ยกเลิกการบันทึก IndexedDB'));
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function restoreReliableDatabase() {
            try {
                const snapshot = await readIndexedDBSnapshot();
                if (!snapshot || !snapshot.data) return;
                let restored = snapshot.data;
                if (typeof restored === 'string') {
                    try { restored = JSON.parse(restored); } catch (_) { return; }
                }
                if (!restored || typeof restored !== 'object' || Array.isArray(restored)) return;
                let localSavedAt = 0;
                try {
                    localSavedAt = Number(localStorage.getItem('pawn_krabi_saved_at') || 0);
                } catch (_) {}
                if (Number(snapshot.savedAt || 0) > localSavedAt) {
                    db = restored;
                    try {
                        localStorage.setItem('pawn_krabi_master_db', serializeDBCompact());
                        localStorage.setItem('pawn_krabi_saved_at', String(snapshot.savedAt));
                    } catch (_) {}
                    console.info('กู้คืนฐานข้อมูลจาก IndexedDB สำเร็จ');
                }
            } catch (error) {
                // เปิดไฟล์แบบ file:// บางเบราว์เซอร์อาจปิดกั้น IndexedDB จึงไม่หยุดการทำงานหลัก
                console.info('ไม่สามารถใช้ IndexedDB ได้ จะใช้ Local Storage แทน:', error);
            }
        }

        function scheduleIndexedDBSave(serializedData) {
            if (indexedDBSaveTimer) clearTimeout(indexedDBSaveTimer);
            indexedDBSaveTimer = setTimeout(() => {
                writeIndexedDBSnapshot(serializedData).catch(error => {
                    console.warn('บันทึกฐานข้อมูลสำรองไม่สำเร็จ:', error);
                    setSaveIndicator('local', 'บันทึกในเครื่องแล้ว · สำรองเพิ่มไม่ได้');
                });
            }, 350);
        }

        function setSaveIndicator(state, message) {
            const indicator = document.getElementById('save-indicator');
            const label = document.getElementById('save-indicator-text');
            if (!indicator || !label) return;
            indicator.dataset.state = state;
            label.textContent = message;
            indicator.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await restoreReliableDatabase();
            setTimeout(() => document.getElementById('login-pin')?.focus(), 100);
        });

        window.addEventListener('pagehide', () => {
            try {
                if (!db || typeof db !== 'object' || Object.keys(db).length === 0) return; // ไม่เขียนทับด้วยฐานว่าง
                localStorage.setItem('pawn_krabi_master_db', serializeDBCompact());
                localStorage.setItem('pawn_krabi_saved_at', String(Date.now()));
            } catch (_) {
                // IndexedDB mirror remains the fallback when localStorage is unavailable.
            }
        });

        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const thaiDays = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
        
        function readLocalDatabaseSafely() {
            try {
                const raw = localStorage.getItem('pawn_krabi_master_db');
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
            } catch (error) {
                console.error('อ่านฐานข้อมูลจาก Local Storage ไม่สำเร็จ:', error);
                return {};
            }
        }
        let db = readLocalDatabaseSafely();
        let currentDate = ""; 

        function getTodayLocalDateStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatNumber(val) {
            if (val === '' || val === null || val === undefined) return '';
            // เก็บเครื่องหมายลบไว้ เพื่อให้ยอดติดลบแสดงตรงกับค่าที่คำนวณจริง
            const raw = String(val).trim().replace(/,/g, '');
            const negative = raw.startsWith('-');
            let cleanVal = raw.replace(/-/g, '').replace(/[^0-9.]/g, '');
            if (cleanVal === '') return '';
            const decimalParts = cleanVal.split('.');
            cleanVal = decimalParts.shift() + (decimalParts.length ? '.' + decimalParts.join('') : '');
            let num = Number((negative ? '-' : '') + cleanVal);
            if (!Number.isFinite(num) || num === 0) return '';
            return num.toLocaleString('th-TH', { maximumFractionDigits: 2 });
        }

        // ปัดเศษจำนวนเงินเป็น 2 ตำแหน่ง ป้องกันความคลาดเคลื่อนทศนิยมของ JavaScript
        function roundMoney(value) {
            const number = Number(value) || 0;
            return Math.round((number + Number.EPSILON) * 100) / 100;
        }

        function cleanNumberString(val) {
             if (val === '' || val === null || val === undefined) return 0;
             let cleanVal = String(val).replace(/[^0-9.-]/g, '');
             let num = Number(cleanVal);
             return isNaN(num) ? 0 : num;
        }

        function checkBackupReminder() {
            let lastBackup = localStorage.getItem('pawn_krabi_last_backup');
            let showWarning = false;
            if (!lastBackup) {
                showWarning = true;
            } else {
                let diffTime = Math.abs(new Date() - new Date(lastBackup));
                let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > 7) showWarning = true;
            }
            if (showWarning) {
                document.getElementById('backup-warning').classList.remove('hidden');
            } else {
                document.getElementById('backup-warning').classList.add('hidden');
            }
        }

        function openQuickScanModal() {
            const m = document.getElementById('quick-scan-modal');
            m.classList.remove('hidden'); m.style.display = 'flex';
            qsClearFields(false); qsSetMsg('', ''); qsRenderRecent();
            setTimeout(() => { if (m.contains(document.activeElement)) return; const b = document.querySelector('.qs-type-btn'); if (b) b.focus(); }, 100); // ไม่แย่งโฟกัสถ้าเริ่มกรอก/ยิงบาร์โค้ดแล้ว
        }

        function closeQuickScanModal() {
            document.getElementById('quick-scan-modal').style.display = 'none';
            document.getElementById('quick-scan-modal').classList.add('hidden');
        }

        function handleQSEnter(e, nextElementId) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (nextElementId === 'submit') {
                    submitQuickScan();
                } else {
                    document.getElementById(nextElementId).focus();
                    if(document.getElementById(nextElementId).tagName === 'INPUT'){
                        document.getElementById(nextElementId).select();
                    }
                }
            }
        }

        // ---------- คีย์ด่วน: ติดตั๋วใหม่ (ข้อมูลตั๋วใหม่เก็บแยกในแถว ไม่เข้าสูตรคำนวณ) ----------
        function qsEl(id) { return document.getElementById(id); }
        function qsSetMsg(text, kind) { const el = qsEl('qs-msg'); if (!el) return; el.textContent = text || ''; el.className = 'qs-msg' + (kind ? ' ' + kind : ''); }
        function qsPaintType() { const v = qsEl('qs-type').value; document.querySelectorAll('.qs-type-btn').forEach(b => b.classList.toggle('on', b.dataset.type === v)); }
        function qsPickType(t) {
            const el = qsEl('qs-type'); el.value = (el.value === t) ? '' : t; qsPaintType(); qsSetMsg('', '');
            if (el.value) qsEl(qsEl('qs-month').value ? 'qs-ticket' : 'qs-month').focus();
        }
        function qsMonthHint() {
            const n = parseInt(qsEl('qs-month').value, 10), el = qsEl('qs-month-name');
            if (isNaN(n) || n < 1 || n > 12) { el.textContent = ''; return; }
            const name = thaiMonths[n - 1], open = getCurrentDayData().months.indexOf(name) !== -1;
            el.textContent = open ? name + ' ✓' : name + ' (ยังไม่เปิดคอลัมน์)';
            el.style.color = open ? '#047857' : '#be123c';
        }
        function qsClearFields(keepContext) {
            ['qs-ticket', 'qs-book', 'qs-amount', 'qs-new-ticket', 'qs-new-book', 'qs-new-amount'].forEach(id => { qsEl(id).value = ''; delete qsEl(id).dataset.barcode; });
            if (!keepContext) { qsEl('qs-type').value = ''; qsEl('qs-month').value = ''; }
            qsPaintType(); qsMonthHint();
        }
        function qsModalKey(e) {
            if (e.key === 'Escape') { closeQuickScanModal(); return; }
            if (e.target && e.target.tagName !== 'INPUT' && ['ส', 'พ', 'ผ', 'ถ'].includes(e.key)) { e.preventDefault(); qsPickType(e.key); }
        }
        function qsIdKey(book, ticket) { return normalizeCompareTicket(book) + '|' + normalizeCompareTicket(ticket); }
        function qsFindLinkedNew(book, ticket, exceptRow) {
            const key = qsIdKey(book, ticket);
            for (const dKey in db) {
                const d = db[dKey];
                if (!d || !Array.isArray(d.months) || !d.data) continue;
                for (const m of d.months) {
                    if (!m || !Array.isArray(d.data[m])) continue;
                    for (const r of d.data[m]) {
                        if (r && r !== exceptRow && r.newTicket && qsIdKey(r.newBook, r.newTicket) === key) return { date: dKey, month: m, ticket: r.ticket };
                    }
                }
            }
            return null;
        }
        function qsRenderRecent() {
            const box = qsEl('qs-recent'); if (!box) return;
            const d = db[currentDate], items = [];
            if (d && Array.isArray(d.months)) d.months.forEach(m => {
                if (!m || !d.data || !Array.isArray(d.data[m])) return;
                d.data[m].forEach((r, i) => { if (r && r.attachedAt) items.push({ m, i, r }); });
            });
            items.sort((a, b) => String(b.r.attachedAt).localeCompare(String(a.r.attachedAt)));
            const all = qsEl('qs-show-all') && qsEl('qs-show-all').checked;
            const list = all ? items : items.slice(0, 8);
            qsEl('qs-recent-count').textContent = items.length ? '(' + items.length + ' รายการ)' : '';
            if (!list.length) { box.innerHTML = '<div class="text-xs text-slate-400">ยังไม่มีรายการวันนี้</div>'; return; }
            box.innerHTML = list.map(({ m, i, r }) => {
                const amt = (r.amount !== '' && cleanNumberString(r.amount) !== 0) ? ' · ' + formatNumber(r.amount) : '';
                const nAmt = (r.newAmount !== undefined && r.newAmount !== '' && cleanNumberString(r.newAmount) !== 0) ? ' · ' + formatNumber(r.newAmount) : '';
                const oldTxt = '<b>' + escapeHtml(r.type || '-') + '</b> ' + escapeHtml(m) + ' แถว ' + (i + 1) + '<br>เดิม: ' + (r.book ? 'เล่ม ' + escapeHtml(r.book) + ' ' : '') + '<b>' + escapeHtml(r.ticket) + '</b>' + amt;
                const newTxt = r.newTicket ? '<br><span style="color:#047857">ใหม่: ' + (r.newBook ? 'เล่ม ' + escapeHtml(r.newBook) + ' ' : '') + '<b>' + escapeHtml(r.newTicket) + '</b>' + nAmt + '</span>' : '<br><span style="color:#94a3b8">ไม่มีตั๋วใหม่</span>';
                const btn = r.newTicket ? '<button type="button" data-m="' + escapeHtml(m) + '" data-i="' + i + '" onclick="qsUnlink(this)">ยกเลิกการติด</button>' : '';
                return '<div class="qs-item"><div>' + oldTxt + newTxt + '</div>' + btn + '</div>';
            }).join('');
        }
        function qsUnlink(btn) {
            const m = btn.dataset.m, i = Number(btn.dataset.i);
            const row = db[currentDate] && db[currentDate].data && db[currentDate].data[m] && db[currentDate].data[m][i];
            if (!row || !row.newTicket) return;
            if (!confirm('ยกเลิกการผูกตั๋วใหม่ ' + row.newTicket + ' ออกจากตั๋วเดิม ' + row.ticket + ' ?\n(แถวในตารางยังอยู่เหมือนเดิม)')) return;
            delete row.newTicket; delete row.newBook; delete row.newAmount;
            saveDB(); renderTable(); qsRenderRecent(); qsSetMsg('ยกเลิกการติดตั๋วใหม่แล้ว', 'ok');
        }
        function submitQuickScan() {
            const type = qsEl('qs-type').value;
            const mNum = parseInt(qsEl('qs-month').value, 10);
            const oldTicket = qsEl('qs-ticket').value.trim(), oldBook = qsEl('qs-book').value.trim();
            const oldAmountRaw = qsEl('qs-amount').value.replace(/,/g, '').trim();
            const newTicket = qsEl('qs-new-ticket').value.trim(), newBook = qsEl('qs-new-book').value.trim();
            const newAmountRaw = qsEl('qs-new-amount').value.replace(/,/g, '').trim();
            const fail = (msg, id) => { qsSetMsg(msg, 'err'); if (id) { qsEl(id).focus(); if (qsEl(id).select) qsEl(id).select(); } return false; };

            if (!type) return fail('กรุณากดเลือกประเภท ส / พ / ผ / ถ');
            if (isNaN(mNum) || mNum < 1 || mNum > 12) return fail('กรุณาใส่เดือนเป็นรหัสตัวเลข 1–12', 'qs-month');
            if (!oldTicket) return fail('กรุณาใส่เลขตั๋วเดิม', 'qs-ticket');
            if (!newTicket && (newBook || newAmountRaw)) return fail('มีเล่มที่/ยอดเงินตั๋วใหม่ แต่ยังไม่ได้ใส่เลขตั๋วใหม่', 'qs-new-ticket');
            if (newTicket && qsIdKey(oldBook, oldTicket) === qsIdKey(newBook, newTicket)) return fail('เลขตั๋วใหม่ซ้ำกับตั๋วเดิม', 'qs-new-ticket');

            const monthName = thaiMonths[mNum - 1];
            const dayData = getCurrentDayData();
            if (dayData.months.indexOf(monthName) === -1) return fail('ยังไม่ได้เปิดคอลัมน์เดือน "' + monthName + '" ในตารางวันนี้ (เลือกหัวคอลัมน์หรือกดเพิ่มเดือนก่อน)', 'qs-month');

            let rows = dayData.data[monthName];
            // 1) ตั๋วเดิมมีในตารางวันนี้แล้ว (เช่นนำเข้าจาก PDF) -> ปรับแถวเดิม ไม่เพิ่มซ้ำ
            let idx = -1;
            for (let i = 0; i < dayData.totalRows; i++) {
                const r = rows[i];
                if (!r || !String(r.ticket || '').trim()) continue;
                if (normalizeCompareTicket(r.ticket) !== normalizeCompareTicket(oldTicket)) continue;
                if (r.book && oldBook && normalizeCompareTicket(r.book) !== normalizeCompareTicket(oldBook)) continue;
                idx = i; break;
            }
            const updating = idx >= 0;
            let useTypedAmount = true;
            if (updating) {
                const r = rows[idx];
                if (r.type && r.type !== type && !confirm('แถวที่ ' + (idx + 1) + ' มีประเภท "' + r.type + '" อยู่แล้ว\nต้องการเปลี่ยนเป็น "' + type + '" หรือไม่?')) return false;
                const tableAmt = cleanNumberString(r.amount), typedAmt = cleanNumberString(oldAmountRaw);
                if (oldAmountRaw !== '' && tableAmt !== 0 && tableAmt !== typedAmt &&
                    !confirm('ยอดในตารางคือ ' + formatNumber(tableAmt) + ' แต่ที่กรอกคือ ' + formatNumber(typedAmt) + '\nตกลง = ใช้ยอดที่กรอก · ยกเลิก = คงยอดในตาราง')) useTypedAmount = false;
                if (newTicket && r.newTicket && qsIdKey(r.newBook, r.newTicket) !== qsIdKey(newBook, newTicket) &&
                    !confirm('แถวนี้ผูกตั๋วใหม่ ' + r.newTicket + ' ไว้แล้ว\nต้องการเปลี่ยนเป็น ' + newTicket + ' หรือไม่?')) return false;
            }
            // 2) ตั๋วใหม่ต้องไม่ซ้ำกับที่เคยติดไว้ (เทียบเล่มที่ + เลขตั๋ว)
            if (newTicket) {
                const dup = qsFindLinkedNew(newBook, newTicket, updating ? rows[idx] : null);
                if (dup && !confirm('ตั๋วใหม่ ' + (newBook ? 'เล่ม ' + newBook + ' ' : '') + 'เลข ' + newTicket + ' เคยถูกติดไว้แล้ว\nวันที่ ' + dup.date + ' · ' + dup.month + ' · ตั๋วเดิม ' + dup.ticket + '\n\nต้องการบันทึกซ้ำหรือไม่?')) return false;
            }
            // 3) ไม่พบตั๋วเดิม -> เพิ่มในแถวว่างแถวแรก (เหมือนเดิม)
            if (!updating) {
                for (let i = 0; i < dayData.totalRows; i++) {
                    const r = rows[i] || { type: '', ticket: '', amount: '' };
                    if (!r.type && !r.ticket && !r.amount) { idx = i; break; }
                }
                if (idx === -1) { addRow(); idx = dayData.totalRows - 1; rows = dayData.data[monthName]; }
                if (!rows[idx]) rows[idx] = { type: '', ticket: '', amount: '', count: '', origIdx: idx, timestamp: '' };
            }
            const row = rows[idx];
            row.type = type;
            if (!updating) { row.ticket = oldTicket; row.amount = cleanNumberString(oldAmountRaw); }
            else if (useTypedAmount && oldAmountRaw !== '') row.amount = cleanNumberString(oldAmountRaw);
            if (oldBook) row.book = oldBook;
            // เลขบาร์โค้ด 13 หลัก เก็บเป็นข้อมูลตรวจสอบเบื้องหลัง (ไม่แสดงในตาราง) เฉพาะเมื่อยังตรงกับเลข/เล่มที่กรอก
            { const bcOf = (id, tk, bk) => { const v = qsEl(id).dataset.barcode || ''; const p = window.__parseTicketBarcode && window.__parseTicketBarcode(v); return (p && qsIdKey(p.book, p.ticket) === qsIdKey(bk, tk)) ? v : ''; };
              const ob = bcOf('qs-ticket', oldTicket, oldBook); if (ob) row.barcode = ob;
              const nb = newTicket ? bcOf('qs-new-ticket', newTicket, newBook) : ''; if (nb) row.newBarcode = nb; }
            if (newTicket) { row.newTicket = newTicket; row.newBook = newBook; row.newAmount = newAmountRaw === '' ? '' : cleanNumberString(newAmountRaw); }
            row.timestamp = new Date().toLocaleTimeString('th-TH');
            row.attachedAt = new Date().toISOString();

            saveDB();
            renderTable();
            try { recalculateFutureBroughtForwardBalances(currentDate); } catch (_) {} // เหมือนการเลือกประเภท/ใส่ยอดในตาราง
            const msg = (updating ? 'ปรับแถวที่ ' : 'เพิ่มแถวที่ ') + (idx + 1) + ' · ' + monthName + ' · ' + type + ' · ' + oldTicket + (newTicket ? ' → ' + newTicket : '');
            qsSetMsg('บันทึกแล้ว: ' + msg, 'ok'); showToast(msg);
            qsClearFields(true); qsRenderRecent(); qsEl('qs-ticket').focus();
            return true;
        }

        function handleEnterKey(e, fieldType, colIdx, rowIdx) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let nextSelector = '';
                
                if (fieldType === 'type') {
                    nextSelector = `.ticket-input-${colIdx}-${rowIdx}`;
                } else if (fieldType === 'ticket') {
                    nextSelector = `.amount-input-${colIdx}-${rowIdx}`;
                } else if (fieldType === 'amount') {
                    let nextRow = rowIdx + 1;
                    let dayData = getCurrentDayData();
                    if (nextRow >= dayData.totalRows) {
                        if (e.target && e.target.blur) e.target.blur(); // บันทึกค่าที่พิมพ์ก่อนวาดตารางใหม่
                        addRow(); 
                    }
                    nextSelector = `.type-select-${colIdx}-${nextRow}`;
                } else if (fieldType === 'sum-type') {
                    nextSelector = `.sum-count-input-${colIdx}-${rowIdx}`;
                } else if (fieldType === 'sum-count') {
                    nextSelector = `.sum-amount-input-${colIdx}-${rowIdx}`;
                } else if (fieldType === 'sum-amount') {
                    let nextRow = rowIdx + 1;
                    let dayData = getCurrentDayData();
                    if (nextRow >= dayData.totalRows) {
                        if (e.target && e.target.blur) e.target.blur();
                        addRow();
                    }
                    nextSelector = `.sum-type-input-${colIdx}-${nextRow}`;
                }
                
                if (nextSelector) {
                    setTimeout(() => {
                        let nextInput = document.querySelector(nextSelector);
                        if (nextInput) {
                            nextInput.focus();
                            if (nextInput.tagName === 'INPUT') nextInput.select();
                        }
                    }, 50);
                }
            }
        }

        function initApp() {
            let dbMigrated = false;
            let newDb = {};
            for (let key in db) {

                    let y = parseInt(parts[0], 10);

                        y -= 543;
                        let newKey = `${y}-${parts[1]}-${parts[2]}`;
                        newDb[newKey] = db[key];
                        dbMigrated = true;
                    } else {
                        newDb[key] = db[key];
                    }
                } else {
                    newDb[key] = db[key];
                }
            }
            if (dbMigrated) {
                db = newDb;
                localStorage.setItem('pawn_krabi_master_db', JSON.stringify(db));
            }

            if (db && Object.prototype.hasOwnProperty.call(db, '') && !hasDayData('')) {
                delete db['']; dbMigrated = true; // ลบคีย์วันที่ว่างที่เคยเกิดจากการล้างช่องวันที่
                try { localStorage.setItem('pawn_krabi_master_db', serializeDBCompact()); } catch (_) {}

            let selOn = ''; try { selOn = localStorage.getItem('pawn_krabi_selected_on') || ''; } catch (_) {}
            currentDate = (selOn === todayStr && localStorage.getItem('pawn_krabi_selected_date')) || todayStr;

            if (currentDate) {
                let parts = currentDate.split('-');
                if (parts.length === 3) {
                    let y = parseInt(parts[0], 10);

            document.getElementById('doc-date').value = currentDate;

        function updateHeaderInfo(dateStr) {
            let thaiYear = new Date().getFullYear() + 543;
            if (dateStr) {
                const parts = dateStr.split('-');
                if (parts.length === 3) {

                    let dayOfWeek = thaiDays[dObj.getDay()];

                    let formattedDateTH = `${String(d).padStart(2, '0')}/${String(m + 1).padStart(2, '0')}/${thaiYear}`;
                    document.getElementById('print-date-text').innerText = formattedDateTH;
                    document.getElementById('display-date-th').innerText = formattedDateTH;
                    document.getElementById('print-day-name').innerText = dayOfWeek;
                    document.getElementById('day-name-display').innerText = `(${dayOfWeek})`;
                }
            }
