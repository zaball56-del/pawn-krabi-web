            document.getElementById('pdf-compare-status').textContent = 'เลือกไฟล์ PDF เพื่อเริ่มตรวจสอบ ระบบจะไม่แก้ไขข้อมูลในตาราง';
            document.getElementById('pdf-compare-summary').classList.add('hidden');
            document.getElementById('pdf-compare-results').classList.add('hidden');
            pdfCompareRecords = [];
            pdfCompareFileName = '';
            pdfCompareDetectedDate = '';
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
        }

        /* แท็บสลับระหว่าง นำเข้า สธ.3 กับ เทียบก่อนนำเข้า (เมนูเดียว) */
        function s3Tab(t) {
            if (t === 'compare') { closePDFImportModal(); openPDFCompareModal(); }
            else { closePDFCompareModal(); openPDFImportModal(); }
        }
        function closePDFCompareModal() {
            const modal = document.getElementById('pdf-compare-modal');
            modal.style.display = 'none';
            modal.classList.add('hidden');
        }

        function normalizePDFDigits(value) {
            const thai = '๐๑๒๓๔๕๖๗๘๙';
            return String(value || '').replace(/[๐-๙]/g, ch => String(thai.indexOf(ch)));
        }

        function parseThaiReportDate(text) {
            const normalized = normalizePDFDigits(text);
            // PDF แต่ละโปรแกรมอาจแยกคำว่า “ประจำวันที่” เป็นหลายชิ้น/มีช่องว่างต่างกัน
            const lines = normalized.split(/\r?\n/);
            let match = null;
            for (const line of lines) {
                if (!line.includes('ประจ')) continue;
                match = line.match(/ประจ[^0-9]{0,50}(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);
                if (match) break;
            }
            if (!match) return '';
            let day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
            if (year > 2400) year -= 543;
            if (month < 1 || month > 12 || day < 1 || day > 31) return '';
            return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        }

        function parsePDFDateParts(value) {
            const parts = String(value || '').split('/');
            if (parts.length !== 3) return null;
            let d = Number(parts[0]), m = Number(parts[1]), y = Number(parts[2]);
            if (y > 2400) y -= 543;
            if (!d || m < 1 || m > 12 || y < 1900) return null;
            return { day:d, month:m, year:y };
        }

        function getPDFTextLines(textContent) {
            const items = (textContent.items || []).filter(item => item.str && item.str.trim());
            const sorted = items.map(item => ({
                text: normalizePDFDigits(item.str).replace(/\s+/g, ' ').trim(),
                x: item.transform ? item.transform[4] : 0,
                y: item.transform ? item.transform[5] : 0
            })).sort((a,b) => Math.abs(b.y-a.y) > 1.5 ? b.y-a.y : a.x-b.x);
            const lines = [];
            for (const item of sorted) {
                let line = lines.find(row => Math.abs(row.y - item.y) <= 2.2);
                if (!line) { line = { y:item.y, items:[] }; lines.push(line); }
                line.items.push(item);
            }
            return lines.map(line => line.items.sort((a,b)=>a.x-b.x).map(item=>item.text).join(' ').replace(/\s+/g,' ').trim());
        }

        async function handlePDFCompareFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const status = document.getElementById('pdf-compare-status');
            const runButton = document.getElementById('pdf-compare-run');
            runButton.disabled = true;
            pdfCompareRecords = [];
            pdfCompareFileName = file.name;
            status.textContent = 'กำลังอ่านข้อความจาก PDF...';
            try {
                if (!window.pdfjsLib) throw new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วเปิดไฟล์ใหม่');
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const buffer = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
                let allText = '';
                const parsed = [];
                for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
                    const page = await pdf.getPage(pageNo);
                    const content = await page.getTextContent();
                    const lines = getPDFTextLines(content);
                    allText += '\n' + lines.join('\n');
                    for (const line of lines) {
                        // รูปแบบแถว: วันที่รับจำนำ เลขตั๋ว/เล่มตั๋ว เลขใบเสร็จ/เล่ม จำนวนเงินต้น ...
                        const match = line.match(/(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,6})\s*\/\s*(\d{1,4})\s+(\d{1,6})\s*\/\s*(\d{1,4})\s+([\d,]+(?:\.\d{1,2})?)/);
                        if (!match) continue;
                        const dateParts = parsePDFDateParts(match[1]);
                        if (!dateParts) continue;
                        parsed.push({
                            loanDate: match[1], month: dateParts.month,
                            ticket: String(Number(match[2])), book: String(Number(match[3])),
                            amount: Number(match[6].replace(/,/g,'')), page: pageNo, sourceLine: line
                        });
                    }
                }
                pdfCompareDetectedDate = parseThaiReportDate(allText);
                if (pdfCompareDetectedDate) document.getElementById('pdf-compare-date').value = pdfCompareDetectedDate;
                if (!parsed.length) {
                    throw new Error('ไม่พบรายการตั๋วใน PDF อาจเป็นไฟล์สแกนเป็นรูปภาพ หรือรูปแบบเอกสารไม่ตรงกับตัวอย่างนี้');
                }
                pdfCompareRecords = parsed;
                const sum = parsed.reduce((total,row)=>total+row.amount,0);
                const monthCounts = {};
                parsed.forEach(row => monthCounts[row.month] = (monthCounts[row.month] || 0) + 1);
                const monthText = Object.keys(monthCounts).sort((a,b)=>Number(a)-Number(b)).map(m=>`${thaiMonths[Number(m)-1]} ${monthCounts[m]} ราย`).join(' · ');
                const dateText = pdfCompareDetectedDate ? `พบวันที่ประจำวันที่ ${pdfCompareDetectedDate}` : 'ไม่พบวันที่ในช่องประจำวันที่ — กรุณาเลือกวันที่ทำรายการเอง';
                status.innerHTML = `<div class="font-bold text-emerald-800">อ่าน PDF สำเร็จ: ${parsed.length} รายการ</div><div class="mt-1">ไฟล์: ${escapeHtml(file.name)}</div><div>ยอดเงินต้นรวมที่อ่านได้: ${formatNumber(sum)}</div><div>${escapeHtml(monthText)}</div><div class="mt-1 text-amber-700">${escapeHtml(dateText)}</div>`;
                runButton.disabled = false;
            } catch (error) {
                console.error('PDF compare read error:', error);
                status.innerHTML = `<span class="font-bold text-rose-700">อ่าน PDF ไม่สำเร็จ</span><div class="mt-1">${escapeHtml(error.message || 'เกิดข้อผิดพลาด')}</div>`;
            }
        }

        function normalizeCompareTicket(value) {
            const text = normalizePDFDigits(value).trim();
            if (!text) return '';
            return /^\d+(?:\.0+)?$/.test(text) ? String(Number(text)) : text.toLowerCase();
        }

        function getLedgerCompareRows(day) {
            const rows = [];
            if (!day || !Array.isArray(day.months) || !day.data) return rows;
            day.months.forEach(monthName => {
                if (!monthName || !day.data[monthName]) return;
                const monthIndex = thaiMonths.indexOf(monthName) + 1;
                day.data[monthName].forEach((item, rowIndex) => {
                    if (!item || !String(item.ticket || '').trim()) return;
                    const type = String(item.type || '').trim();
                    // PDF ไม่ระบุประเภทในแต่ละรายการ จึงต้องเปรียบเทียบทุกประเภท (ส/พ/ผ/ถ) โดยไม่กรองตาม type
                    rows.push({ month:monthIndex, monthName, ticket:normalizeCompareTicket(item.ticket), amount:Number(cleanNumberString(item.amount || 0)) || 0, type, rowIndex:rowIndex+1 });
                });
            });
            return rows;
        }

        function runPDFComparison() {
            if (!pdfCompareRecords.length) return;
            const dateKey = document.getElementById('pdf-compare-date').value;
            if (!dateKey) { alert('กรุณาระบุวันที่ประจำวันที่ของรายงานก่อนเปรียบเทียบ'); return; }
            if (pdfCompareDetectedDate && dateKey !== pdfCompareDetectedDate) {
                if (!confirm(`วันที่ในหัวรายงานคือ ${pdfCompareDetectedDate} แต่เลือกวันที่ ${dateKey}\nต้องการเปรียบเทียบกับวันที่ที่เลือกหรือไม่?`)) return;
            }
            const day = db[dateKey];
            if (!day) {
                document.getElementById('pdf-compare-status').innerHTML = `<span class="text-rose-700 font-bold">ไม่พบข้อมูลที่คีย์ไว้ในวันที่ ${escapeHtml(dateKey)}</span><div class="mt-1">กรุณาตรวจวันที่ หรือเลือกวันที่มีข้อมูลในโปรแกรม</div>`;
                document.getElementById('pdf-compare-summary').classList.add('hidden');
                document.getElementById('pdf-compare-results').classList.add('hidden');
                return;
            }
            const keyed = getLedgerCompareRows(day);
            const pdfByKey = new Map();
            const ledgerByKey = new Map();
            const makeKey = row => `${row.month}|${row.ticket}`;
            pdfCompareRecords.forEach(row => {
                const key = makeKey(row);
                if (!pdfByKey.has(key)) pdfByKey.set(key, []);
                pdfByKey.get(key).push(row);
            });
            keyed.forEach(row => {
                const key = makeKey(row);
                if (!ledgerByKey.has(key)) ledgerByKey.set(key, []);
                ledgerByKey.get(key).push(row);
            });
            const results = [];
            const matchedLedgerKeys = new Set();
            let okCount=0, amountMismatch=0, missingCount=0, extraCount=0, duplicateCount=0, monthMismatch=0;

            for (const pdfRow of pdfCompareRecords) {
                const key = makeKey(pdfRow);
                const pdfGroup = pdfByKey.get(key) || [];
                const ledgerGroup = ledgerByKey.get(key) || [];
                if (pdfGroup.length > 1) {
                    duplicateCount++;
                    results.push({status:'ข้อมูลซ้ำใน PDF',kind:'error',...pdfRow,ledgerAmount:null,detail:`เลขตั๋ว/เดือนนี้ปรากฏใน PDF ${pdfGroup.length} ครั้ง`});
                    continue;
                }
                if (ledgerGroup.length > 1) {
                    duplicateCount++;
                    results.push({status:'ข้อมูลซ้ำในตาราง',kind:'error',...pdfRow,ledgerAmount:null,detail:`พบเลขตั๋วนี้ในตาราง ${ledgerGroup.length} แถว`});
                    ledgerGroup.forEach(r=>matchedLedgerKeys.add(`${r.month}|${r.ticket}|${r.rowIndex}`));
                    continue;
                }
                if (ledgerGroup.length === 1) {
                    const ledgerRow = ledgerGroup[0];
                    matchedLedgerKeys.add(`${ledgerRow.month}|${ledgerRow.ticket}|${ledgerRow.rowIndex}`);
                    if (Math.abs(ledgerRow.amount - pdfRow.amount) > 0.009) {
                        amountMismatch++;
                        results.push({status:'ยอดเงินไม่ตรง',kind:'error',...pdfRow,ledgerAmount:ledgerRow.amount,ledgerMonthName:ledgerRow.monthName,ledgerRowIndex:ledgerRow.rowIndex,detail:`ต่างกัน ${formatNumber(Math.abs(ledgerRow.amount-pdfRow.amount))} บาท${ledgerRow.type ? '' : ' · ยังไม่ได้ระบุประเภทในตาราง'}`});
                    } else {
                        okCount++;
                        results.push({status:'ตรงกัน',kind:'ok',...pdfRow,ledgerAmount:ledgerRow.amount,ledgerMonthName:ledgerRow.monthName,ledgerRowIndex:ledgerRow.rowIndex,detail:ledgerRow.type ? 'เลขตั๋วและยอดเงินตรงกัน' : 'เลขตั๋วและยอดเงินตรงกัน แต่ยังไม่ได้ระบุประเภท'});
                    }
                    continue;
                }
                const elsewhere = keyed.filter(row => row.ticket === pdfRow.ticket);
                if (elsewhere.length) {
                    monthMismatch++;
                    const uniqueElsewhere = elsewhere.length === 1 ? elsewhere[0] : null;
                    results.push({status:'อาจคีย์ผิดเดือน',kind:'warn',...pdfRow,
                        ledgerAmount:elsewhere[0].amount,
                        ledgerMonthName:uniqueElsewhere?.monthName || '',
                        ledgerRowIndex:uniqueElsewhere?.rowIndex || null,
                        detail:`PDF อยู่เดือน ${thaiMonths[pdfRow.month-1]} แต่พบในตารางเดือน ${elsewhere.map(x=>x.monthName).join(', ')}${uniqueElsewhere && Math.abs(uniqueElsewhere.amount-pdfRow.amount)>0.009 ? ` · ยอดในตาราง ${formatNumber(uniqueElsewhere.amount)} บาท ไม่ตรงกับ PDF ${formatNumber(pdfRow.amount)} บาท` : ''}${elsewhere.length > 1 ? ' · พบหลายแถว จึงไม่เปิดให้แก้/ย้ายอัตโนมัติ' : ''}`});
                    elsewhere.forEach(r=>matchedLedgerKeys.add(`${r.month}|${r.ticket}|${r.rowIndex}`));
                } else {
                    missingCount++;
                    results.push({status:'ยังไม่ได้คีย์',kind:'warn',...pdfRow,ledgerAmount:null,detail:'พบใน PDF แต่ไม่พบเลขตั๋วนี้ในตารางของวันที่เลือก'});
                }
            }

            for (const ledgerRow of keyed) {
                const ledgerId = `${ledgerRow.month}|${ledgerRow.ticket}|${ledgerRow.rowIndex}`;
                if (matchedLedgerKeys.has(ledgerId)) continue;
                if (pdfByKey.has(makeKey(ledgerRow))) continue;
                extraCount++;
                results.push({status:'มีในตารางแต่ไม่พบใน PDF',kind:'warn',month:ledgerRow.month,ticket:ledgerRow.ticket,book:'—',amount:0,ledgerAmount:ledgerRow.amount,detail:`รายการในตารางเดือน ${ledgerRow.monthName} แถว ${ledgerRow.rowIndex}${ledgerRow.type ? ` ประเภท ${ledgerRow.type}` : ' (ยังไม่ระบุประเภท)'}`});
            }

            // เรียงรายการผิดเดือนและข้อผิดพลาดไว้บนสุด เพื่อไม่ให้จมหายอยู่ท้ายรายการจำนวนมาก
            const statusPriority = { 'อาจคีย์ผิดเดือน':0, 'ยอดเงินไม่ตรง':1, 'ข้อมูลซ้ำใน PDF':2, 'ข้อมูลซ้ำในตาราง':3, 'มีในตารางแต่ไม่พบใน PDF':4, 'ยังไม่ได้คีย์':5, 'ตรงกัน':6 };
            results.sort((a,b) => (statusPriority[a.status] ?? 9) - (statusPriority[b.status] ?? 9));

            const summary = document.getElementById('pdf-compare-summary');
            const cards = [
                ['ตรงกัน',okCount,'compare-ok'],['ยอดเงินผิด',amountMismatch,'compare-error'],['ยังไม่ได้คีย์',missingCount,'compare-warn'],['ผิดเดือน',monthMismatch,'compare-warn'],['รายการเกิน/ซ้ำ',extraCount+duplicateCount,'compare-error']
            ];
            summary.innerHTML = cards.map(([label,value,cls])=>`<div class="rounded-lg border p-2 ${cls}"><div class="text-[10px]">${label}</div><div class="text-xl font-bold">${value}</div></div>`).join('');
            summary.classList.remove('hidden');
            pdfCompareResultsCache = results;
            document.getElementById('pdf-compare-filter').value = 'issues';
            document.getElementById('pdf-compare-results').classList.remove('hidden');
            filterPDFCompareResults();
            document.getElementById('pdf-compare-status').innerHTML = `<span class="font-bold text-violet-800">เปรียบเทียบเสร็จแล้ว</span><div>วันที่: ${escapeHtml(dateKey)} · PDF ${pdfCompareRecords.length} รายการ · ข้อมูลในตารางที่นำมาเทียบ ${keyed.length} รายการ</div><div class="text-amber-700 mt-1">การตรวจนี้ไม่แก้ไขข้อมูลใด ๆ ในระบบ</div>`;
        }

        function filterPDFCompareResults() {
            const mode = document.getElementById('pdf-compare-filter')?.value || 'issues';
            const visible = pdfCompareResultsCache.filter(row => {
                if (mode === 'all') return true;
                if (mode === 'monthMismatch') return row.status === 'อาจคีย์ผิดเดือน';
                if (mode === 'ok') return row.kind === 'ok';
                if (mode === 'error') return row.kind === 'error';
                if (mode === 'warn') return row.kind === 'warn';
                return row.kind !== 'ok'; // ค่าเริ่มต้น: ซ่อนรายการที่ตรงกัน
            });
            const tbody = document.getElementById('pdf-compare-tbody');
            tbody.innerHTML = visible.map(row => {
                const cls = row.kind === 'ok' ? 'compare-ok' : row.kind === 'error' ? 'compare-error' : 'compare-warn';
                const monthName = row.month ? thaiMonths[row.month - 1] : '-';
                const canEditMatched = ['ยอดเงินไม่ตรง','อาจคีย์ผิดเดือน'].includes(row.status) && row.ledgerRowIndex !== null && row.ledgerRowIndex !== undefined && row.ledgerMonthName;
                const fixInputId = `pdf-fix-${row.month}-${String(row.ticket).replace(/[^a-zA-Z0-9_-]/g,'_')}`;
                const fixControl = canEditMatched ? `<div class="mt-2 flex flex-wrap items-center gap-1"><label class="text-[10px] font-semibold">ยอดที่ถูกต้องตาม PDF</label><input id="${fixInputId}" type="number" inputmode="decimal" step="0.01" min="0" value="${Number(row.amount || 0)}" class="w-28 border border-rose-300 rounded px-2 py-1 text-right text-xs bg-white"><button onclick="applyPDFCompareFullCorrection('${escapeHtml(row.ledgerMonthName)}',${Number(row.ledgerRowIndex)-1},'${escapeHtml(row.ticket)}',${Number(row.month)},'${fixInputId}')" class="px-2.5 py-1.5 rounded bg-emerald-700 hover:bg-emerald-800 text-white text-[10px] font-bold">${row.status === 'อาจคีย์ผิดเดือน' ? 'แก้ยอด + ย้ายเดือน + บันทึก' : 'แก้ยอด + บันทึก'}</button></div>` : '';
                const canMoveMonth = row.status === 'อาจคีย์ผิดเดือน' && row.ledgerRowIndex !== null && row.ledgerRowIndex !== undefined && row.ledgerMonthName;
                const moveControl = canMoveMonth ? `<div class="mt-2"><button onclick="movePDFCompareMonth('${escapeHtml(row.ledgerMonthName)}',${Number(row.ledgerRowIndex)-1},'${escapeHtml(row.ticket)}',${Number(row.month)})" class="px-2.5 py-1.5 rounded bg-amber-700 hover:bg-amber-800 text-white text-[10px] font-bold"><i class="fa-solid fa-right-left mr-1"></i>ย้ายเดือนอย่างเดียว</button></div>` : '';
                const rowClass = row.status === 'อาจคีย์ผิดเดือน' ? 'bg-amber-100 text-amber-950 ring-2 ring-inset ring-amber-400' : cls;
                return `<tr class="${rowClass}"><td class="border p-2 font-bold whitespace-nowrap">${escapeHtml(row.status)}${row.status === 'อาจคีย์ผิดเดือน' ? '<div class="text-[10px] font-normal mt-1">พบในเดือนอื่น</div>' : ''}</td><td class="border p-2 whitespace-nowrap">${escapeHtml(monthName)}</td><td class="border p-2 text-center font-semibold">${escapeHtml(row.ticket)}</td><td class="border p-2 text-center">${escapeHtml(row.book || '—')}</td><td class="border p-2 text-right tabular-nums">${row.ledgerAmount === null ? '—' : formatNumber(row.ledgerAmount)}</td><td class="border p-2 text-right tabular-nums">${row.amount ? formatNumber(row.amount) : '—'}</td><td class="border p-2">${escapeHtml(row.detail || '')}${fixControl}${moveControl}</td></tr>`;
            }).join('') || '<tr><td colspan="7" class="p-4 text-center text-slate-500">ไม่มีรายการในตัวกรองนี้</td></tr>';
            document.getElementById('pdf-compare-filter-count').textContent = `แสดง ${visible.length} จากทั้งหมด ${pdfCompareResultsCache.length} รายการ`;
        }


        // หาแถวว่างในเดือนปลายทาง โดยไม่ต่อท้ายเกินจำนวนแถวที่ตารางแสดง
        // และไม่ใช้ splice เพราะแต่ละเดือนใช้เลขแถวเดียวกันเป็นตำแหน่งคู่ขนานกัน
        function findOrCreateMonthRowSlot(day, monthName) {
            if (!day.data) day.data = {};
            if (!Array.isArray(day.data[monthName])) day.data[monthName] = [];
            const rows = day.data[monthName];
            const visibleLimit = Math.max(Number(day.totalRows) || 0, rows.length);
            const isBlank = (item) => {
                if (!item) return true;
                const ticket = String(item.ticket ?? '').trim();
                const amountText = String(item.amount ?? '').replace(/,/g, '').trim();
                const countText = String(item.count ?? '').replace(/,/g, '').trim();
                const amount = amountText === '' ? 0 : Number(amountText);
                const count = countText === '' ? 0 : Number(countText);

                // แถวที่ไม่มีเลขตั๋วและไม่มียอดเงินจริงถือเป็นช่องว่าง
                // แม้จะมีประเภทค้างอยู่ หรือมีค่า 0 จากการบันทึกครั้งก่อน
                const amountIsEmpty = amountText === '' || (Number.isFinite(amount) && amount === 0);
                const countIsEmpty = countText === '' || (Number.isFinite(count) && count === 0);
                return ticket === '' && amountIsEmpty && countIsEmpty;
            };

            // ใช้จำนวนแถวที่ตารางแสดงจริง และค้นหาช่องว่างทุกแถวก่อนเพิ่มแถวใหม่
            const rowLimit = Number(day.totalRows) || 60; // ไม่เกินจำนวนแถวที่ตารางแสดงจริง
            for (let i = 0; i < rowLimit; i++) {
                if (isBlank(rows[i])) return i;
            }

            // หากเต็มทุกแถว ให้เพิ่มจำนวนแถวทั้งตารางอย่างสอดคล้องกัน
            const newIndex = visibleLimit;
            day.totalRows = newIndex + 1;
            (Array.isArray(day.months) ? day.months : []).forEach(name => {
                if (!name) return;
                if (!Array.isArray(day.data[name])) day.data[name] = [];
                while (day.data[name].length <= newIndex) {
                    const i = day.data[name].length;
                    day.data[name].push({ type: '', ticket: '', amount: '', count: '', origIdx: i, timestamp: '' });
                }
            });
            while (rows.length <= newIndex) {
                const i = rows.length;
                rows.push({ type: '', ticket: '', amount: '', count: '', origIdx: i, timestamp: '' });
            }
            return newIndex;
        }

        function clearMovedMonthRow(day, monthName, rowIndex) {
            const rows = day.data[monthName];
            const old = rows[rowIndex] || {};
            rows[rowIndex] = { type: '', ticket: '', amount: '', count: '', origIdx: old.origIdx ?? rowIndex, timestamp: '' };
        }

        function applyPDFCompareFullCorrection(sourceMonthName, sourceRowIndex, ticket, targetMonthNumber, inputId) {
            const dateKey = document.getElementById('pdf-compare-date')?.value;
            const day = dateKey && db[dateKey];
            const input = document.getElementById(inputId);
            if (!input) { alert('ไม่พบช่องกรอกยอดเงิน กรุณาปิดหน้าต่างแล้วเปรียบเทียบ PDF ใหม่'); return; }
            const newAmount = Number(cleanNumberString(input.value));
            if (!day || !day.data || !Array.isArray(day.data[sourceMonthName])) {
                alert('ไม่พบข้อมูลเดือนต้นทาง กรุณาเปรียบเทียบ PDF ใหม่'); return;
            }
            const sourceRows = day.data[sourceMonthName];
            const row = sourceRows[sourceRowIndex];
            if (!row || normalizeCompareTicket(row.ticket) !== normalizeCompareTicket(ticket)) {
                alert('ข้อมูลรายการเปลี่ยนแปลงไปแล้ว กรุณาเปรียบเทียบ PDF ใหม่'); return;
            }
            if (!Number.isFinite(newAmount) || newAmount < 0) { alert('กรุณากรอกจำนวนเงินที่ถูกต้อง'); return; }
            const targetMonthName = thaiMonths[targetMonthNumber - 1];
            if (!targetMonthName) { alert('ไม่พบเดือนปลายทางจาก PDF'); return; }
            const isMoving = sourceMonthName !== targetMonthName;
            if (isMoving) {
                const targetRows = Array.isArray(day.data[targetMonthName]) ? day.data[targetMonthName] : [];
                if (targetRows.some(r => normalizeCompareTicket(r.ticket) === normalizeCompareTicket(ticket))) {
                    alert(`เดือน${targetMonthName} มีเลขตั๋ว ${ticket} อยู่แล้ว จึงไม่สามารถย้ายซ้ำได้`); return;
                }
            }
            const oldAmount = Number(cleanNumberString(row.amount || 0)) || 0;
            const actionText = isMoving
                ? `ยืนยันแก้ไขตั๋ว ${ticket}
เดือน: ${sourceMonthName} → ${targetMonthName}
ยอดเงิน: ${formatNumber(oldAmount)} → ${formatNumber(newAmount)} บาท
ระบบจะย้ายทั้งแถวและบันทึกทันที`
                : `ยืนยันแก้ไขยอดเงินตั๋ว ${ticket} เดือน${sourceMonthName}
จาก ${formatNumber(oldAmount)} บาท เป็น ${formatNumber(newAmount)} บาท?`;
            if (!confirm(actionText)) return;

            // เก็บประวัติการแก้ไขไว้ในฐานข้อมูล เพื่อให้ตรวจสอบย้อนหลังได้
            if (!Array.isArray(day.correctionHistory)) day.correctionHistory = [];
            day.correctionHistory.push({
                dateKey, ticket: String(ticket), action: isMoving ? 'แก้ยอดและย้ายเดือนจากผลเทียบ PDF' : 'แก้ยอดจากผลเทียบ PDF',
                fromMonth: sourceMonthName, toMonth: targetMonthName,
                oldAmount, newAmount, changedAt: new Date().toISOString()
            });
            row.amount = String(newAmount);
            if (isMoving) {
                const targetRowIndex = findOrCreateMonthRowSlot(day, targetMonthName);
                // คัดลอกข้อมูลทั้งแถวลงช่องว่าง โดยคงเลขแถวเดิมของเดือนอื่นไว้
                day.data[targetMonthName][targetRowIndex] = { ...row, origIdx: targetRowIndex };
                clearMovedMonthRow(day, sourceMonthName, sourceRowIndex);
                if (Array.isArray(day.months) && !day.months.includes(targetMonthName)) day.months.push(targetMonthName);
            }
            saveDB();
            if (typeof renderTable === 'function') renderTable();
            alert(isMoving ? `แก้ยอดและย้ายตั๋ว ${ticket} ไปเดือน${targetMonthName} เรียบร้อยแล้ว` : `แก้ยอดตั๋ว ${ticket} เรียบร้อยแล้ว`);
            runPDFComparison();
        }

        function movePDFCompareMonth(sourceMonthName, sourceRowIndex, ticket, targetMonthNumber) {
            const dateKey = document.getElementById('pdf-compare-date')?.value;
            const day = dateKey && db[dateKey];
            if (!day || !day.data || !Array.isArray(day.data[sourceMonthName])) {
                alert('ไม่พบข้อมูลเดือนต้นทาง กรุณาเปรียบเทียบ PDF ใหม่'); return;
            }
            const sourceRows = day.data[sourceMonthName];
            const row = sourceRows[sourceRowIndex];
            if (!row || normalizeCompareTicket(row.ticket) !== normalizeCompareTicket(ticket)) {
                alert('ข้อมูลรายการเปลี่ยนแปลงไปแล้ว กรุณาเปรียบเทียบ PDF ใหม่'); return;
            }
            const targetMonthName = thaiMonths[targetMonthNumber - 1];
            if (!targetMonthName) { alert('ไม่พบชื่อเดือนปลายทาง'); return; }
            if (sourceMonthName === targetMonthName) { alert('รายการนี้อยู่ในเดือนที่ถูกต้องอยู่แล้ว'); return; }
            if (!Array.isArray(day.data[targetMonthName])) day.data[targetMonthName] = [];
            const duplicateInTarget = day.data[targetMonthName].some(r => normalizeCompareTicket(r.ticket) === normalizeCompareTicket(ticket));
            if (duplicateInTarget) {
                alert(`เดือน${targetMonthName} มีเลขตั๋ว ${ticket} อยู่แล้ว จึงไม่สามารถย้ายซ้ำได้`); return;
            }
            if (!confirm(`ยืนยันย้ายตั๋ว ${ticket} จากเดือน${sourceMonthName} ไปเดือน${targetMonthName}?\nระบบจะย้ายข้อมูลทั้งแถวและบันทึกทันที โดยไม่เปลี่ยนยอดเงินหรือประเภท`)) return;
            const movedRow = { ...row };
            const targetRowIndex = findOrCreateMonthRowSlot(day, targetMonthName);
            day.data[targetMonthName][targetRowIndex] = { ...movedRow, origIdx: targetRowIndex };
            clearMovedMonthRow(day, sourceMonthName, sourceRowIndex);
            if (Array.isArray(day.months) && !day.months.includes(targetMonthName)) day.months.push(targetMonthName);
            saveDB();
            if (typeof renderTable === 'function') renderTable();
            alert(`ย้ายตั๋ว ${ticket} ไปเดือน${targetMonthName} และบันทึกแล้ว`);
            runPDFComparison();
        }

        function applyPDFCompareCorrection(monthName, rowIndex, ticket, expectedAmount, inputId) {
            const dateKey = document.getElementById('pdf-compare-date')?.value;
            const input = document.getElementById(inputId);
            const newAmount = Number(cleanNumberString(input ? input.value : ''));
            if (!dateKey || !db[dateKey] || !db[dateKey].data || !Array.isArray(db[dateKey].data[monthName])) {
                alert('ไม่พบข้อมูลวันที่หรือเดือนที่ต้องการแก้ไข กรุณาเปรียบเทียบใหม่'); return;
            }
            const row = db[dateKey].data[monthName][rowIndex];
            if (!row || normalizeCompareTicket(row.ticket) !== normalizeCompareTicket(ticket)) {
                alert('ข้อมูลแถวนี้เปลี่ยนแปลงไปแล้ว เพื่อความปลอดภัยกรุณาเปรียบเทียบ PDF ใหม่'); return;
            }
            if (!Number.isFinite(newAmount) || newAmount < 0) { alert('กรุณากรอกจำนวนเงินที่ถูกต้อง'); return; }
            if (!confirm(`ยืนยันแก้ไขยอดเงินของตั๋ว ${ticket} เดือน${monthName}
จาก ${formatNumber(row.amount || 0)} บาท เป็น ${formatNumber(newAmount)} บาท?`)) return;
            row.amount = String(newAmount);
            saveDB();
            if (typeof renderTable === 'function') renderTable();
            alert('แก้ไขยอดเงินและบันทึกแล้ว ระบบจะตรวจสอบผลใหม่');
            runPDFComparison();
        }

            box.style.setProperty('--w2', ths[ths.length - 2].offsetWidth + 'px');
        }
        (function wrapForUI() {
            const origRender = renderTable;
            renderTable = function () { const r = origRender.apply(this, arguments); try { fixStickyLayout(); updateBalanceModeBadge(); } catch (_) {} return r; };
            const origCalc = updateDailyBalanceCalculator;
            updateDailyBalanceCalculator = function () { const r = origCalc.apply(this, arguments); try { updateBalanceModeBadge(); } catch (_) {} return r; };
        })();
        window.addEventListener('resize', () => { try { fixStickyLayout(); updateHeaderHeightVar(); } catch (_) {} });
        document.addEventListener('click', (e) => {
            const inMenuItem = e.target.closest && e.target.closest('button.menu-item');
            document.querySelectorAll('details.hdr-menu[open]').forEach(d => {
                if (inMenuItem ? d.contains(inMenuItem) : !d.contains(e.target)) d.removeAttribute('open');
            });
        });
        // กด Ctrl+P ตรงๆ: เปิดตัวอย่างพิมพ์ให้อัตโนมัติ แทนที่จะได้หน้าว่าง
        let autoOpenedPreview = false;
        window.addEventListener('beforeprint', () => {
            const app = document.getElementById('app-container'), m = document.getElementById('print-preview-modal');
            if (document.body.classList.contains('mr-printing')) return;
            if (app && app.style.display === 'flex' && m && m.style.display !== 'flex') { autoOpenedPreview = true; openPrintPreview(); }
        });
        window.addEventListener('afterprint', () => { if (autoOpenedPreview) { autoOpenedPreview = false; closePrintPreview(); } });

        // ====== App shell v1.1: เมนูซ้าย + หน้าแรก (อ่านข้อมูลอย่างเดียว ไม่แก้สูตร) ======
        function sbToggle() { document.body.classList.toggle('sb-open'); }
        function sbClose() { document.body.classList.remove('sb-open'); }
        function goPage(name) {
            const home = name !== 'ledger';
            document.body.classList.add('app-shell');
            document.body.classList.toggle('page-home', home);
            document.querySelectorAll('#app-sidebar .sb-item[data-page]').forEach(b => b.classList.toggle('on', b.dataset.page === (home ? 'home' : 'ledger')));
            sbClose();
            if (home) renderHome();
            else { try { fixStickyLayout(); } catch (_) {} window.scrollTo(0, 0); }
        }
        function hpText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
        function hpGet(id) { const el = document.getElementById(id); return el ? (el.value !== undefined && el.tagName === 'INPUT' ? el.value : el.textContent) : ''; }
        function hpThaiDate(key) {
            const p = String(key).split('-'); if (p.length !== 3) return key;
            return p[2] + '/' + p[1] + '/' + (Number(p[0]) + 543);
        }
        function renderHome() {
            if (!document.body.classList.contains('page-home')) return;
            try {
                hpText('hp-date', hpThaiDate(currentDate));
                // ตัวเลขหลักอ่านจากกล่องคำนวณเดิม (ผลจากสูตรเดิม) ไม่คำนวณซ้ำ
                hpText('hp-pledge', hpGet('calc-pledge-count') + ' ราย / ' + hpGet('calc-pledge') + ' บาท');
                hpText('hp-redeem', hpGet('calc-redemption-count') + ' ราย / ' + hpGet('calc-redemption') + ' บาท');
                hpText('hp-balance', hpGet('calc-balance'));
                hpText('hp-mode', (document.getElementById('balance-mode-badge') || {}).textContent || '');
                hpText('hp-open', 'ย/ม ' + hpGet('calc-opening-count') + ' ราย / ' + hpGet('calc-opening') + ' บาท');
                const day = db[currentDate];
                const recent = [];
                let newCount = 0;
                if (day && Array.isArray(day.months) && day.data) {
                    day.months.forEach(m => {
                        if (!m || !Array.isArray(day.data[m])) return;
                        day.data[m].forEach(r => {
                            if (!r || !String(r.ticket || '').trim()) return;
                            if (r.newTicket) newCount++;
                            recent.push({ m, r, ts: String(r.attachedAt || '') || String(r.timestamp || '') });
                        });
                    });
                }
                hpText('hp-new', newCount + ' ราย');
                const withTime = recent.filter(x => x.r.timestamp || x.r.attachedAt);
                withTime.sort((a, b) => String(b.r.timestamp || '').localeCompare(String(a.r.timestamp || '')));
                const list = withTime.slice(0, 6);
                document.getElementById('hp-recent').innerHTML = list.length ? list.map(({ m, r }) => {
                    const amt = (r.amount !== '' && cleanNumberString(r.amount) !== 0) ? formatNumber(r.amount) : '';
                    const red = r.type === 'ถ' ? ' style="color:#B91C1C"' : '';
                    return '<div class="hp-row"><span>' + escapeHtml(r.timestamp || '') + ' · <b' + red + '>' + escapeHtml(r.type || '-') + '</b> · ' + escapeHtml(m) + ' · ' + escapeHtml(r.ticket) +
                        (r.newTicket ? ' <span style="color:#047857">→ ' + escapeHtml(r.newTicket) + '</span>' : '') + '</span><b>' + amt + '</b></div>';
                }).join('') : '<div class="hp-empty"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="14" y="8" width="30" height="40" rx="4" fill="#EFF6FF" stroke="#93B4F0" stroke-width="2"/><path d="M20 20h18M20 27h18M20 34h10" stroke="#93B4F0" stroke-width="2" stroke-linecap="round"/><circle cx="43" cy="43" r="9" fill="#fff" stroke="#1D4ED8" stroke-width="2.5"/><path d="M50 50l7 7" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/></svg><span>ยังไม่มีรายการที่บันทึกในวันนี้</span><span style="font-size:12px">กด "คีย์ด่วน" หรือนำเข้า สธ.3 เพื่อเริ่มบันทึก</span></div>';
                // กราฟ: ยอดไถ่ถอน 7 วันล่าสุดที่มีข้อมูล (ใช้ฟังก์ชันเดิม getDailyRedemptionTotals อ่านอย่างเดียว)
                const keys = Object.keys(db).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= currentDate && db[k] && db[k].data).sort().slice(-7);
                const vals = keys.map(k => { try { return getDailyRedemptionTotals(db[k]).amount; } catch (_) { return 0; } });
                const max = Math.max(1, ...vals);
                document.getElementById('hp-chart').innerHTML = keys.length ? keys.map((k, i) =>
                    '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%" title="' + hpThaiDate(k) + ' : ' + formatNumber(vals[i]) + ' บาท">' +
                    '<span style="font-size:11px;color:#14213D;font-weight:600">' + (vals[i] ? formatNumber(vals[i]) : '0') + '</span>' +
                    '<div style="width:70%;height:' + Math.max(2, Math.round(vals[i] / max * 100)) + '%;background:#1F5FD6;border-radius:6px 6px 0 0;opacity:' + (0.55 + 0.45 * (i + 1) / keys.length).toFixed(2) + '"></div>' +
                    '<span style="font-size:11px;color:#4A5568">' + k.slice(8) + '/' + k.slice(5, 7) + '</span></div>'
                ).join('') : '<div style="color:#64748b;font-size:13px">ยังไม่มีข้อมูลย้อนหลัง</div>';
            } catch (e) { console.error('renderHome', e); }
        }
        function updateSidebarSaved() {
            const el = document.getElementById('sb-saved'); if (!el) return;
            let at = 0; try { at = Number(localStorage.getItem('pawn_krabi_saved_at')) || 0; } catch (_) {}
            el.textContent = at ? 'บันทึกล่าสุด ' + new Date(at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : 'บันทึกล่าสุด -';
        }
        // ซ่อน/แสดงแถบคำนวณคงเหลือ (ซ่อนเฉพาะการแสดงผล ตัวคำนวณและช่องข้อมูลยังอยู่และทำงานตามเดิม)
        function applyCalcPanel() {
            let collapsed = true;
            try { collapsed = localStorage.getItem('pawn_krabi_calc_collapsed') !== '0'; } catch (_) {}
            const box = document.getElementById('daily-balance-calculator'), btn = document.getElementById('calc-toggle');
            if (!box || !btn) return;
            box.classList.toggle('calc-collapsed', collapsed);
            btn.textContent = collapsed ? 'แสดงรายละเอียด' : 'ซ่อน';
            btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        }
        function toggleCalcPanel() {
            const box = document.getElementById('daily-balance-calculator');
            const collapsed = !(box && box.classList.contains('calc-collapsed'));
            try { localStorage.setItem('pawn_krabi_calc_collapsed', collapsed ? '1' : '0'); } catch (_) {}
            applyCalcPanel();
        }
        applyCalcPanel();
        (function wrapShell() {
            const r0 = renderTable;
            renderTable = function () { const r = r0.apply(this, arguments); try { renderHome(); updateSidebarSaved(); } catch (_) {} return r; };
            const i0 = initApp;
            initApp = function () {
                const r = i0.apply(this, arguments);
                try {
                    if (window.pawnDesktop && typeof window.pawnDesktop.openSettings === 'function')
                        document.querySelectorAll('.sb-desktop-only').forEach(b => { b.style.display = 'flex'; });
                    goPage('home'); updateSidebarSaved();
                } catch (e) { console.error('shell init', e); }
                return r;
            };
            setInterval(() => { try { updateSidebarSaved(); } catch (_) {} }, 20000);
        })();
    </script>
