<style id="mfx-css">
/* ลูกเล่นเคลื่อนไหวเบา ๆ หน้าแรก: ออโรร่าพื้นหลัง · การ์ดกระจก · ไล่ขึ้นทีละใบ · เส้นแสงวิ่ง */
@media (prefers-reduced-motion:no-preference){
  html body.page-home{position:relative}
  html body.page-home::before,html body.page-home::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
  html body.page-home::before{width:62vmax;height:62vmax;left:-22vmax;top:-18vmax;background:radial-gradient(circle,#7c3aed 0%,rgba(124,58,237,0) 68%);animation:mfxA 22s ease-in-out infinite alternate}
  html body.page-home::after{width:58vmax;height:58vmax;right:-24vmax;bottom:-16vmax;background:radial-gradient(circle,#06b6d4 0%,rgba(6,182,212,0) 68%);animation:mfxB 26s ease-in-out infinite alternate}
  @keyframes mfxA{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
  @keyframes mfxB{to{transform:translate3d(-12vmax,-9vmax,0) scale(1.2)}}
  html body.page-home #home-page{position:relative;z-index:1}
  /* ไล่ขึ้นทีละใบ */
  html body.page-home #home-page .hp-grid4>*{opacity:0;transform:translateY(18px) scale(.97);animation:mfxIn .7s cubic-bezier(.2,.8,.2,1) forwards}
  html body.page-home #home-page .hp-grid4>*:nth-child(1){animation-delay:.05s}
  html body.page-home #home-page .hp-grid4>*:nth-child(2){animation-delay:.15s}
  html body.page-home #home-page .hp-grid4>*:nth-child(3){animation-delay:.25s}
  html body.page-home #home-page .hp-grid4>*:nth-child(4){animation-delay:.35s}
  @keyframes mfxIn{to{opacity:1;transform:none}}
  /* แสงกวาดผ่านการ์ดสรุป */
  html body.page-home #home-page .hp-grid4>*{position:relative;overflow:hidden}
  html body.page-home #home-page .hp-grid4>*::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:mfxSweep 7s ease-in-out infinite;pointer-events:none}
  html body.page-home #home-page .hp-grid4>*:nth-child(2)::after{animation-delay:1.2s}
  html body.page-home #home-page .hp-grid4>*:nth-child(3)::after{animation-delay:2.4s}
  html body.page-home #home-page .hp-grid4>*:nth-child(4)::after{animation-delay:3.6s}
  @keyframes mfxSweep{0%,62%{left:-60%}100%{left:130%}}
  /* การ์ดล่างลอยขึ้นตอนเปิด */
  html body.page-home #home-page>section,html body.page-home #home-page>div:not(.hp-grid4){animation:mfxIn .8s .45s cubic-bezier(.2,.8,.2,1) both}
}
/* การ์ดกระจก (ไม่ใช้แอนิเมชัน เปิดเสมอ) */
html body.page-home #home-page .hp-grid4>*{box-shadow:0 10px 30px rgba(15,23,42,.28),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.22)}
</style>
