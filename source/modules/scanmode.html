<style id="sm-css">
#qs-mode{order:1;flex:none;display:flex;gap:6px;padding:4px;margin:6px 0 10px;background:#e8edf7;border-radius:16px}
#qs-mode button{flex:1;border:0;border-radius:12px;padding:10px 8px;font:700 14px/1.2 Sarabun,sans-serif;color:#475569;background:transparent;transition:all .15s}
#qs-mode button.on{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(15,23,42,.14)}
#qs-mode button small{display:block;font:500 11px Sarabun,sans-serif;color:#64748b;margin-top:2px}
#qs-count{order:1;flex:none;display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:1px solid #86efac;color:#14532d;font:700 14px Sarabun,sans-serif}
#qs-count b{font-size:24px;line-height:1}
#qs-count label{display:flex;align-items:center;gap:6px;font:600 12.5px Sarabun,sans-serif;color:#166534}
#qs-bigscan{order:2;flex:none;display:none;width:100%;margin:0 0 10px;border:0;border-radius:20px;padding:18px 14px;font:800 20px Sarabun,sans-serif;color:#fff;background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 10px 22px -10px rgba(249,115,22,.85),inset 0 1px 0 rgba(255,255,255,.45)}
#qs-bigscan:active{transform:scale(.98)}
#qs-bigscan svg{width:22px;height:22px;flex:none}
#quick-scan-modal.qs-single #qs-count{display:flex}
#quick-scan-modal.qs-single .qs-sec.new,#quick-scan-modal.qs-single #qs-pv-new,#quick-scan-modal.qs-single .qs-pv-arrow,#quick-scan-modal.qs-single .qs-pv-h{display:none !important}
@media (max-width:640px){#quick-scan-modal #qs-bigscan{display:block}
#quick-scan-modal #qs-month-name{position:absolute !important;left:0;top:0;height:auto !important;font-size:12px !important;line-height:19px;color:#047857}
#quick-scan-modal .qs-grid>div:has(>#qs-month-name){position:relative}
#quick-scan-modal .qs-grid #qs-bigscan{display:flex;align-items:center;justify-content:center;gap:6px;margin:7px 0 0 !important;width:100% !important;height:48px;padding:0 6px !important;border-radius:14px;font:800 16px Sarabun,sans-serif;white-space:nowrap}
#quick-scan-modal .qs-grid>div{min-width:0}
#quick-scan-modal .qs-grid .qs-in{min-width:0;width:100%;box-sizing:border-box}
#quick-scan-modal .qs-sec:not(.new) .cam-btn{display:none !important}
#quick-scan-modal.qs-single h2{order:-1 !important}
#quick-scan-modal.qs-single .qs-types{order:0 !important;margin-bottom:8px;position:sticky;top:0;z-index:20;padding:6px 0;background:#f8fafc;box-shadow:0 6px 10px -8px rgba(15,23,42,.4)}
#quick-scan-modal.qs-single .qs-types .qs-type-btn{padding-top:8px;padding-bottom:8px;min-height:0;height:52px}
#quick-scan-modal:not(.qs-single) .qs-types{position:sticky;top:0;z-index:20;padding:6px 0;background:#f8fafc;box-shadow:0 6px 10px -8px rgba(15,23,42,.4)}
#quick-scan-modal:not(.qs-single) .qs-types .qs-type-btn{padding-top:8px;padding-bottom:8px;min-height:0;height:52px}}
</style>
<script id="sm-js">
(function(){ try{
  var M=document.getElementById('quick-scan-modal'); if(!M) return;
  var h2=M.querySelector('h2'); if(!h2) return;
  var KEY='pawn_qs_mode', KC='pawn_qs_cont';
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
  var bar=document.createElement('div'); bar.id='qs-mode';
  bar.innerHTML='<button type="button" data-m="full">สแกน<small>ตั๋วเดิม + ตั๋วใหม่</small></button><button type="button" data-m="single">สแกน<small>ตั๋วเดิมอย่างเดียว</small></button>';
  var cnt=document.createElement('div'); cnt.id='qs-count'; cnt.innerHTML='<span>วันนี้บันทึกแล้ว <b id="qs-count-n">0</b> ใบ</span><label><input type="checkbox" id="qs-cont"> สแกนต่อเนื่อง</label>';
  var anchor=M.querySelector('.qs-types')||h2.nextElementSibling; (anchor?anchor.parentNode:h2.parentNode).insertBefore(bar,anchor||null);
  anchor.parentNode.insertBefore(cnt,anchor);
  var big=document.createElement('button'); big.type='button'; big.id='qs-bigscan'; big.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg><span>สแกน</span>';
  var mc=document.getElementById('qs-month-name'); if(mc&&mc.parentElement) mc.parentElement.appendChild(big); else anchor.parentNode.insertBefore(big,anchor);
  big.addEventListener('click',function(){ var b=document.querySelector('#qs-ticket').parentElement.querySelector('.cam-btn'); if(b) b.click(); });
  function mode(){ return ls(KEY)==='single'?'single':'full'; }
  function count(){ var n=0, k=(typeof currentDate!=='undefined')?currentDate:''; try{ var d=db[k]; if(d&&d.months) d.months.forEach(function(m){ (d.data[m]||[]).forEach(function(r){ if(r&&r.ticket&&r.type) n++; }); }); }catch(e){} var e=document.getElementById('qs-count-n'); if(e) e.textContent=n; }
  function apply(){ var s=mode()==='single'; M.classList.toggle('qs-single',s); bar.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===(s?'single':'full')); }); count(); }
  bar.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; ls(KEY,b.dataset.m); apply(); });
  var cc=cnt.querySelector('#qs-cont'); cc.checked=ls(KC)==='1'; cc.addEventListener('change',function(){ ls(KC,cc.checked?'1':'0'); });
  new MutationObserver(function(){ if(M.classList.contains('on')||!M.classList.contains('hidden')) count(); }).observe(M,{attributes:true,attributeFilter:['class']});
  var msg=document.getElementById('qs-msg');
  if(msg) new MutationObserver(function(){ if(/^บันทึกแล้ว/.test(msg.textContent)){ count(); if(mode()==='single'&&cc.checked){ setTimeout(function(){ var b=document.querySelector('#qs-ticket').parentElement.querySelector('.cam-btn'); if(b) b.click(); },500); } } }).observe(msg,{childList:true,characterData:true,subtree:true});
  /* โหมดสแกนตั๋วเดิม: กด Enter ที่ยอดเงิน = บันทึกเลย (ทุกประเภท เพราะไม่มีตั๋วใหม่) */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||mode()!=='single'||!M.classList.contains('qs-single')) return; var id=e.target&&e.target.id;
    if(id!=='qs-amount') return; var tk=document.getElementById('qs-ticket'); if(!tk||!tk.value.trim()) return;
    e.preventDefault(); e.stopPropagation(); if(typeof window.submitQuickScan==='function') window.submitQuickScan();
  },true);
  apply();
}catch(e){ try{console.error(e)}catch(_){} } })();

/* ปุ่มประเภทตั๋ว ส พ ผ ถ ในหน้ากล้องสแกน */
(function(){ try{
  var ov=document.getElementById('cam-ov'), ty=document.getElementById('qs-type'); if(!ov||!ty||document.getElementById('cam-types')) return;
  var st=document.createElement('style'); st.textContent='#cam-ov .cam-bot .cam-tp{display:flex;gap:8px;align-items:center}#cam-ov .cam-bot .cam-tp span{font:700 13px Sarabun,sans-serif;color:#94a3b8;white-space:nowrap}#cam-ov .cam-bot .cam-tp button{flex:1;height:44px;border-radius:12px;font:800 20px Sarabun,sans-serif;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.28);box-shadow:none;color:#fff;padding:0}#cam-ov .cam-bot .cam-tp button.on{background:linear-gradient(135deg,#fbbf24,#f97316);border-color:#fbbf24;color:#fff}'; document.head.appendChild(st);
  var row=document.createElement('div'); row.id='cam-types'; row.className='cam-tp'; row.innerHTML='<span>ประเภท</span>';
  ['ส','พ','ผ','ถ'].forEach(function(t){ var b=document.createElement('button'); b.type='button'; b.textContent=t; b.dataset.t=t;
    b.addEventListener('click',function(){ ty.value=(ty.value===t)?'':t; try{qsPaintType()}catch(e){} paint(); try{navigator.vibrate&&navigator.vibrate(10)}catch(e){} });
    row.appendChild(b); });
  function paint(){ row.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',ty.value===b.dataset.t); }); }
  var bot=ov.querySelector('.cam-bot'); if(bot) bot.insertBefore(row,bot.firstChild);
  new MutationObserver(paint).observe(ov,{attributes:true,attributeFilter:['class']});
  ty.addEventListener('change',paint); paint();
}catch(e){ try{console.error(e)}catch(_){} } })();
</script>
