    hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 15h4l5 2h5a2 2 0 0 0 0-4h-4"/><path d="M6 15v5H2M16 13l4-2a2 2 0 0 1 2 3l-7 5H9"/><circle cx="15" cy="6" r="3"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
    scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>',
    bar:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="2" height="14"/><rect x="7" y="5" width="1" height="14"/><rect x="10" y="5" width="2" height="14"/><rect x="14" y="5" width="1" height="14"/><rect x="17" y="5" width="2" height="14"/><rect x="20" y="5" width="1" height="14"/></svg>',
    clk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };
  var TW={'ส':['ส่งดอก',I.coins,1],'พ':['เพิ่ม',I.plus,2],'ผ':['ผ่อน',I.hand,3],'ถ':['ไถ่ถอน',I.back,4]};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function thDate(k){ var p=String(k||'').split('-'); var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return p.length===3?(+p[2])+' '+MS[+p[1]-1]+' '+(+p[0]+543):''; }
  function head(){
    var panel=M.firstElementChild; if(!panel) return;
    var h=document.getElementById('qsx-head');
    if(!h){ h=document.createElement('div'); h.id='qsx-head'; h.innerHTML='<span class="lg">'+I.scale+'</span><span class="tt"><b>'+I.bolt+'คีย์ด่วน</b><small>บันทึกข้อมูลทะเบียนทรัพย์รับจำนำ</small></span><span class="dt">'+I.cal+'<span id="qsx-date"></span></span>'; panel.insertBefore(h,panel.firstChild); }
    var d=document.getElementById('qsx-date'); if(d){ var t=thDate(typeof currentDate!=='undefined'?currentDate:''); d.textContent=t?'วันที่ '+t:''; }
  }
  function decorate(){
    M.classList.add('qsx'); head();
    M.querySelectorAll('.qs-type-btn').forEach(function(b){ var t=b.dataset.type, w=TW[t]; if(!w||b.querySelector('.k')) return; b.innerHTML='<span class="k">'+esc(t)+'</span><span class="w">'+w[1]+esc(w[0])+'</span>'; b.setAttribute('aria-label',t+' '+w[0]); });
    M.querySelectorAll('#qs-mode button').forEach(function(b,i){ if(b.querySelector('.qsx-bi')) return; var t=document.createElement('span'); t.className='t'; while(b.firstChild) t.appendChild(b.firstChild); var s=document.createElement('span'); s.className='qsx-bi'; s.innerHTML=i?I.bar:I.scan; b.appendChild(s); b.appendChild(t); });
    var cb=M.querySelector('button[onclick*="qsClearFields"]'); if(cb&&cb.textContent.trim()==='ล้างช่อง') cb.textContent='ล้างข้อมูล';
    M.querySelectorAll('.qs-sec').forEach(function(s){ var h=s.querySelector('h3'); if(h&&!h.querySelector('svg')) h.insertAdjacentHTML('afterbegin',s.classList.contains('new')?I.swap:I.cal); });
  }
  /* รายการวันนี้ → ตาราง ลำดับ/เวลา/ประเภท/เลขตั๋ว·เล่ม/ยอดเงิน (ข้อมูลชุดเดิม: แถวที่บันทึกจากคีย์ด่วนวันนี้ ใหม่สุดอยู่บน) */
  var orig=window.qsRenderRecent;
  function render(){
    var box=document.getElementById('qs-recent'); if(!box||typeof db==='undefined') return orig&&orig.apply(this,arguments);
    var d=db[currentDate], items=[];
    if(d&&Array.isArray(d.months)) d.months.forEach(function(m){ if(!m||!d.data||!Array.isArray(d.data[m])) return; d.data[m].forEach(function(r,i){ if(r&&r.attachedAt) items.push({m:m,i:i,r:r}); }); });
    items.sort(function(a,b){ return String(b.r.attachedAt).localeCompare(String(a.r.attachedAt)); });
    var all=document.getElementById('qs-show-all'); all=all&&all.checked; var list=all?items:items.slice(0,8);
    var c=document.getElementById('qs-recent-count'); if(c) c.textContent=items.length?'('+items.length+' ใบ)':'';
    var fm=function(v){ try{ return formatNumber(v); }catch(e){ return String(v); } };
    var h='<div id="qsx-tb"><div class="r h"><span>ลำดับ</span><span>เวลา</span><span>ประเภท</span><span>เลขตั๋ว / เล่ม</span><span>ยอดเงิน</span></div>';
    if(!list.length) h+='<div class="em">ยังไม่มีรายการวันนี้</div>';
    list.forEach(function(x,k){ var r=x.r, t=String(r.type||'').trim(), w=TW[t];
      var tm=String(r.timestamp||'').replace(/:\d\d$/,'').slice(0,5);
      h+='<div class="r"><span class="no">'+(k+1)+'</span><span class="tm">'+I.clk+esc(tm||'-')+'</span><span>'+(w?'<span class="qsx-ty t'+w[2]+'"><b>'+esc(t)+'</b>'+esc(w[0])+'</span>':esc(t||'-'))+'</span>'+
        '<span class="tk">'+esc(r.ticket)+' / '+esc(r.book||'–')+(r.newTicket?'<small>→ '+esc(r.newTicket)+' / '+esc(r.newBook||'–')+'</small>':(t==='ถ'?'':'<small class="qs-nonew" style="color:#94a3b8">ไม่มีตั๋วใหม่</small>'))+'</span>'+
        '<span class="am">'+(String(r.amount==null?'':r.amount).trim()?fm(r.amount):'-')+(r.newTicket?'<button type="button" class="ul" data-m="'+esc(x.m)+'" data-i="'+x.i+'" onclick="qsUnlink(this)">ยกเลิกการติด</button>':'')+'</span></div>'; });
    box.innerHTML=h+'</div>';
  }
  if(typeof orig==='function'){ window.qsRenderRecent=render; try{ qsRenderRecent=render; }catch(e){} }
  var oo=window.openQuickScanModal;
  if(typeof oo==='function'){ var w=function(){ var r=oo.apply(this,arguments); try{ decorate(); render(); }catch(e){ console.error('qsx',e); } return r; }; window.openQuickScanModal=w; try{ openQuickScanModal=w; }catch(e){} }
  decorate();
}catch(e){ try{ console.error('qsx',e); }catch(_){} } })();
</script>
