<style id="lfx-css">
/* เมื่อมีวิดีโอพื้นหลัง ทำการ์ดโปร่งขึ้นให้เห็นโลกด้านหลัง (ข้อความยังอ่านชัด) */
/* ประตูห้องนิรภัยเดิมทึบ บังวิดีโอทั้งจอ: ตอนมีวิดีโอให้โปร่งใส (ยังเลื่อนเปิดตอนปลดล็อกตามเดิม) */
#login-modal.lfx-on .vault-panel{background:transparent!important;background-image:none!important;box-shadow:none!important}
#login-modal.lfx-on .cyber-box{background:rgba(8,16,36,.5)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* ลูกเล่นหน้าล็อกอิน — CSS ล้วน ไม่แตะช่องกรอก PIN/ปุ่ม/ตรรกะ */
#login-modal .cyber-box{box-shadow:0 0 50px rgba(0,0,0,.8),0 0 0 1px rgba(16,185,129,.25),0 0 40px rgba(16,185,129,.18)}
@media (prefers-reduced-motion:no-preference){
  /* การ์ดลอยขึ้นตอนเปิด + ขอบเรืองแสงหายใจ */
  #login-modal .cyber-box{animation:lfxIn .8s cubic-bezier(.2,.8,.2,1) both,lfxGlow 4.5s ease-in-out 1s infinite}
  @keyframes lfxIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes lfxGlow{50%{box-shadow:0 0 50px rgba(0,0,0,.8),0 0 0 1px rgba(16,185,129,.55),0 0 70px rgba(16,185,129,.38)}}
  /* เส้นสแกนวิ่งผ่านการ์ด */
  #login-modal .cyber-box{overflow:visible}
  #login-modal .cyber-box::after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(110,231,183,.9),transparent);box-shadow:0 0 14px rgba(52,211,153,.8);opacity:0;animation:lfxScan 6s ease-in-out 1.2s infinite;pointer-events:none}
  @keyframes lfxScan{0%{top:6%;opacity:0}8%{opacity:.9}50%{top:94%;opacity:.9}58%,100%{top:94%;opacity:0}}
  /* ปุ่มเลขกดแล้วเรืองแสงวูบ */
  #login-keypad button{transition:transform .12s,box-shadow .2s,background .2s}
  #login-keypad button:active{transform:scale(.92);box-shadow:0 0 22px rgba(52,211,153,.65)}
  /* ป้าย SECURE VAULT ลอยเบา ๆ */
  #login-modal .cyber-box>div:first-child{animation:lfxFloat 4s ease-in-out infinite}
  @keyframes lfxFloat{50%{transform:translate(-50%,-58%)}}
}
</style>
<script id="lfx-js">
/* พื้นหลังหน้าล็อกอินเป็นวิดีโอโลก (earth-4k.mp4 4K ~19MB เล่นไปโหลดไป) เล่นวนเงียบ ๆ ด้านหลังการ์ด
   ไม่รับการคลิก · ถ้าโหลดวิดีโอไม่ได้/ประหยัดข้อมูล/ลดการเคลื่อนไหว จะเป็นพื้นหลังมืดตามเดิม · หยุดเล่นเมื่อล็อกอินแล้วหรือสลับแท็บ */
(function(){ try{
  var m=document.getElementById('login-modal'); if(!m) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var cn=navigator.connection; if(cn&&(cn.saveData||/^(slow-2g|2g)$/.test(cn.effectiveType||''))) return;   /* เน็ตช้ามาก/ประหยัดข้อมูล: ไม่โหลดวิดีโอใหญ่ (ไม่ใช้ 3g เป็นเกณฑ์ เพราะมือถือมักรายงานผิดแม้ใช้ไวไฟ) */
  var wrap=document.createElement('div'); wrap.id='lfx-vid'; wrap.style.cssText='position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#020617';
  var v=document.createElement('video'); v.muted=true; v.loop=false; v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload='auto'; v.disablePictureInPicture=true;
  v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%;opacity:0;transition:opacity .9s ease';
  var shade=document.createElement('div'); shade.style.cssText='position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.55),rgba(2,6,23,.25) 40%,rgba(2,6,23,.6))';
  wrap.style.setProperty('display','block','important'); wrap.appendChild(v); wrap.appendChild(shade); m.insertBefore(wrap,m.firstChild);
  var ok=false, FADE=.9;
  v.addEventListener('error',function(){ wrap.remove(); m.classList.remove('lfx-on'); });
  v.addEventListener('canplay',function(){ ok=true; v.style.opacity='1'; m.classList.add('lfx-on'); });
  v.addEventListener('timeupdate',function(){ if(!v.duration) return; var left=v.duration-v.currentTime; v.style.opacity=(left<FADE?Math.max(0,left/FADE):1)*(ok?1:0); });   /* จางลงตรงรอยต่อก่อนวนใหม่ */
  v.addEventListener('ended',function(){ v.style.opacity='0'; setTimeout(function(){ try{ v.currentTime=0; v.play(); v.style.opacity='1'; }catch(e){} },150); });
  v.src='earth-4k.mp4';
  function visible(){ var cs=getComputedStyle(m); return cs.display!=='none'&&cs.visibility!=='hidden'; }
  function sync(){ try{ if(document.hidden||!visible()){ v.pause(); } else { var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); } }catch(e){} }
  /* โหมดประหยัดแบต/นโยบายเบราว์เซอร์อาจบล็อกเล่นอัตโนมัติ: แตะครั้งแรกบนหน้าจอแล้วสั่งเล่นอีกครั้ง */
  function kick(){ try{ if(v.paused&&visible()&&!document.hidden){ var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); } }catch(e){} }
  m.addEventListener('touchstart',kick,{passive:true,once:true}); m.addEventListener('pointerdown',kick,{passive:true,once:true});
  v.addEventListener('stalled',function(){ ok=ok; });
  document.addEventListener('visibilitychange',sync);
  new MutationObserver(sync).observe(m,{attributes:true,attributeFilter:['class','style']});
  sync();
}catch(e){ console.error('lfx',e); } })();
</script>
