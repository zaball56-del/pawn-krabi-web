<style id="bc-css">
/* มือถือ: ไม่ลอยแถบปุ่มทับเหนือคีย์บอร์ดแล้ว (ใช้ปุ่ม "ถัดไป" ของคีย์บอร์ดเอง) ปุ่มบันทึก/ล้างอยู่ท้ายฟอร์ม */
@media (max-width:640px){
html body #quick-scan-modal.fixed #qs-next{display:none !important}
html body #quick-scan-modal.fixed .qs-right > div:last-child{position:static !important;margin:0 !important;padding:6px 0 18px !important;background:none !important;border-top:0 !important}
html body #quick-scan-modal.fixed .qs-right > div:last-child button[onclick*="qsClearFields"]{background:#e2e8f0 !important;border:1.5px solid #94a3b8 !important;color:#334155 !important}
}
/* ประเภท ถ (ไถ่ถอน): ไม่ใช้ตั๋วใหม่ → ทึบ/ล็อกส่วนตั๋วใหม่ */
#quick-scan-modal.qs-redeem .qs-sec.new,#quick-scan-modal.qs-redeem #qs-pv-new,#quick-scan-modal.qs-redeem .qs-pv-arrow{opacity:.28;filter:grayscale(1);pointer-events:none;user-select:none}
#quick-scan-modal.qs-redeem .qs-sec.new .qs-in{background:#e5e7eb}
</style>
<script id="bc-js">
/* แยกค่าบาร์โค้ดตั๋ว (EAN-13): ปีงบประมาณ(2, เริ่ม 1 ต.ค.) + 0(1) + เล่ม(4) + เลขที่(5) + ตัวตรวจสอบ(1) → ใส่ช่องเลขตั๋ว/เล่มที่ให้เอง
   ตัวอย่าง 6900205001342 = ปีงบ 69 · เล่ม 205 · เลขที่ 134 */
(function(){ try{
  function ok13(s){ if(!/^\d{13}$/.test(s)) return false; var t=0; for(var i=0;i<12;i++) t+=(+s[i])*(i%2?3:1); return (10-t%10)%10===+s[12]; }
  function parse(s){ s=String(s||'').trim(); if(/^\d{12}$/.test(s)) s='0'+s; if(!ok13(s)) return null; return {yy:s.slice(0,2),book:String(+s.slice(3,7)),ticket:String(+s.slice(7,12))}; }
  window.__parseTicketBarcode=parse;
  var PAIRS={'qs-ticket':'qs-book','qs-new-ticket':'qs-new-book'};
  function fire(el){ el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); }
  function nz(v){ try{return normalizeCompareTicket(v)}catch(e){return String(v||'').trim().toLowerCase()} }
  function thd(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+(parseInt(p[0],10)+543)}
  var TH0=Date.now();
  /* หาตั๋วใบเดียวกัน (ต้องตรงทั้งเล่มและเลข — แถวที่ไม่มีเล่มไม่นับ เพราะเลขตั๋วซ้ำกันได้ข้ามเล่ม): วันนี้ทุกแถว และวันก่อนหน้าย้อนหลังไม่เกิน 366 วัน (เล่มขึ้นใหม่ทุกปี) */
  function dupInfo(book,ticket){
    var out=[], tk=nz(ticket), bk=nz(book), today=(typeof currentDate!=='undefined')?currentDate:'';
    if(!tk||typeof db==='undefined') return out;
    var lim=today?new Date(today+'T00:00:00').getTime()-366*864e5:0;
    Object.keys(db).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return; var d=db[k]; if(!d||!d.months||!d.data) return;
      if(k!==today && (k>today || new Date(k+'T00:00:00').getTime()<lim)) return;
      d.months.forEach(function(m){ var rows=d.data[m]; if(!rows) return;
        rows.forEach(function(r){ if(!r) return;
          if(r.ticket&&nz(r.ticket)===tk&&bk&&r.book&&nz(r.book)===bk&&(r.type||r.newTicket)) out.push({k:k,m:m,t:r.type||'',ts:r.timestamp||'',as:'ตั๋วเดิม',b:r.book});
          if(r.newTicket&&nz(r.newTicket)===tk&&bk&&r.newBook&&nz(r.newBook)===bk) out.push({k:k,m:m,t:r.type||'',ts:r.timestamp||'',as:'ตั๋วใหม่',b:r.newBook});
        }); });
    });
    return out;
  }
  function warnDup(book,ticket,elId){
    var L=dupInfo(book,ticket); if(!L.length) return;
    try{ if(typeof playSciFiSound==='function') playSciFiSound('access_denied'); }catch(e){}
    try{ navigator.vibrate&&navigator.vibrate([120,80,120]); }catch(e){}
    var today=(typeof currentDate!=='undefined')?currentDate:'';
    var lines=['⚠ ตั๋วใบนี้สแกน/บันทึกไว้แล้ว','','เล่มที่ '+(book||'-')+'   เลขที่ '+ticket,''];
    L.slice(0,5).forEach(function(x){ lines.push('• '+(x.k===today?'วันนี้':thd(x.k))+' · '+x.m+(x.t?' · ประเภท '+x.t:'')+' · เป็น'+x.as+' เล่ม '+x.b+(x.ts?' · '+x.ts:'')); });
    if(L.length>5) lines.push('… และอีก '+(L.length-5)+' รายการ');
    lines.push('','ยืนยัน = เก็บค่าไว้ คีย์ต่อ   ·   ยกเลิก = ล้างช่องนี้');
    if(window.uiConfirm) window.uiConfirm(lines.join('\n')).then(function(ok){ if(!ok){ ['qs-ticket','qs-book','qs-amount','qs-new-ticket','qs-new-book','qs-new-amount'].forEach(function(i){ if((i==='qs-ticket'||i==='qs-book'||i==='qs-amount')===(elId==='qs-ticket')){ var e=document.getElementById(i); if(e){ e.value=''; delete e.dataset.barcode; e.dispatchEvent(new Event('input',{bubbles:true})); } } }); var f=document.getElementById(elId); if(f) f.focus(); } });
  }
  window.__qsDupInfo=dupInfo;
  var busy=false;
  function onIn(e){
    var el=e.target; if(busy||!el||!PAIRS[el.id]) return;
    var r=parse(el.value); if(!r) return;
    var bk=document.getElementById(PAIRS[el.id]); if(!bk) return;
    busy=true;
    try{
      var raw=el.value.trim(); el.value=r.ticket; bk.value=r.book; el.dataset.barcode=raw; fire(el); fire(bk);
      var m=document.getElementById('qs-msg'); if(m){ m.textContent='อ่านบาร์โค้ดแล้ว: ปีงบ '+r.yy+' · เล่ม '+r.book+' · เลขที่ '+r.ticket; m.className='qs-msg ok'; }
      var wd=function(){ warnDup(r.book,r.ticket,el.id); }; setTimeout(wd,60);
      var mon=document.getElementById('qs-month'), amt=document.getElementById(el.id==='qs-ticket'?'qs-amount':'qs-new-amount');
      var next=(el.id==='qs-ticket'&&mon&&!mon.value)?mon:amt; if(next) setTimeout(function(){ try{next.focus();}catch(_){} },30);
    } finally { busy=false; }
  }
  document.addEventListener('input',onIn,true);
  document.addEventListener('change',onIn,true);
}catch(e){ try{console.error(e)}catch(_){} } })();
(function(){ try{
  var M=document.getElementById('quick-scan-modal'); if(!M) return;
  function typ(){ var e=document.getElementById('qs-type'); return e?e.value:''; }
  function apply(){
    var on=typ()==='ถ'; M.classList.toggle('qs-redeem',on);
    ['qs-new-ticket','qs-new-book','qs-new-amount'].forEach(function(id){ var e=document.getElementById(id); if(!e) return; if(on&&e.value){ e.value=''; delete e.dataset.barcode; e.dispatchEvent(new Event('input',{bubbles:true})); } e.disabled=on; });
    var nb=M.querySelector('.qs-sec.new .cam-btn'); if(nb) nb.disabled=on;
  }
  var op=window.qsPaintType; if(typeof op==='function') window.qsPaintType=function(){ var r=op.apply(this,arguments); try{apply()}catch(e){} return r; };
  new MutationObserver(function(){ apply(); }).observe(M,{attributes:true,attributeFilter:['class']});
  /* ประเภท ถ: กด Enter ที่ช่องเลขตั๋ว/เล่ม/ยอดเงิน = บันทึกเลย (ช่องเลข/เล่มต้องมียอดขึ้นแล้ว) */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||typ()!=='ถ') return; var id=e.target&&e.target.id;
    if(id!=='qs-ticket'&&id!=='qs-book'&&id!=='qs-amount') return;
    var tk=document.getElementById('qs-ticket'), am=document.getElementById('qs-amount');
    if(!tk||!tk.value.trim()) return;
    if(id!=='qs-amount'&&!(am&&am.value.trim())) return;
    e.preventDefault(); e.stopPropagation();
    if(typeof window.submitQuickScan==='function') window.submitQuickScan();
  },true);
  apply();
}catch(e){ try{console.error(e)}catch(_){} } })();
</script>
