html body.app-shell:not(.page-home) #m-bar,#tkw-page .bar{
  left:10px !important;right:10px !important;bottom:calc(10px + env(safe-area-inset-bottom)) !important;height:66px !important;padding:0 6px !important;gap:2px !important;
  border-radius:28px !important;border:1px solid rgba(255,255,255,.2) !important;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06)) , rgba(15,23,42,.48) !important;
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:0 12px 32px rgba(2,6,23,.45),inset 0 1px 0 rgba(255,255,255,.22) !important}
#tkw-page .bar{position:absolute !important;z-index:30;width:auto;max-width:620px;margin:0 auto}
#tkw-page{padding-bottom:calc(86px + env(safe-area-inset-bottom)) !important;box-sizing:border-box}
#tkw-page .card{border-radius:18px !important}
#m-bar button,#tkw-page .bar button{color:rgba(226,232,240,.9) !important;font:600 10px/1 Sarabun,sans-serif !important;gap:5px !important;height:54px !important;border-radius:18px !important;background:none !important;transition:background .15s,transform .12s}
#m-bar button:active,#tkw-page .bar button:active,#m-bar button.m-press{background:rgba(255,255,255,.16) !important;transform:scale(.94)}
#m-bar button.main,#tkw-page .bar button.scan{flex:1.8 1 0 !important;height:50px !important;margin:0 4px !important;flex-direction:row !important;gap:7px !important;border-radius:20px !important;font-size:14px !important;font-weight:700 !important;color:#1c1306 !important;
  background:linear-gradient(135deg,#fde68a,#fbbf24 45%,#f59e0b) !important;box-shadow:0 6px 18px rgba(245,158,11,.5),inset 0 1px 0 rgba(255,255,255,.55) !important}
#m-bar button.main b,#tkw-page .bar button.scan b{width:20px;height:20px}
#m-bar button.main:active,#tkw-page .bar button.scan:active{background:linear-gradient(135deg,#fcd34d,#f59e0b) !important;transform:scale(.96)}
#m-bar button:disabled,#tkw-page .bar button:disabled{opacity:.38}
.tl-btn.on{color:#fde68a !important}.tl-btn.on b{color:#fbbf24 !important}
html body.app-shell:not(.page-home) #save-indicator{bottom:88px !important}
html body.app-shell:not(.page-home) #toast{bottom:92px !important}
@media (min-width:900px){#tkw-page .bar{left:max(10px,calc(50% - 310px)) !important;right:max(10px,calc(50% - 310px)) !important}}
@media (max-width:640px){html body.app-shell:not(.page-home) #ledger-page{padding-bottom:96px}}
/* ปุ่มสีสดไล่สี + เงาเรือง (แบบ D) — หน้าเขียนตั๋ว และหน้าบัญชีแยกประเภทบนมือถือ */
html body #tkw-page .dt{background:rgba(255,255,255,.05) !important;border:0 !important;box-shadow:none !important}
html body #tkw-page .dt button{background:linear-gradient(135deg,#818cf8,#6366f1) !important;color:#fff !important;border:0 !important;border-radius:16px !important;box-shadow:0 6px 14px rgba(99,102,241,.55) !important;transition:transform .1s,box-shadow .1s}
html body #tkw-page .dt .td{background:linear-gradient(135deg,#34d399,#10b981) !important;box-shadow:0 6px 14px rgba(16,185,129,.55) !important}
html body #tkw-page .dt input{box-shadow:inset 0 2px 5px rgba(0,0,0,.35) !important}
html body #tkw-page .thd .mb{border:0 !important;color:#fff !important;border-radius:16px !important;box-shadow:0 6px 14px rgba(2,6,23,.4) !important;-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(135deg,#64748b,#475569) !important;transition:transform .1s,box-shadow .1s}
html body #tkw-page #tkw-addcol{background:linear-gradient(135deg,#a78bfa,#7c3aed) !important;box-shadow:0 6px 14px rgba(124,58,237,.55) !important}
html body #tkw-page #tkw-delday{background:linear-gradient(135deg,#fb7185,#e11d48) !important;box-shadow:0 6px 14px rgba(225,29,72,.5) !important;color:#fff !important}
html body #tkw-page .t{background:linear-gradient(135deg,#334155,#1e293b) !important;color:#cbd5e1 !important;border:0 !important;box-shadow:0 4px 10px rgba(2,6,23,.4) !important;transition:transform .1s,box-shadow .1s}
html body #tkw-page .t.on{background:linear-gradient(135deg,#f59e0b,#ea580c) !important;color:#fff !important;box-shadow:0 6px 14px rgba(234,88,12,.55) !important}
html body #tkw-page .t em{background:linear-gradient(180deg,#fcd34d,#f59e0b);box-shadow:0 2px 5px rgba(0,0,0,.35)}
html body #tkw-page .dt button:active,html body #tkw-page .thd .mb:active,html body #tkw-page .t:active{transform:scale(.95);filter:brightness(1.1)}
html body #tkw-page .thd .mb:disabled{opacity:.4;box-shadow:none !important}
html #tkw-page .tabs{padding-bottom:8px !important}
@media (max-width:640px){
 html body.app-shell:not(.page-home) #ledger-page > section.no-print > div:first-child > div:first-child{background:rgba(255,255,255,.05) !important;border:0 !important;box-shadow:none !important}
 html body.app-shell:not(.page-home) #ledger-page > section.no-print > div:first-child > div:first-child > button{background:linear-gradient(135deg,#818cf8,#6366f1) !important;color:#fff !important;border:0 !important;border-radius:16px !important;box-shadow:0 6px 14px rgba(99,102,241,.55) !important;transition:transform .1s}
 html body.app-shell:not(.page-home) #ledger-page > section.no-print > div:first-child > div:first-child > button[onclick*="goToday"]{background:linear-gradient(135deg,#34d399,#10b981) !important;box-shadow:0 6px 14px rgba(16,185,129,.55) !important;font-weight:800}
 html body.app-shell:not(.page-home) #ledger-page #doc-date{box-shadow:inset 0 2px 5px rgba(0,0,0,.35) !important}
 html body.app-shell:not(.page-home) #ledger-page > section.no-print > div:first-child > #ledger-delday{background:linear-gradient(135deg,#fb7185,#e11d48) !important;color:#fff !important;border:0 !important;border-radius:16px !important;box-shadow:0 6px 14px rgba(225,29,72,.5) !important}
 html body.app-shell:not(.page-home) #ledger-page #m-tabs button{background:linear-gradient(135deg,#334155,#1e293b) !important;color:#cbd5e1 !important;box-shadow:0 4px 10px rgba(2,6,23,.4);transition:transform .1s}
 html body.app-shell:not(.page-home) #ledger-page #m-tabs button.on{background:linear-gradient(135deg,#f59e0b,#ea580c) !important;color:#fff !important;box-shadow:0 6px 14px rgba(234,88,12,.55)}
 html body.app-shell:not(.page-home) #ledger-page #m-tabs{padding-bottom:12px !important}
 html body.app-shell:not(.page-home) #ledger-page #m-sum button{border-radius:14px;box-shadow:0 6px 14px rgba(2,6,23,.3),inset 0 1px 0 rgba(255,255,255,.1)}
 html body.app-shell:not(.page-home) #ledger-page > section.no-print > div:first-child button:active,html body.app-shell:not(.page-home) #ledger-page #m-tabs button:active{transform:scale(.95);filter:brightness(1.1)}
}
@media print{#tkw-page .dt,#tkw-page .t,#tkw-page .mb{box-shadow:none !important}}
/* หน้า PIN บนมือถือ: เลื่อนได้ ไม่ตัดหัว/ท้าย และย่อให้พอดีจอเตี้ย (แก้เฉพาะเลย์เอาต์ ไม่แตะระบบ PIN) */
#login-modal{overflow-y:auto !important;overflow-x:hidden !important;align-items:flex-start !important;-webkit-overflow-scrolling:touch}
#login-modal .cyber-box{margin:auto !important;flex:none}
/* วงกลมตกแต่ง (animate-ping 500px) ล้นออกนอกจอ ทำให้เกิดแถบเลื่อนเกินและเลื่อนไม่ได้ → ตัดส่วนที่ล้น */
#login-modal > div.absolute.inset-0{overflow:hidden !important}
@media (max-height:900px){
 #login-modal{padding:10px !important}
 #login-modal .cyber-box{padding:18px 22px 16px !important;border-radius:24px !important}
 #login-modal .cyber-box > div:nth-child(2){margin-bottom:8px !important}
 #login-modal .cyber-box > div:nth-child(2) img{width:54px !important;height:54px !important}
 #login-modal .cyber-box h2{font-size:19px !important;line-height:1.25 !important;margin-bottom:2px !important}
 #login-modal .cyber-box h2 + p{font-size:10px !important;margin-bottom:10px !important}
 #login-modal label{font-size:13px !important;margin-bottom:4px !important}
 #login-modal #login-pin{height:46px !important}
 #login-modal #login-keypad{grid-template-columns:repeat(3,56px) !important;gap:8px !important;margin:8px auto 4px !important}
 #login-modal #login-keypad button{width:56px !important;height:56px !important;font-size:21px !important}
 #login-modal .cyber-box button[type=submit],#login-modal .cyber-box > form > button:last-of-type{height:48px !important}
}
@media print{#m-bar,#tkw-page .bar{display:none !important}}
