<script id="ticketfind-js">
(function(){
  /* ตัวค้นกลาง: ตั๋วเลขนี้ เดือนนี้ เล่มนี้ ยอดเท่าไร มาจากไหน ยืนยันกับ สธ.3 แล้วหรือยัง
     ลำดับ: 1) ทะเบียนทรัพย์รับจำนำ (สธ.3 + สธ.2)  2) แถว สธ.3 ในบัญชี ชนะที่คีย์เองเสมอ
            3) ที่คีย์เอง (บัญชีรายวัน + ตารางเขียนตั๋ว) ย้อนหลังไม่เกิน 365 วัน · อ่านอย่างเดียว ไม่บันทึกให้ */
  var TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  function pad(n){ return n<10?'0'+n:''+n; }
  // ตัวปรับเลขตั๋วตัวเดียวของทั้งระบบ
  window.ticketNorm=function(v){
    try{ return normalizeCompareTicket(v); }catch(e){}
    var t=String(v==null?'':v).trim(); if(!t) return ''; return /^\d+(?:\.0+)?$/.test(t)?String(Number(t)):t.toLowerCase();
  };
  function hasVal(v){ return v!==undefined&&v!==null&&String(v).replace(/,/g,'').trim()!==''&&Number(String(v).replace(/,/g,''))!==0; }
  // ดัชนีตั๋วที่คีย์เอง/แถวในบัญชี สร้างครั้งเดียวแล้วใช้ซ้ำ จนกว่าข้อมูลจะเปลี่ยน (saveDB / บันทึกตารางเขียนตั๋ว) หรือเกิน 30 วินาที
  window.__dv=window.__dv||0;
  (function(){ var os=window.saveDB; if(typeof os==='function'&&!os.__dv){ var w=function(){ window.__dv=(window.__dv||0)+1; return os.apply(this,arguments); }; w.__dv=1; window.saveDB=w; try{ saveDB=w; }catch(e){} } })();
  var IX={map:null,v:-1,at:0};
  function add(m,key,e){ (m[key]=m[key]||[]).push(e); }
  function index(){
    var now=Date.now(); if(IX.map&&IX.v===window.__dv&&now-IX.at<30000) return IX.map;
    var m=Object.create(null), N=window.ticketNorm;
    for(var k in db){
      if(k.indexOf('-')<0||k.length!==10) continue;
      var d=db[k]; if(!d||!d.months||!d.data) continue;
      d.months.forEach(function(mn){ var rows=d.data[mn]; if(!mn||!rows) return; var mname=String(mn).trim();
        rows.forEach(function(r){ if(!r) return;
          if(hasVal(r.amount)){ var t1=N(r.ticket); if(t1) add(m,t1,{date:k,month:mn,mname:mname,amount:String(r.amount).replace(/,/g,''),book:N(r.book),src:'ตั๋ว',man:r.importSource!=='PDF'}); }
          if(r.newTicket&&hasVal(r.newAmount)){ var t2=N(r.newTicket); if(t2) add(m,t2,{date:k,month:mn,mname:mname,amount:String(r.newAmount).replace(/,/g,''),book:N(r.newBook),src:'ตั๋วใหม่',man:true}); }
        }); });
    }
    try{ if(typeof window.tkwAll==='function') window.tkwAll().forEach(function(D){ D.m.forEach(function(mo,g){ var mname=TM[Number(mo)-1]||'';
      (D.r[g]||[]).forEach(function(x){ if(!x) return; var am=String(x[1]==null?'':x[1]).replace(/,/g,''); if(!hasVal(am)) return; var t=N(x[0]); if(!t) return;
        add(m,t,{date:D.k,month:mname,mname:mname,amount:am,book:N(x[2]),src:'ตารางเขียนตั๋ว',man:true,tkw:true}); }); }); }); }catch(e){}
    IX.map=m; IX.v=window.__dv; IX.at=now; return m;
  }
  window.ticketFind=function(ticket,book,month,opts){
    opts=opts||{};
    // เดือนแบบ "อ่อน" (เดือนที่จำไว้จากครั้งก่อน ไม่ได้พิมพ์เอง): ไม่พบในเดือนนั้นให้ลองหาทุกเดือน แล้วบอกว่าเดือนเปลี่ยน
    if(opts.soft&&Number(month)){ var o2={}; for(var kk in opts) o2[kk]=opts[kk]; o2.soft=false;
      var r1=window.ticketFind(ticket,book,month,o2); if(r1.status==='ok') return r1;
      var r2=window.ticketFind(ticket,book,0,o2); if(r2.status==='ok'){ r2.monthFallback=true; return r2; } return r1; }
    var t=window.ticketNorm(ticket), b=window.ticketNorm(book), mn=Number(month)||0;
    if(!t) return {status:'none'};
    var mName=(mn>=1&&mn<=12)?TM[mn-1]:'';
    // 1) ทะเบียนทรัพย์รับจำนำ
    try{ if(typeof window.centralFind==='function'){ var cr=window.centralFind(ticket,book,mn); if(cr) return cr; } }catch(e){}
    var cutKey=''; try{ var cp=String(currentDate).split('-'); if(cp.length===3){ var cd=new Date(Number(cp[0]),Number(cp[1])-1,Number(cp[2]),12); cd.setDate(cd.getDate()-365); cutKey=cd.getFullYear()+'-'+pad(cd.getMonth()+1)+'-'+pad(cd.getDate()); } }catch(e){}
    var curK=(opts.tkwCtx&&typeof window.tkwKey==='function')?window.tkwKey():'';
    var c=(index()[t]||[]).filter(function(x){
      if(cutKey&&x.date<=cutKey) return false;
      if(mName&&x.mname!==mName) return false;
      if(b&&x.book!==b) return false;
      if(x.tkw&&x.date===curK) return false;
      return true; });
    if(!c.length) return {status:'none'};
    // สธ.3 ชนะเสมอ: มีรายการจากรายงาน (PDF) ใช้เฉพาะรายการนั้น ที่คีย์เองใช้เมื่อไม่มีรายงานเท่านั้น
    var pool=c.filter(function(x){return !x.man}); if(!pool.length) pool=c;
    if(!b){ var bs={}; pool.forEach(function(x){ if(x.book) bs[x.book]=1; }); if(Object.keys(bs).length>1) return {status:'multibook'}; }   // รายการที่ไม่มีเล่ม ไม่นับเป็นอีกเล่ม
    pool=pool.slice().sort(function(x,y){ return x.date<y.date?1:(x.date>y.date?-1:0); });
    var best=pool[0], diff=c.some(function(x){ return Number(x.amount)!==Number(best.amount); });
    return {status:'ok',amount:best.amount,date:best.date,month:best.month,src:best.src,differs:diff,book:best.book||'',manual:!!best.man};
  };
})();
</script>
