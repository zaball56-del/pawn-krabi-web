<div id="m-bar" class="no-print"><button type="button" id="m-undo"><b>↶</b>เลิกทำ</button><button type="button" id="m-find"><b>🔍</b>ค้นหา</button><button type="button" class="main" id="m-quick"><b>⚡</b>คีย์ด่วน</button><button type="button" id="m-addrow"><b>＋</b>เพิ่มแถว</button><button type="button" id="m-print"><b>🖨</b>พิมพ์</button></div>
<script id="mob-js">
(function(){
  var MQ=window.matchMedia('(max-width:640px)'), SEL=null, viewCss=null, lastSig='';
  var SH={'มกราคม':'ม.ค.','กุมภาพันธ์':'ก.พ.','มีนาคม':'มี.ค.','เมษายน':'เม.ย.','พฤษภาคม':'พ.ค.','มิถุนายน':'มิ.ย.','กรกฎาคม':'ก.ค.','สิงหาคม':'ส.ค.','กันยายน':'ก.ย.','ตุลาคม':'ต.ค.','พฤศจิกายน':'พ.ย.','ธันวาคม':'ธ.ค.'};
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function num(v){var n=Number(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0}
  function fmt(n){return Math.round(n).toLocaleString('en-US')}
  function compact(n){n=num(n); if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+' ล.'; return fmt(n)}
  function visible(){ var a=$('app-container'); return MQ.matches&&a&&a.style.display==='flex'&&document.body.classList.contains('app-shell')&&!document.body.classList.contains('page-home')&&$('ledger-page'); }
  function day(){ try{ return db[currentDate]; }catch(e){ return null; } }
  function sumRow(d,i){ var a=d&&d.data&&d.data['สรุปประจำวัน']; return (a&&a[i])||{}; }
  function setup(){
    var lp=$('ledger-page'); if(!lp||$('m-ctl')) return !!$('m-ctl');
    var secs=lp.querySelectorAll(':scope > section'); var tableSec=secs[secs.length-1]; if(!tableSec) return false;
    var c=document.createElement('div'); c.id='m-ctl'; c.className='no-print'; c.innerHTML='<div id="m-date"></div><div id="m-sum"></div><div id="m-tabs"></div>';
    lp.insertBefore(c,tableSec);
    var hd=document.querySelector('header > div > div:nth-child(2)');
    if(hd&&!$('m-add')){ var b=document.createElement('button'); b.id='m-add'; b.type='button'; b.textContent='＋'; b.setAttribute('aria-label','เพิ่มแถว'); b.style.display='none'; b.onclick=function(){ try{addRow()}catch(e){} }; hd.insertBefore(b,hd.firstChild); }
    var pn=document.querySelector('#hdr-tools .hdr-menu-panel');
    if(pn&&!$('m-logout')){ var o=document.createElement('button'); o.id='m-logout'; o.type='button'; o.className='menu-item'; o.innerHTML='<i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ'; o.onclick=function(){ try{logout()}catch(e){} }; pn.appendChild(o); }
    $('m-undo').onclick=function(){ try{undoEdit()}catch(e){} };
    $('m-find').onclick=function(){ document.body.classList.toggle('m-search'); if(document.body.classList.contains('m-search')){ var s=$('search-ticket'); if(s) setTimeout(function(){s.focus()},50); } };
    $('m-quick').onclick=function(){ try{openQuickScanModal()}catch(e){} };
    $('m-addrow').onclick=function(){ try{addRow()}catch(e){} };
    $('m-print').onclick=function(){ var b=[].slice.call(document.querySelectorAll('header button')).filter(function(x){return /openPrintPreview/.test(x.getAttribute('onclick')||'')})[0]; if(b) b.click(); else try{openPrintPreview()}catch(e){} };
    $('m-sum').addEventListener('click',function(e){ if(e.target.closest('button')){ SEL='S'; refresh(true); } });
    $('m-tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; SEL=b.getAttribute('data-s'); refresh(true); });
    return true;
  }
  function defaultSel(d){ var ms=d.months||[]; var mi=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][Number(String(currentDate).slice(5,7))-1]; var i=ms.indexOf(mi); return String(i>=0?i:Math.max(0,ms.length-1)); }
  function applyView(d){
    var N=(d.months||[]).length; if(!viewCss){ viewCss=document.createElement('style'); viewCss.id='m-view-css'; document.head.appendChild(viewCss); }
    var T='#ledger-page table', css='@media (max-width:640px){body.app-shell:not(.page-home) ', rules=[];
    function hideMonth(i){ rules.push(T+' thead tr:first-child th:nth-child('+(i+2)+')'); for(var k=1;k<=3;k++){ rules.push(T+' thead tr:nth-child(2) th:nth-child('+(3*i+k)+')'); rules.push(T+' tbody tr td:nth-child('+(3*i+k+1)+')'); } }
    function hideSum(){ rules.push(T+' thead tr:first-child th:nth-child('+(N+2)+')'); for(var k=1;k<=3;k++){ rules.push(T+' thead tr:nth-child(2) th:nth-child('+(3*N+k)+')'); rules.push(T+' tbody tr td:nth-child('+(3*N+k+1)+')'); } }
    if(SEL==='S'){ for(var i=0;i<N;i++) hideMonth(i); }
    else { var s=Number(SEL); for(var j=0;j<N;j++) if(j!==s) hideMonth(j); hideSum(); }
    css=rules.length?('@media (max-width:640px){'+rules.map(function(r){return 'body.app-shell:not(.page-home) '+r}).join(',')+'{display:none !important}}'):'';
    viewCss.textContent=css;
    // โหมดสรุป: แสดงเฉพาะแถวที่มีข้อมูลสรุป (แถวที่ 1-5)
    var rows=document.querySelectorAll('#ledger-page table tbody tr'); for(var r=0;r<rows.length;r++){ rows[r].style.display=(SEL==='S'&&r>4)?'none':''; }
  }
  function numpad(){ try{ document.querySelectorAll('#table-body input, table input').forEach(function(i){ var c=i.className||'', t=i.getAttribute('oninput')||'', b=i.getAttribute('onblur')||'', f=i.getAttribute('onfocus')||''; if(i.type!=='text'||i.getAttribute('inputmode'))return; if(/ticket-input-/.test(c)||/'ticket'/.test(t)||/'book'/.test(t)){i.setAttribute('inputmode','numeric');i.setAttribute('enterkeyhint','next');} else if(/amount-input-/.test(c)||/'amount'/.test(b)||/replace\(\/,\/g/.test(f)||/placeholder/.test(i.outerHTML.slice(0,200))&&/จำนวน/.test(i.getAttribute('placeholder')||'')){i.setAttribute('inputmode','decimal');i.setAttribute('enterkeyhint','next');} }); }catch(e){} }
  function refresh(force){ numpad();
    if(!visible()){ return; } if(!setup()) return;
    var d=day(); if(!d||!Array.isArray(d.months)) return;
    if(SEL===null||(SEL!=='S'&&Number(SEL)>=d.months.length)) SEL=defaultSel(d);
    var rows=['ย/ม','รับจำนำ','ไถ่ถอน','คงเหลือ'].map(function(t,i){var r=sumRow(d,i);return {t:t,c:r.count,a:r.amount}});
    var cnt=d.months.map(function(m){ return (d.data[m]||[]).filter(function(r){return r&&String(r.ticket||'').trim()}).length; });
    var sig=currentDate+'|'+SEL+'|'+JSON.stringify(rows)+'|'+d.months.join(',')+'|'+cnt.join(',')+'|'+document.querySelectorAll('#ledger-page table tbody tr').length;
    if(!force&&sig===lastSig) return; lastSig=sig;
    var dt=$('display-date-th'),dn=$('day-name-display'); $('m-date').textContent=dt?('📅 '+dt.textContent.trim()+' '+(dn?dn.textContent.trim():'')):'';
    $('m-sum').innerHTML=rows.map(function(r,i){ return '<button type="button" class="'+(i===3?'k':'')+'"><small>'+r.t+'</small><b>'+(r.c===''||r.c==null?'-':fmt(num(r.c)))+'</b><i>'+(r.a===''||r.a==null?'&nbsp;':compact(r.a))+'</i></button>'; }).join('');
    $('m-tabs').innerHTML=d.months.map(function(m,i){ return '<button type="button" data-s="'+i+'" class="'+(String(i)===SEL?'on':'')+'">'+esc(SH[m]||m||('ช่อง '+(i+1)))+(cnt[i]?'<em>'+cnt[i]+'</em>':'')+'</button>'; }).join('')+'<button type="button" data-s="S" class="'+(SEL==='S'?'on':'')+'">สรุป</button>';
    applyView(d);
    var u=$('m-undo'),ub=$('ur-u'); if(u&&ub) u.disabled=ub.disabled;
  }
  // เชื่อมกับการวาดตารางใหม่
  function hook(name){ var f=window[name]; if(typeof f!=='function'||f.__mob) return; var w=function(){ var r=f.apply(this,arguments); try{ lastSig=''; setTimeout(function(){refresh(true)},0); }catch(e){} return r; }; w.__mob=1; window[name]=w; try{ eval(name+'=w'); }catch(e){} }
  function init(){ ['renderTable','changeDate','updateSummaryColumn'].forEach(hook); }
  init(); setTimeout(init,1500); setTimeout(init,4000);
  setInterval(function(){ try{ refresh(false); }catch(e){} },700);
  MQ.addEventListener&&MQ.addEventListener('change',function(){ lastSig=''; refresh(true); if(!MQ.matches&&viewCss) viewCss.textContent=''; });
  window.addEventListener('resize',function(){ if(!MQ.matches&&viewCss) viewCss.textContent=''; });
})();

  (function(){ try{
    var btn=document.createElement('button'); btn.id='m-next'; btn.type='button'; btn.textContent='ถัดไป ⏎'; document.body.appendChild(btn);
    var st=document.createElement('style'); st.id='m-next-css'; st.textContent='#m-next{display:none;position:fixed;right:10px;z-index:99990;background:#f59e0b;color:#fff;border:0;border-radius:14px;padding:12px 22px;font:800 17px Sarabun,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35)}@media (min-width:641px){#m-next{display:none !important}}'; document.head.appendChild(st);
    function cur(){ var a=document.activeElement; return a&&a.tagName==='INPUT'&&/numeric|decimal/.test(a.getAttribute('inputmode')||'')&&a.closest('table')?a:null; }
    function place(){ var a=cur(); if(!a||!window.matchMedia('(max-width:640px)').matches){btn.style.display='none';return;} var vv=window.visualViewport; var bottom=vv?(window.innerHeight-(vv.height+vv.offsetTop)):0; btn.style.bottom=(Math.max(0,bottom)+10)+'px'; btn.style.display='block'; }
    document.addEventListener('focusin',function(){setTimeout(place,50)}); document.addEventListener('focusout',function(){setTimeout(place,150)});
    if(window.visualViewport){ visualViewport.addEventListener('resize',place); visualViewport.addEventListener('scroll',place); }
    btn.addEventListener('pointerdown',function(e){e.preventDefault()});
    btn.addEventListener('click',function(){ var a=cur(); if(!a)return; a.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true})); setTimeout(function(){ if(document.activeElement===a||!document.activeElement||document.activeElement===document.body){} place(); },80); });
  }catch(e){} })();

  (function(){ try{
    var m=document.getElementById('quick-scan-modal'); if(!m)return;
    ['qs-ticket','qs-book','qs-new-ticket','qs-new-book'].forEach(function(id){var e=document.getElementById(id); if(e){e.setAttribute('inputmode','numeric');}});
    var bar=m.querySelector('.qs-right > div:last-child'); if(bar&&!document.getElementById('qs-next')){ var nb=document.createElement('button'); nb.type='button'; nb.id='qs-next'; nb.textContent='ถัดไป ⏎'; nb.addEventListener('pointerdown',function(e){e.preventDefault()}); nb.addEventListener('click',function(){ var a=document.activeElement; if(!a||!/^qs-/.test(a.id||''))a=document.getElementById('qs-month'); if(a===document.getElementById('qs-month')&&document.activeElement!==a)a.focus(); a.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true})); }); bar.insertBefore(nb,bar.firstChild); }
    function fit(){ if(!window.matchMedia('(max-width:640px)').matches||!window.visualViewport){m.style.top='';m.style.height='';m.style.bottom='';return;} var v=visualViewport; m.style.bottom='auto'; m.style.top=v.offsetTop+'px'; m.style.height=v.height+'px'; }
    if(window.visualViewport){ visualViewport.addEventListener('resize',fit); visualViewport.addEventListener('scroll',fit); }
    new MutationObserver(fit).observe(m,{attributes:true,attributeFilter:['class']}); fit();
  }catch(e){} })();

  (function(){ try{
    var ov=document.createElement('div'); ov.id='cam-ov';
    ov.innerHTML='<video id="cam-v" playsinline muted autoplay></video><div class="cam-top"><span id="cam-t">สแกนบาร์โค้ด</span><button type="button" id="cam-x">ปิด ✕</button></div><div class="cam-fr"></div><div class="cam-hint">วางบาร์โค้ดให้เต็มกรอบแนวนอน ห่างราว 15–20 ซม. ถือให้นิ่ง</div><div class="cam-bot"><div id="cam-raw">ส่องบาร์โค้ดให้อยู่ในกรอบสีส้ม</div><div class="cam-row"><button type="button" id="cam-torch" aria-label="ไฟฉาย">🔦</button><button type="button" id="cam-zoom" aria-label="ซูม">🔍 1×</button><button type="button" id="cam-pic">ถ่ายรูปบาร์โค้ดแทน</button></div><input type="file" id="cam-file" accept="image/*" capture="environment" style="display:none"></div>';
    document.body.appendChild(ov);
    var stream=null,timer=null,det=null,target=null,busy=false;
    function $(i){return document.getElementById(i)}
    function raw(t){$('cam-raw').textContent=t}
    function stop(){ if(timer){clearInterval(timer);timer=null} if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null} ov.classList.remove('on'); var tb=document.getElementById('cam-torch'); if(tb)tb.classList.remove('on'); }
    function done(v){ var el=$(target); stop(); try{ navigator.vibrate&&navigator.vibrate(70); }catch(e){} if(!el)return; el.value=String(v).trim(); el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); try{ var o=$('qs-msg'); if(o&&el.value===String(v).trim()){o.textContent='สแกนได้: '+v;} }catch(e){} el.focus(); }
    function mk(){ if(det)return det; if(!('BarcodeDetector' in window))return null; try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128','code_39','itf']}); }catch(e){ try{det=new BarcodeDetector();}catch(e2){det=null} } return det; }
    var lastV='';
    function accept(v,needTwice){ v=String(v||'').trim(); var P=window.__parseTicketBarcode;
      if(/^\d{12,13}$/.test(v)&&P&&!P(v)){ try{ var BL=JSON.parse(localStorage.getItem('pawn_bc_rej')||'[]'); BL.push({d:(typeof currentDate!=='undefined'?currentDate:''),v:v,t:Date.now()}); localStorage.setItem('pawn_bc_rej',JSON.stringify(BL.slice(-100))); if(window.__ckSoon) window.__ckSoon(); }catch(e){} raw('อ่านได้ '+v+' แต่ไม่ตรงรูปแบบตั๋ว (อาจอ่านผิด) — ขยับแล้วสแกนใหม่'); lastV=''; return false; }
      if(needTwice&&v!==lastV){ lastV=v; return false; }
      done(v); return true; }
    async function tick(){ if(busy||!stream)return; busy=true; try{ var r=await det.detect($('cam-v')); if(r&&r.length){ accept(r[0].rawValue,true); } }catch(e){} busy=false; }
    var zl=[1],zi=0;
    async function tune(){ zl=[1]; zi=0; var zb=$('cam-zoom'); zb.style.display='none';
      try{ var t=stream&&stream.getVideoTracks()[0]; var cp=t&&t.getCapabilities&&t.getCapabilities(); if(!cp) return;
        if(cp.focusMode&&cp.focusMode.indexOf&&cp.focusMode.indexOf('continuous')>=0){ try{ await t.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){} }
        if(cp.zoom&&cp.zoom.max>1){ var mn=cp.zoom.min||1,mx=cp.zoom.max; zl=[mn]; [2,3].forEach(function(z){ if(z>mn&&z<=mx) zl.push(z); }); if(zl.length>1){ zi=(zl.length>1)?1:0; await t.applyConstraints({advanced:[{zoom:zl[zi]}]}); zb.textContent='🔍 '+zl[zi]+'×'; zb.style.display=''; } }
      }catch(e){} }
    $('cam-zoom').onclick=async function(){ try{ var t=stream&&stream.getVideoTracks()[0]; if(!t||zl.length<2) return; zi=(zi+1)%zl.length; await t.applyConstraints({advanced:[{zoom:zl[zi]}]}); this.textContent='🔍 '+zl[zi]+'×'; }catch(e){} };
    async function open(id){ target=id; lastV=''; try{ var ae=document.activeElement; if(ae&&ae.blur) ae.blur(); }catch(e){} var d=mk(); ov.classList.add('on'); raw('กำลังเปิดกล้อง...');
      if(!d){ raw('เบราว์เซอร์นี้ยังไม่รองรับสแกนสด ใช้ปุ่มถ่ายรูปแทนได้ (หรือเปิดด้วย Chrome บน Android)'); }
      try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false}); var v=$('cam-v'); v.srcObject=stream; await v.play(); raw('ส่องบาร์โค้ดให้อยู่ในกรอบสีส้ม'); await tune(); if(d) timer=setInterval(tick,160); }
      catch(e){ raw('เปิดกล้องไม่ได้: '+(e&&e.name||e)+' (ตรวจสอบว่ากดอนุญาตใช้กล้อง) · ใช้ปุ่มถ่ายรูปแทนได้'); } }
    $('cam-x').onclick=stop;
    $('cam-torch').onclick=async function(){ try{ var t=stream&&stream.getVideoTracks()[0]; var cp=t&&t.getCapabilities&&t.getCapabilities(); if(!cp||!cp.torch){raw('เครื่องนี้เปิดไฟฉายผ่านเว็บไม่ได้');return;} var on=!this.classList.contains('on'); await t.applyConstraints({advanced:[{torch:on}]}); this.classList.toggle('on',on); }catch(e){raw('เปิดไฟฉายไม่ได้');} };
    $('cam-pic').onclick=function(){ $('cam-file').click() };
    $('cam-file').onchange=async function(){ var f=this.files&&this.files[0]; this.value=''; if(!f)return; var d=mk(); if(!d){raw('เบราว์เซอร์นี้อ่านบาร์โค้ดจากรูปไม่ได้');return;} raw('กำลังอ่านรูป...'); try{ var bm=await createImageBitmap(f); var r=await d.detect(bm); if(r&&r.length){accept(r[0].rawValue,false);} else raw('อ่านบาร์โค้ดจากรูปไม่ได้ ลองถ่ายใหม่ให้ใกล้และคมขึ้น'); }catch(e){ raw('อ่านรูปไม่ได้: '+(e&&e.message||e)); } };
    [['qs-ticket','สแกนเลขตั๋วเดิม'],['qs-new-ticket','สแกนเลขตั๋วใหม่']].forEach(function(p){ var inp=$(p[0]); if(!inp)return; var wrap=inp.parentElement; if(!wrap||wrap.querySelector('.cam-btn'))return; var row=document.createElement('div'); row.className='qs-camrow'; var b=document.createElement('button'); b.type='button'; b.className='cam-btn'; b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg><span>สแกน</span>'; b.setAttribute('aria-label',p[1]); inp.style.flex='1'; inp.parentNode.insertBefore(row,inp); row.appendChild(inp); row.appendChild(b); b.onclick=function(){ $('cam-t').textContent=p[1]; open(p[0]); }; });
  }catch(e){ try{console.error(e)}catch(_){} } })();

  (function(){ try{
    var bar=document.getElementById('m-bar'); if(!bar)return; var sx=0,sy=0,id=null,last=0;
    bar.addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; var b=e.target.closest&&e.target.closest('button'); if(b){b.classList.add('m-press'); setTimeout(function(){b.classList.remove('m-press')},220);} });
    bar.addEventListener('pointerup',function(e){ var b=e.target.closest&&e.target.closest('button'); if(!b||b.disabled)return; if(Math.abs(e.clientX-sx)>16||Math.abs(e.clientY-sy)>16)return; if(Date.now()-last<500)return; last=Date.now(); e.preventDefault(); try{navigator.vibrate&&navigator.vibrate(12)}catch(_){} b.click(); });
    bar.addEventListener('click',function(e){ if(e.isTrusted&&Date.now()-last<500){ e.stopPropagation(); e.preventDefault(); } },true);
  }catch(e){} })();
</script>
