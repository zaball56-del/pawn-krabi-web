<script id="scanfx-js">
/* เสียงตอบรับตอนสแกน: บันทึกแล้ว = ติ๊กสูงสั้น · ผิดปกติ/ซ้ำ = เสียงต่ำสองครั้ง (ปิดได้: localStorage pawn_scan_sound = 0) */
(function(){ try{
  var AC=null;
  function on(){ try{ if(window.__scanCfg&&!window.__scanCfg().beep) return false; return localStorage.getItem('pawn_scan_sound')!=='0'; }catch(e){ return true; } }   /* ปิดได้ที่ ตั้งค่า → การใช้งาน → เสียงตอนสแกน */
  function ctx(){ try{ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
  function tone(f,t0,d,v){ var c=ctx(); if(!c) return; var o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; var t=c.currentTime+t0; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.02); }
  window.__scanBeep=function(k){ if(!on()) return; if(k==='ok'){ tone(1320,0,0.09); tone(1760,0.08,0.11); } else if(k==='er'){ tone(330,0,0.16,0.3); tone(260,0.2,0.2,0.3); } };
  function watch(id,okRe,isErr){ var el=document.getElementById(id); if(!el) return; var last='';
    new MutationObserver(function(){ var t=el.textContent||''; if(t===last) return; last=t; if(okRe.test(t)) window.__scanBeep('ok'); else if(isErr(el)) window.__scanBeep('er'); }).observe(el,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']}); }
  watch('tkw-sq-msg',/^บันทึกแล้ว/,function(e){ return /\ber\b/.test(e.className); });
  watch('qs-msg',/^บันทึกแล้ว/,function(e){ return /\berr\b/.test(e.className); });
}catch(e){ try{console.error(e)}catch(_){} } })();
</script>
<script id="scanwake-js">
/* กันจอดับระหว่างสแกน: เปิดหน้าสแกน (เขียนตั๋ว/คีย์ด่วน) หรือกล้องอยู่ = ขอให้จอติดค้าง · ปิดแล้วปล่อยคืน */
(function(){ try{
  if(!('wakeLock' in navigator)) return;
  var lock=null, want=false, asking=false;
  function on(){ var q=function(s){ return document.querySelector(s); };
    return !!(q('#tkw-page.sq-on')&&document.body.classList.contains('tkw-open')) || (function(m){ return !!m&&!m.classList.contains('hidden')&&getComputedStyle(m).display!=='none'; })(q('#quick-scan-modal')) || !!q('#cam-ov.on'); }
  async function get(){ if(lock||asking||document.visibilityState!=='visible') return; asking=true;
    try{ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',function(){ lock=null; }); }catch(e){ lock=null; } asking=false; }
  function rel(){ if(lock){ try{ lock.release(); }catch(e){} lock=null; } }
  function tick(){ want=on(); if(want) get(); else rel(); }
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') tick(); });
}catch(e){} })();
</script>
