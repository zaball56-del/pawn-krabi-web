<style id="as-css">

#as-modal.on{display:flex}

#as-modal .a-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(90deg,#06b6d4,#3b82f6 55%,#8b5cf6);color:#fff}
#as-modal .a-head h3{margin:0;font-size:17px;font-weight:700}#as-modal .a-head p{margin:2px 0 0;font-size:12px;opacity:.92}
#as-modal .a-x{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:20px;cursor:pointer}

#as-modal .a-st{font-size:12.5px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;color:#475569}

#as-modal .a-chip small{display:block;font-size:11.5px;color:#64748b}#as-modal .a-chip b{display:block;font-size:20px;line-height:1.2;color:#0f172a}#as-modal .a-chip i{font-style:normal;font-size:11.5px;color:#64748b}
#as-modal .a-chip.ok{border-top-color:#10b981}#as-modal .a-chip.ok b{color:#047857}#as-modal .a-chip.bad{border-top-color:#ef4444}#as-modal .a-chip.bad b{color:#b91c1c}#as-modal .a-chip.new{border-top-color:#3b82f6}#as-modal .a-chip.new b{color:#1d4ed8}
#as-modal table{width:auto;min-width:420px;border-collapse:collapse;font-size:13px}#as-modal .a-tw{align-self:flex-start;max-width:100%}#as-modal th,#as-modal td{padding-left:16px;padding-right:16px}#as-modal td.r,#as-modal th.r{min-width:130px}
#as-modal th{white-space:nowrap;position:sticky;top:0;background:#e0e7ff;color:#312e81;padding:8px;text-align:left;font-weight:700;border-bottom:1px solid #c7d2fe}
#as-modal td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top;color:#1e293b}
#as-modal td.r,#as-modal th.r{text-align:right}#as-modal td.c{white-space:nowrap}
#as-modal .a-tw{flex:none;border:1px solid #e2e8f0;border-radius:12px;overflow:auto;max-height:36vh;background:#fff}
#as-modal .a-cat{display:flex;flex-wrap:wrap;gap:8px}
#as-modal .a-cat span{background:#eef2ff;border:1px solid #c7d2fe;color:#312e81;border-radius:999px;padding:3px 12px;font-size:12.5px}
#as-modal .a-cat span.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
#as-modal .tk{font-variant-numeric:tabular-nums;font-weight:700;color:#0f172a;white-space:nowrap}
#as-modal .a-sm{font-size:11.5px;color:#64748b}
#as-modal .a-hist{font-size:12.5px;color:#475569}#as-modal .a-hist summary{cursor:pointer;font-weight:700;color:#4338ca}
#as-modal .a-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid #e2e8f0;background:#fff}
#as-modal .a-foot button{border:0;border-radius:10px;padding:9px 18px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
#as-modal .a-cancel{background:#e2e8f0;color:#334155}#as-modal .a-go{background:linear-gradient(90deg,#4f46e5,#0d9488);color:#fff}#as-modal .a-go:disabled{opacity:.4;cursor:not-allowed}
#as-modal .a-split{display:flex;gap:14px;align-items:flex-start}
#as-modal .a-side{flex:1;min-width:260px;display:flex;flex-direction:column;gap:12px}
#as-modal .a-pn{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px}
#as-modal .a-pn h4{margin:0 0 8px;font-size:13px;font-weight:700;color:#312e81}
#as-modal .a-bar{margin:7px 0}#as-modal .a-bar div.t{display:flex;justify-content:space-between;font-size:12.5px;color:#334155}
#as-modal .a-bar div.b{height:8px;border-radius:99px;background:#e2e8f0;margin-top:3px;overflow:hidden}#as-modal .a-bar div.b i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#6366f1)}
#as-modal .a-bar.bad div.b i{background:#ef4444}
#as-modal .a-kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12.5px;color:#475569}#as-modal .a-kv b{color:#0f172a;text-align:right}
#as-modal .a-top{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed #e2e8f0;color:#334155}#as-modal .a-top:last-child{border:0}
@media(max-width:900px){#as-modal .a-split{flex-direction:column;align-items:stretch}#as-modal .a-tw{align-self:stretch}#as-modal table{min-width:0;width:100%}#as-modal th,#as-modal td{padding-left:10px;padding-right:10px}#as-modal td.r,#as-modal th.r{min-width:0}#as-modal .a-side{width:100%;min-width:0}}
@media(max-width:760px){#as-modal .a-chips{grid-template-columns:repeat(2,1fr)}#as-modal{padding:6px}}
</style>
<div id="as-modal" class="no-print" role="dialog" aria-modal="true" aria-label="ฐานข้อมูลทรัพย์สิน">
 <div class="a-box">
  <div class="a-head"><div><h3>ฐานข้อมูลตั๋วตั้งต้น</h3><p>นำเข้ารายงานทะเบียนทรัพย์สิน เก็บเฉพาะ เลขตั๋ว · เล่มที่ · จำนวนเงิน ไว้ตรวจกับตั๋วเดิม</p></div><button class="a-x" type="button" onclick="closeAssetModal()" aria-label="ปิด">×</button></div>
  <div class="a-body">
   <div><label for="as-file">เลือกไฟล์ PDF รายงานทะเบียนทรัพย์สิน</label><input id="as-file" type="file" accept="application/pdf,.pdf" onchange="assetRead(event)"></div>
   <div id="as-st" class="a-st">เลือกไฟล์ PDF เพื่อเริ่มต้น ระบบจะยังไม่บันทึกอะไรจนกว่าจะกดยืนยัน</div>
   <div id="as-main" style="display:none;flex-direction:column;gap:12px">
    <div id="as-chips" class="a-chips"></div>
    <div><input id="as-q" type="text" placeholder="ค้นหาเลขตั๋ว / เล่มที่ / จำนวนเงิน" oninput="assetRender()"></div>
    <div class="a-split"><div class="a-tw"><table><thead><tr><th>เลขตั๋ว</th><th>เล่มที่</th><th class="r">จำนวนเงิน</th></tr></thead><tbody id="as-tb"></tbody></table></div>
    <div id="as-side" class="a-side"></div></div>
    <div id="as-more" class="a-sm"></div>
   </div>
   <details class="a-hist"><summary>ฐานข้อมูลที่บันทึกแล้ว</summary><div id="as-hist"></div></details>
  </div>
  <div class="a-foot"><button class="a-cancel" type="button" onclick="closeAssetModal()">ปิด</button><button id="as-go" class="a-go" type="button" disabled onclick="assetCommit()">บันทึกเป็นฐานข้อมูลตั้งต้น</button></div>
 </div>
</div>
<script id="as-js">
(function(){
  var TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var A={P:null,file:''};
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function fmt0(n){return Number(n||0).toLocaleString('th-TH')}
  var TM={'\u00C9':'\u0E48','\u00CA':'\u0E49','\u00CB':'\u0E4A','\u00CC':'\u0E4B'};
  function dec(s){return String(s||'').replace(/[\u0158-\u0161]/g,function(c){return String(c.charCodeAt(0)-0x158)}).replace(/[\u00C0-\u00FF]/g,function(c){return TM[c]||''}).replace(/\u0E4D\u0E32/g,'\u0E33')}
  function num(v){var n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:n}
  function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}

  async function parse(buf){
    var lib=await window.__ensurePdfjs();
    var pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
    var rows=[],cats=[],grand=null,cur=null,meta={month:0,year:0,printed:''};
    for(var p=1;p<=pdf.numPages;p++){
      var page=await pdf.getPage(p), c=await page.getTextContent();
      var items=c.items.map(function(i){return {s:dec(i.str).trim(),x:i.transform[4],y:i.transform[5]}}).filter(function(i){return i.s!==''});
      if(p===1){
        var txt=items.map(function(i){return i.s}).join(' ');
        var m=new RegExp('('+TH.join('|')+')\\s*(\\d{4})').exec(txt); if(m){meta.month=TH.indexOf(m[1])+1; meta.year=Number(m[2])-(Number(m[2])>2400?543:0);}
        var d=/(\d{2})\/(\d{2})\/(\d{4})/.exec(txt); if(d){var yy=Number(d[3]); if(yy>2400) yy-=543; meta.printed=yy+'-'+d[2]+'-'+d[1];}
      }
      var ev=[];
      items.forEach(function(it){
        if(it.s==='ประเภททรัพย์สิน :') ev.push({k:'hdr',y:it.y,it:it});
        else if(it.x>40&&it.x<80&&/^\d{1,6}\/\d{1,4}$/.test(it.s)) ev.push({k:'row',y:it.y,it:it});
        else if(/^ยอดรวมประเภท/.test(it.s)) ev.push({k:'cat',y:it.y,it:it});
        else if(/^ยอดรวมทั.{0,2}ง/.test(it.s)) ev.push({k:'grand',y:it.y,it:it});
      });
      ev.sort(function(a,b){return b.y-a.y});
      ev.forEach(function(e,i){
        var near=items.filter(function(t){return Math.abs(t.y-e.y)<=3&&t!==e.it});
        if(e.k==='hdr'){ var code=near.filter(function(t){return t.x>110&&t.x<170&&/^\d{3}$/.test(t.s)})[0], nm=near.filter(function(t){return t.x>=170})[0];
          cur={code:code?code.s:'',name:nm?nm.s:''}; return; }
        if(e.k==='cat'||e.k==='grand'){ var n=near.filter(function(t){return t.x>340&&t.x<400&&/^[\d,]+$/.test(t.s)})[0], a=near.filter(function(t){return t.x>=480&&/^[\d,]+\.\d\d$/.test(t.s)})[0];
          var o={code:cur?cur.code:'',name:e.k==='cat'?clean(e.it.s.replace(/^ยอดรวมประเภท\s*:?/,'')):'ทั้งสิ้น',n:n?num(n.s):NaN,amt:a?num(a.s):NaN};
          if(e.k==='cat') cats.push(o); else grand=o; return; }
        // row
        var nxt=ev[i+1], low=nxt?nxt.y+6:-1e9, high=e.y+3;
        var band=items.filter(function(t){return t.y<=high&&t.y>low});
        function col(a,b){return band.filter(function(t){return t.x>=a&&t.x<b}).sort(function(u,v){return v.y-u.y}).map(function(t){return t.s})}
        var w=near.filter(function(t){return t.x>=285&&t.x<336&&/^\d*\.\d+$/.test(t.s)})[0];
        var q=near.filter(function(t){return t.x>=480&&t.x<520&&/^\d+$/.test(t.s)})[0];
        var a=near.filter(function(t){return t.x>=500&&/^[\d,]+\.\d\d$/.test(t.s)})[0];
        var tb=/^(\d+)\/(\d+)$/.exec(e.it.s);
        rows.push({ticket:String(Number(tb[1])),book:String(Number(tb[2])),code:cur?cur.code:'',cat:cur?cur.name:'',desc:clean(col(100,285).join(' ')),weight:w?w.s:'',cond:clean(col(336,405).join(' ')),serial:clean(col(405,480).join(' ')),qty:q?Number(q.s):1,amount:a?num(a.s):NaN,page:p});
      });
    }
    return {rows:rows,cats:cats,grand:grand,meta:meta};
  }
  function monthKey(m){return m.year+'-'+String(m.month).padStart(2,'0')}
  function checks(P){
    var sum=P.rows.reduce(function(s,r){return s+(isNaN(r.amount)?0:r.amount)},0), bad=[];
    P.cats.forEach(function(c){ var rs=P.rows.filter(function(r){return r.code===c.code}); var a=rs.reduce(function(s,r){return s+r.amount},0); c.okN=(rs.length===c.n); c.okA=Math.abs(a-c.amt)<0.01; c.got=rs.length; });
    var ok=!!P.grand&&P.rows.length===P.grand.n&&Math.abs(sum-P.grand.amt)<0.01&&P.cats.every(function(c){return c.okN&&c.okA});
    return {sum:sum,ok:ok};
  }
  window.assetRender=function(){
    var P=A.P; if(!P) return; var ck=checks(P), q=clean($('as-q').value).toLowerCase();
    $('as-chips').innerHTML=[
      ['new','เดือนของรายงาน',(P.meta.month?TH[P.meta.month-1]+' '+(P.meta.year+543):'ไม่พบ'),'พิมพ์เมื่อ '+(P.meta.printed||'-')],
      [ck.ok?'ok':'bad','ใบตั๋วที่อ่านได้',fmt0(P.rows.length)+' ใบ',P.grand?(ck.ok?'✓ ตรงกับยอดรวมและทุกประเภท':'✗ ไม่ตรง รายงาน '+fmt0(P.grand.n)+' ใบ / '+fmt(P.grand.amt)):'ไม่พบยอดรวมท้ายรายงาน'],
      ['ok','จำนวนเงินรวม',fmt(ck.sum),'บาท'],
      ['new','ตรวจยอดตามประเภท',fmt0(P.cats.length),'ประเภท (ใช้ตรวจอย่างเดียว ไม่เก็บ)']].map(function(c){return '<div class="a-chip '+c[0]+'"><small>'+c[1]+'</small><b>'+c[2]+'</b><i>'+c[3]+'</i></div>'}).join('');
    var tot=ck.sum||1, books={}, mn=1e18, mx=0, bmin=1e9, bmax=0;
    P.rows.forEach(function(r){books[r.book]=1; if(r.amount<mn)mn=r.amount; if(r.amount>mx)mx=r.amount; var b=Number(r.book); if(b<bmin)bmin=b; if(b>bmax)bmax=b;});
    var top=P.rows.slice().sort(function(a,b){return b.amount-a.amount}).slice(0,5);
    $('as-side').innerHTML='<div class="a-pn"><h4>สัดส่วนตามประเภททรัพย์</h4>'+P.cats.map(function(c){var pc=Math.round(c.amt/tot*1000)/10; return '<div class="a-bar'+((c.okN&&c.okA)?'':' bad')+'"><div class="t"><span>'+esc(c.name)+' · '+fmt0(c.got)+' ใบ '+((c.okN&&c.okA)?'✓':'✗')+'</span><span>'+pc+'%</span></div><div class="b"><i style="width:'+Math.max(pc,1.5)+'%"></i></div></div>'}).join('')+'</div>'
      +'<div class="a-pn"><h4>สถิติ</h4><div class="a-kv"><span>จำนวนใบ</span><b>'+fmt0(P.rows.length)+'</b><span>เฉลี่ยต่อใบ</span><b>'+fmt(ck.sum/Math.max(1,P.rows.length))+'</b><span>ยอดต่ำสุด / สูงสุด</span><b>'+fmt0(mn)+' / '+fmt0(mx)+'</b><span>ช่วงเล่มที่</span><b>'+bmin+' – '+bmax+'</b><span>จำนวนเล่ม</span><b>'+fmt0(Object.keys(books).length)+'</b></div></div>'
      +'<div class="a-pn"><h4>ยอดสูงสุด 5 ใบ</h4>'+top.map(function(r){return '<div class="a-top"><span>ตั๋ว '+esc(r.ticket)+' · เล่ม '+esc(r.book)+'</span><b>'+fmt(r.amount)+'</b></div>'}).join('')+'</div>';
    var list=P.rows.filter(function(r){return !q||(r.ticket+' '+r.book+' '+r.ticket+'/'+r.book+' '+r.amount).toLowerCase().indexOf(q)>-1});
    var show=list.slice(0,200);
    $('as-tb').innerHTML=show.map(function(r){return '<tr><td><span class="tk">'+esc(r.ticket)+'</span></td><td>'+esc(r.book)+'</td><td class="r">'+fmt(r.amount)+'</td></tr>'}).join('')||'<tr><td colspan="3" style="text-align:center;padding:16px;color:#94a3b8">ไม่พบรายการ</td></tr>';
    $('as-more').textContent=list.length>200?'แสดง 200 จาก '+fmt0(list.length)+' รายการ (พิมพ์ค้นหาเพื่อกรอง)':'แสดง '+fmt0(list.length)+' รายการ';
    $('as-go').disabled=!(P.rows.length&&P.meta.month&&P.meta.printed&&ck.ok);
  };
  function hist(){
    var a=[]; if(typeof db!=='undefined') Object.keys(db).forEach(function(k){ var b=db[k]&&db[k].assetBase; if(b) Object.keys(b).forEach(function(mk){a.push([mk,k,b[mk]])}); });
    a.sort(function(x,y){return x[0]<y[0]?1:-1});
    $('as-hist').innerHTML=a.length?'<table style="margin-top:6px"><thead><tr><th>เดือนที่รับจำนำ</th><th>พิมพ์เมื่อ</th><th class="r">ใบ</th><th class="r">จำนวนเงินรวม</th></tr></thead><tbody>'+a.map(function(x){var m=x[0].split('-');return '<tr><td>'+TH[Number(m[1])-1]+' '+(Number(m[0])+543)+'</td><td>'+esc(x[1])+'</td><td class="r">'+fmt0(x[2].n)+'</td><td class="r">'+fmt(x[2].amt)+'</td></tr>'}).join('')+'</tbody></table>':'<div style="padding:6px 0">ยังไม่มีข้อมูล</div>';
  }
  window.openAssetModal=function(){A.P=null;$('as-file').value='';$('as-main').style.display='none';$('as-go').disabled=true;$('as-st').textContent='เลือกไฟล์ PDF เพื่อเริ่มต้น ระบบจะยังไม่บันทึกอะไรจนกว่าจะกดยืนยัน';hist();$('as-modal').classList.add('on')};
  window.closeAssetModal=function(){$('as-modal').classList.remove('on')};
  window.assetRead=async function(ev){
    var f=ev.target.files&&ev.target.files[0]; if(!f) return; A.file=f.name; A.P=null; $('as-go').disabled=true; $('as-main').style.display='none'; $('as-st').textContent='กำลังอ่าน PDF...';
    try{
      var P=await parse(await f.arrayBuffer());
      if(!P.rows.length) throw new Error('ไม่พบรายการตั๋วใน PDF นี้ (ไม่ใช่รายงานทะเบียนทรัพย์สิน)');
      if(P.rows.some(function(r){return isNaN(r.amount)})) throw new Error('อ่านราคาจำนำบางแถวไม่ได้');
      A.P=P; $('as-st').innerHTML='<b style="color:#047857">อ่านสำเร็จ '+P.rows.length+' รายการ</b> · ไฟล์ '+esc(f.name); $('as-q').value=''; $('as-main').style.display='flex'; assetRender();
    }catch(e){console.error(e);$('as-st').innerHTML='<b style="color:#b91c1c">อ่าน PDF ไม่สำเร็จ</b> '+esc(e.message||e);}
  };
  window.assetCommit=function(){
    var P=A.P; if(!P||typeof db==='undefined') return; var ck=checks(P); if(!ck.ok) return alert('ยอดไม่ตรงกับท้ายรายงาน จึงยังไม่บันทึก');
    var mk=monthKey(P.meta), dk=P.meta.printed;
    var old=null; Object.keys(db).forEach(function(k){ if(db[k]&&db[k].assetBase&&db[k].assetBase[mk]) old=k; });
    if(old&&!confirm('มีฐานข้อมูลเดือน '+TH[P.meta.month-1]+' '+(P.meta.year+543)+' อยู่แล้ว (พิมพ์เมื่อ '+old+')\nต้องการเขียนทับด้วยไฟล์นี้หรือไม่?')) return;
    if(!confirm('บันทึกฐานข้อมูลตั้งต้นเดือน '+TH[P.meta.month-1]+' '+(P.meta.year+543)+'\n'+P.rows.length+' ใบ · '+fmt(ck.sum)+' บาท')) return;
    if(old&&old!==dk){ delete db[old].assetBase[mk]; if(!Object.keys(db[old].assetBase).length) delete db[old].assetBase; }
    var day=db[dk]||getCurrentDayDataForDate(dk);
    day.assetBase=day.assetBase||{};
    day.assetBase[mk]={v:1,file:A.file,at:Date.now(),printed:dk,n:P.rows.length,amt:ck.sum,
      rows:P.rows.map(function(r){return [r.ticket,r.book,r.amount]})};
    saveDB(); try{showToast('บันทึกฐานข้อมูลทรัพย์สิน '+P.rows.length+' ใบ')}catch(e){}
    closeAssetModal();
  };
  // ค้นหาตั๋วจากฐานข้อมูลตั้งต้น: month 1-12 (เดือนที่รับจำนำ), ticket
  // เล่มตั๋วขึ้นใหม่ทุกปี พ.ศ. จึงต้องจับคู่ด้วย ปี+เดือน+เลขตั๋ว+เล่ม
  // ปี (ค.ศ.) ของตั๋วเดิมที่รับจำนำเดือน month เมื่อทำรายการวันที่ dateKey: เดือนที่มากกว่าเดือนของวันนั้นถือเป็นปีก่อนหน้า
  window.__assetYearFor=function(month,dateKey){ var d=String(dateKey||'').split('-'); if(d.length<3) return 0; var y=Number(d[0]),m=Number(d[1]); return Number(month)<=m?y:y-1; };
  window.__assetFindAll=function(month,ticket,year){
    var out=[]; if(typeof db==='undefined') return out; var t=String(Number(ticket)), seen={};
    Object.keys(db).forEach(function(k){ var b=db[k]&&db[k].assetBase; if(!b) return; Object.keys(b).forEach(function(mk){ var pr=mk.split('-'), yy=Number(pr[0]), mm=Number(pr[1]); if(month&&mm!==Number(month)) return; if(year&&yy!==Number(year)) return; b[mk].rows.forEach(function(r){ if(r[0]!==t) return; var key=yy+'|'+mm+'|'+r[1]; if(seen[key]) return; seen[key]=1; out.push({year:yy,month:mm,monthKey:mk,ticket:r[0],book:r[1],amount:r[2],printed:b[mk].printed}); }); }); });
    return out;
  };
  window.__assetFind=function(month,ticket,year){ var a=window.__assetFindAll(month,ticket,year); return a.length===1?a[0]:(a.length?a[a.length-1]:null); };
  window.__assetHasMonth=function(month,year){
    if(typeof db==='undefined') return false; var f=false;
    Object.keys(db).forEach(function(k){ var b=db[k]&&db[k].assetBase; if(b) Object.keys(b).forEach(function(mk){ var pr=mk.split('-'); if(Number(pr[1])===Number(month)&&(!year||Number(pr[0])===Number(year))) f=true; }); });
    return f;
  };
  window.__asset={parse:parse};
  function enable(){
    [].slice.call(document.querySelectorAll('[data-asset-open]')).forEach(function(b){ if(!b.__a){b.__a=1;} });
  }
  enable();
})();
</script>
