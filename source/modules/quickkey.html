<script id="qk-js">
(function(){
  function $(i){return document.getElementById(i)}
  function bind(){
    if(window.__qkBound||typeof window.handleQSEnter!=='function') return; window.__qkBound=1;
    var orig=window.handleQSEnter;
    window.handleQSEnter=function(e,next){
      if(e&&e.key==='Enter'&&e.target&&(e.target.id==='qs-ticket'||e.target.id==='qs-book')){
        try{ if(window.__qsRun) window.__qsRun(); }catch(x){}
        var A=$('qs-amount'),B=$('qs-book');
        if(A&&B&&A.classList.contains('qs-auto')&&B.value.trim()&&A.value.trim()){ e.preventDefault(); var n=$('qs-new-ticket');
          /* ช่องตั๋วใหม่ใช้ไม่ได้ (ประเภท ถ = ปิดไว้ · โหมดตั๋วเดิมอย่างเดียว = ซ่อน) → ไปช่องยอดเงินแทน ไม่ให้เคอร์เซอร์ค้างที่เลขตั๋ว (แก้บั๊ค 24 พ.ย. 69) */
          if(n&&!n.disabled&&n.offsetParent!==null){ n.focus(); n.select(); } else { A.focus(); try{ A.select(); }catch(_){} }
          return; }
      }
      return orig.apply(this,arguments);
    };
  }
  bind(); window.addEventListener('load',bind);
})();
</script>
