<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบพื้นหลังโลก 4K</title>
<style>
html,body{margin:0;height:100%;background:#020617;color:#e6f1ff;font-family:system-ui,"Sarabun",sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.45),rgba(2,6,23,.15) 45%,rgba(2,6,23,.55))}
.card{position:relative;max-width:420px;margin:12vh auto 0;padding:22px;border-radius:24px;background:rgba(8,16,36,.45);backdrop-filter:blur(6px);border:1px solid rgba(16,185,129,.4);text-align:center}
.card h1{font-size:20px;margin:0 0 6px}.card p{margin:4px 0;font-size:13px;opacity:.85}
.pin{margin:14px 0;padding:14px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4)}
#info{position:fixed;left:10px;right:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:10px;line-height:1.5}
</style></head><body>
<video id="v" src="earth-4k.mp4" muted loop playsinline autoplay preload="auto"></video><div class="shade"></div>
<div class="card"><h1>หน้าทดสอบพื้นหลังโลก 4K</h1><p>การ์ดนี้เป็นตัวอย่างจำลอง ไม่ใช่หน้าล็อกอินจริง</p><div class="pin">กรอกรหัส PIN</div><p>เลื่อนดูความคมชัดของโลกด้านหลังการ์ด</p></div>
<div id="info">กำลังโหลดวิดีโอ…</div>
<script>
var v=document.getElementById('v'),t0=performance.now(),i=document.getElementById('info');
v.addEventListener('canplay',function(){ i.textContent='เริ่มเล่นได้ภายใน '+((performance.now()-t0)/1000).toFixed(1)+' วินาที · วิดีโอ '+v.videoWidth+'×'+v.videoHeight+' · ไฟล์ ~19 MB (เล่นไปโหลดไป)'; });
v.addEventListener('error',function(){ i.textContent='โหลดวิดีโอไม่ได้'; });
</script></body></html>
